<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Campus Space">
  <!-- Brand mark: academic cap + orbit ring -->
  <defs>
    <linearGradient id="csGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B33A3A"/>
      <stop offset="100%" stop-color="#8E2C2C"/>
    </linearGradient>
  </defs>
  <!-- Orbit ring -->
  <ellipse cx="32" cy="34" rx="26" ry="9" fill="none" stroke="#003B5C" stroke-width="2.5" transform="rotate(-18 32 34)" opacity="0.9"/>
  <!-- Cap base -->
  <path d="M32 14 L54 24 L32 34 L10 24 Z" fill="url(#csGrad)"/>
  <!-- Cap tassel -->
  <path d="M54 24 L54 36" stroke="#B33A3A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="54" cy="38" r="2.4" fill="#B33A3A"/>
  <!-- Cap body -->
  <path d="M18 27.5 L18 38 Q32 44 46 38 L46 27.5" fill="none" stroke="url(#csGrad)" stroke-width="2.6" stroke-linejoin="round"/>
</svg>