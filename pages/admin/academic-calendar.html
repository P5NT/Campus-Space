<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Calendar — Admin — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar admin-sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Academic Calendar</h1>
              <p class="page-subtitle">
                Manage key session dates for the whole university.
              </p>
            </div>
            <div class="cluster">
              <button
                class="btn btn-secondary"
                id="preview-calendar-btn"
                type="button"
              >
                <i class="fa-solid fa-file-pdf"></i> Preview PDF
              </button>
              <button
                class="btn btn-primary"
                id="edit-calendar-btn"
                type="button"
              >
                <i class="fa-solid fa-pen"></i> Edit calendar
              </button>
            </div>
          </div>

          <!-- Session badge + count -->
          <div class="cluster-between" style="margin-bottom: 16px">
            <div class="cluster">
              <span class="badge badge-brand">2026/2027 Session</span>
              <span class="badge badge-neutral" id="cal-count">—</span>
            </div>
          </div>

          <!-- Semester tabs -->
          <div class="filter-bar" id="cal-tabs" role="tablist">
            <button class="chip is-active" data-semester="all" role="tab">
              All events
            </button>
            <button class="chip" data-semester="First" role="tab">
              First Semester
            </button>
            <button class="chip" data-semester="Second" role="tab">
              Second Semester
            </button>
          </div>

          <!-- First Semester section -->
          <section class="cal-admin-section" id="cal-section-first">
            <div class="cal-admin-section-head">
              <span
                class="cal-admin-section-dot"
                style="background: var(--brand-primary)"
              ></span>
              <h2 class="cal-admin-section-title">First Semester</h2>
              <span class="cal-admin-section-count" id="cal-count-first"
                >0 events</span
              >
            </div>
            <div class="card">
              <div id="cal-first-list"></div>
            </div>
          </section>

          <!-- Second Semester section -->
          <section class="cal-admin-section" id="cal-section-second">
            <div class="cal-admin-section-head">
              <span
                class="cal-admin-section-dot"
                style="background: var(--brand-secondary)"
              ></span>
              <h2 class="cal-admin-section-title">Second Semester</h2>
              <span class="cal-admin-section-count" id="cal-count-second"
                >0 events</span
              >
            </div>
            <div class="card">
              <div id="cal-second-list"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/calendar-events.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/permissions.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script src="../../js/calendar-admin.js"></script>
    <script src="../../js/pdf-generator.js"></script>
    <script>
      /* ==========================================================================
         Academic Calendar — Admin page.
         Reads merged data (demo + overrides) via CalendarAdmin.
         CRUD lives in calendar-admin.js.
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session || !Permissions.isAdminRole(session)) {
          window.location.href = "../auth/login.html";
          return;
        }
        if (!Permissions.can(session, "academics.view")) {
          window.location.href = "dashboard.html";
          return;
        }

        initAppShell("admin");

        var SESSION = "2026/2027";
        var activeSemester = "all";

        var firstList = document.getElementById("cal-first-list");
        var secondList = document.getElementById("cal-second-list");
        var sectionFirst = document.getElementById("cal-section-first");
        var sectionSecond = document.getElementById("cal-section-second");
        var countEl = document.getElementById("cal-count");
        var countFirstEl = document.getElementById("cal-count-first");
        var countSecondEl = document.getElementById("cal-count-second");
        var tabs = document.getElementById("cal-tabs");

        /* ------------------------------------------------------------------
           RENDER
           ------------------------------------------------------------------ */
        function render() {
          var split = CalendarAdmin.getSplitEvents(SESSION);
          var first = split.first;
          var second = split.second;

          countEl.textContent =
            first.length +
            second.length +
            " event" +
            (first.length + second.length === 1 ? "" : "s");

          countFirstEl.textContent =
            first.length + " event" + (first.length === 1 ? "" : "s");
          countSecondEl.textContent =
            second.length + " event" + (second.length === 1 ? "" : "s");

          /* Apply tab filter — show/hide whole sections */
          if (activeSemester === "all" || activeSemester === "First") {
            sectionFirst.style.display = "";
          } else {
            sectionFirst.style.display = "none";
          }
          if (activeSemester === "all" || activeSemester === "Second") {
            sectionSecond.style.display = "";
          } else {
            sectionSecond.style.display = "none";
          }

          renderList(firstList, first, "First");
          renderList(secondList, second, "Second");
        }

        function renderList(wrap, list, semester) {
          wrap.innerHTML = "";

          if (!list.length) {
            wrap.innerHTML =
              '<div class="empty-state" style="padding:32px 20px;">' +
              '<div class="empty-icon"><i class="fa-regular fa-calendar"></i></div>' +
              "<h3>No events yet</h3>" +
              "<p>Click <strong>Edit calendar</strong> to add events for this semester.</p>" +
              "</div>";
            return;
          }

          list.forEach(function (e) {
            var row = document.createElement("div");
            row.className = "cal-admin-row";
            row.innerHTML =
              '<div class="cal-admin-date">' +
              Util.escape(
                e.displayDate ||
                  Util.formatDate(e.isoDate, {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                  }),
              ) +
              "</div>" +
              '<div class="cal-admin-body">' +
              '<div class="cal-admin-title">' +
              Util.escape(e.title) +
              "</div>" +
              (e.desc
                ? '<div class="cal-admin-desc">' +
                  Util.escape(e.desc) +
                  "</div>"
                : "") +
              "</div>" +
              '<div class="cal-admin-actions">' +
              '<button class="btn btn-ghost btn-sm" data-edit type="button" aria-label="Edit event">' +
              '<i class="fa-solid fa-pen"></i>' +
              "</button>" +
              '<button class="btn btn-ghost btn-sm" data-del type="button" aria-label="Delete event" style="color:var(--danger);">' +
              '<i class="fa-solid fa-trash"></i>' +
              "</button>" +
              "</div>";

            row
              .querySelector("[data-edit]")
              .addEventListener("click", function () {
                /* Open the full editor — admin can then adjust this event's
                 row in the section it belongs to */
                CalendarAdmin.openEditor(SESSION);
              });

            row
              .querySelector("[data-del]")
              .addEventListener("click", async function () {
                var ok = await Confirmation.confirm({
                  title: "Delete this event?",
                  message:
                    '"' +
                    e.title +
                    '" will be removed from the academic calendar.',
                  confirmLabel: "Delete",
                  variant: "danger",
                });
                if (!ok) return;

                CalendarAdmin.deleteEvent(SESSION, e.id, function () {
                  render();
                  Toast.success("Event deleted.", "Removed");
                });
              });

            wrap.appendChild(row);
          });
        }

        /* ------------------------------------------------------------------
           TABS
           ------------------------------------------------------------------ */
        tabs.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-semester]");
          if (!btn) return;
          tabs.querySelectorAll(".chip").forEach(function (c) {
            c.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          activeSemester = btn.getAttribute("data-semester");
          render();
        });

        /* ------------------------------------------------------------------
           EDIT BUTTON — opens the full editor
           ------------------------------------------------------------------ */
        document
          .getElementById("edit-calendar-btn")
          .addEventListener("click", function () {
            CalendarAdmin.openEditor(SESSION);
          });

        /* Called by calendar-admin.js after a save */
        window.onCalendarSaved = function () {
          render();
        };

        /* ------------------------------------------------------------------
           PREVIEW PDF — generates the branded document
           ------------------------------------------------------------------ */
        document
          .getElementById("preview-calendar-btn")
          .addEventListener("click", function () {
            if (typeof PdfGenerator === "undefined") {
              Toast.error("Document generator not loaded.", "Error");
              return;
            }

            var split = CalendarAdmin.getSplitEvents(SESSION);
            var all = split.first.concat(split.second);

            /* PdfGenerator's calendar layout expects:
                 { date, title, desc, semester } */
            var data = all.map(function (e) {
              return {
                date:
                  e.displayDate ||
                  Util.formatDate(e.isoDate, {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                  }),
                title: e.title,
                desc: e.desc || "",
                semester: e.semester,
              };
            });

            PdfGenerator.open({
              type: "calendar",
              title: "Academic Calendar",
              subtitle: "2026/2027 Academic Session",
              data: data,
            });
          });

        /* Initial render */
        render();
      });
    </script>
  </body>
</html>
