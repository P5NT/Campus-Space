<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculties — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Faculties</h1>
              <p class="page-subtitle">Manage faculties across OAUSTECH.</p>
            </div>
            <button class="btn btn-primary" data-modal-open="add-faculty-modal">
              <i class="fa-solid fa-plus"></i> Add faculty
            </button>
          </div>

          <div class="grid grid-2" id="faculties-grid"></div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="add-faculty-modal">
      <div class="modal">
        <div class="modal-head">
          <h3>Add faculty</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-faculty-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label"
                >Faculty name <span class="req">*</span></label
              >
              <input
                class="input"
                name="name"
                placeholder="e.g. Faculty of Law"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a faculty name.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Short name <span class="req">*</span></label>
              <input class="input" name="shortName" placeholder="e.g. LAW" />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a short name.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Add faculty</button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        let faculties = DEMO_FACULTIES.map((f) => ({ ...f }));
        const grid = document.getElementById("faculties-grid");

        function render() {
          grid.innerHTML = "";
          faculties.forEach((f, idx) => {
            const card = document.createElement("div");
            card.className = "card card-pad";
            card.innerHTML = `
        <div class="cluster-between" style="margin-bottom:12px;">
          <span class="badge badge-marine">${Util.escape(f.shortName)}</span>
          <span class="badge ${f.active ? "badge-success" : "badge-neutral"}">${f.active ? "Active" : "Inactive"}</span>
        </div>
        <h3 style="font-size:var(--fs-md); margin-bottom:4px;">${Util.escape(f.name)}</h3>
        <p style="font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:16px;">${f.departments.length} department${f.departments.length === 1 ? "" : "s"}</p>
        <div class="cluster">
          <a href="departments.html?faculty=${f.id}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-diagram-project"></i> Departments
          </a>
          <button class="btn btn-ghost btn-sm" data-edit>
            <i class="fa-solid fa-pen"></i> Edit
          </button>
          <button class="btn btn-ghost btn-sm" data-toggle style="color:${f.active ? "var(--danger)" : "var(--success)"};">
            ${f.active ? '<i class="fa-solid fa-ban"></i> Deactivate' : '<i class="fa-solid fa-circle-check"></i> Activate'}
          </button>
        </div>`;
            card.querySelector("[data-edit]").addEventListener("click", () => {
              Toast.info(
                'Editing "' + f.name + '" (simulated).',
                "Edit faculty",
              );
            });
            card
              .querySelector("[data-toggle]")
              .addEventListener("click", async () => {
                const willDeactivate = f.active;
                if (
                  await Confirmation.confirm({
                    title: willDeactivate
                      ? "Deactivate this faculty?"
                      : "Reactivate this faculty?",
                    message: willDeactivate
                      ? "The faculty will no longer appear in the student registration form."
                      : "The faculty will be reactivated.",
                    confirmLabel: willDeactivate ? "Deactivate" : "Reactivate",
                    variant: willDeactivate ? "danger" : "primary",
                  })
                ) {
                  f.active = !f.active;
                  render();
                  Toast.success(
                    "Faculty " +
                      (f.active ? "reactivated" : "deactivated") +
                      ".",
                    "Saved",
                  );
                }
              });
            grid.appendChild(card);
          });
        }
        render();

        bindForm(
          document.getElementById("add-faculty-form"),
          {
            name: [Rules.required],
            shortName: [Rules.required],
          },
          (data) => {
            faculties.push({
              id: "fac-" + Date.now(),
              name: data.get("name"),
              shortName: data.get("shortName"),
              active: true,
              departments: [],
            });
            render();
            Modal.close("add-faculty-modal");
            document.getElementById("add-faculty-form").reset();
            Toast.success("Faculty added.", "Saved");
          },
        );
      });
    </script>
  </body>
</html>
