<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Leader Management — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Student Leaders</h1>
              <p class="page-subtitle">
                Assign leadership positions to registered students.
              </p>
            </div>
            <button
              class="btn btn-primary"
              data-modal-open="assign-leader-modal"
            >
              <i class="fa-solid fa-user-plus"></i> Assign leader
            </button>
          </div>
          <div class="card">
            <div id="leaders-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="assign-leader-modal">
      <div class="modal">
        <div class="modal-head">
          <h3>Assign leadership role</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="assign-leader-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label">Student <span class="req">*</span></label>
              <select class="select" name="studentId" id="l-student">
                <option value="">Select registered student</option>
              </select>
              <div class="field-help">
                Only registered students can be assigned.
              </div>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a student.</span>
              </div>
            </div>
            <div class="field">
              <label class="label"
                >Association <span class="req">*</span></label
              >
              <select class="select" name="associationId" id="l-assoc">
                <option value="">Select association</option>
              </select>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select an association.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Position <span class="req">*</span></label>
              <select class="select" name="positionId" id="l-pos">
                <option value="">Select position</option>
              </select>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a position.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Assign leader</button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        // Populate selects
        const studentSel = document.getElementById("l-student");
        DEMO_STUDENTS.forEach((s) => {
          studentSel.insertAdjacentHTML(
            "beforeend",
            `<option value="${s.id}">${Util.escape(s.firstName + " " + s.lastName)} — @${Util.escape(s.username)} (${Util.escape(s.matric)})</option>`,
          );
        });
        const assocSel = document.getElementById("l-assoc");
        DEMO_ASSOCIATIONS.filter((a) => a.active).forEach((a) => {
          assocSel.insertAdjacentHTML(
            "beforeend",
            `<option value="${a.id}">${Util.escape(a.acronym)} — ${Util.escape(a.name)}</option>`,
          );
        });
        const posSel = document.getElementById("l-pos");
        DEMO_POSITIONS.filter((p) => p.active).forEach((p) => {
          posSel.insertAdjacentHTML(
            "beforeend",
            `<option value="${p.id}">${Util.escape(p.name)}</option>`,
          );
        });

        function render() {
          const listEl = document.getElementById("leaders-list");
          listEl.innerHTML = "";
          const leaders = getLeaderList();
          if (!leaders.length) {
            listEl.innerHTML =
              '<div class="empty-state" style="padding:40px;"><div class="empty-icon"><i class="fa-solid fa-user-tie"></i></div><h3>No leaders assigned</h3></div>';
            return;
          }
          leaders.forEach((l) => {
            const el = document.createElement("div");
            el.className = "resource-row";
            el.innerHTML = `
        <span class="avatar avatar-48 avatar-fallback">${Util.initials(l.student.firstName + " " + l.student.lastName)}</span>
        <div class="resource-info">
          <div class="resource-name">${Util.escape(l.student.firstName + " " + l.student.lastName)} <i class="fa-solid fa-circle-check tag-verified"></i></div>
          <div class="resource-meta">
            <span>@${Util.escape(l.student.username)}</span>
            <span>${Util.escape(l.pos.name)}</span>
            <span>${Util.escape(l.assoc.acronym)}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-remove style="color:var(--danger);" aria-label="Remove leader">
          <i class="fa-solid fa-user-minus"></i>
        </button>`;
            el.querySelector("[data-remove]").addEventListener(
              "click",
              async () => {
                if (
                  await Confirmation.confirm({
                    title: "Remove this leader?",
                    message:
                      "They will lose their leadership tag and public leader profile.",
                    confirmLabel: "Remove",
                    variant: "danger",
                  })
                ) {
                  DEMO_LEADERS.splice(
                    DEMO_LEADERS.findIndex((x) => x.studentId === l.student.id),
                    1,
                  );
                  render();
                  Toast.success("Leader removed.", "Saved");
                }
              },
            );
            listEl.appendChild(el);
          });
        }
        render();

        bindForm(
          document.getElementById("assign-leader-form"),
          {
            studentId: [Rules.required],
            associationId: [Rules.required],
            positionId: [Rules.required],
          },
          (data) => {
            const existing = DEMO_LEADERS.findIndex(
              (l) => l.studentId === data.get("studentId"),
            );
            const entry = {
              studentId: data.get("studentId"),
              associationId: data.get("associationId"),
              positionId: data.get("positionId"),
            };
            if (existing >= 0) DEMO_LEADERS[existing] = entry;
            else DEMO_LEADERS.push(entry);
            render();
            Modal.close("assign-leader-modal");
            document.getElementById("assign-leader-form").reset();
            Toast.success("Leadership role assigned.", "Saved");
          },
        );
      });
    </script>
  </body>
</html>
