<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — Admin — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">News</h1>
              <p class="page-subtitle">Manage editorial news content.</p>
            </div>
            <button class="btn btn-primary" data-modal-open="add-news-modal">
              <i class="fa-solid fa-plus"></i> Publish news
            </button>
          </div>
          <div class="card">
            <div id="news-admin-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="add-news-modal">
      <div class="modal modal-lg">
        <div class="modal-head">
          <h3>Publish news article</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-news-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label">Title <span class="req">*</span></label>
              <input class="input" name="title" />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a title.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Category <span class="req">*</span></label>
              <select class="select" name="category">
                <option value="">Select category</option>
                <option>Campus</option>
                <option>Academics</option>
                <option>Events</option>
                <option>Sports</option>
              </select>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a category.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Excerpt <span class="req">*</span></label>
              <input
                class="input"
                name="excerpt"
                placeholder="Short summary shown in listings"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please add an excerpt.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Body <span class="req">*</span></label>
              <textarea
                class="textarea"
                name="body"
                style="min-height: 180px"
              ></textarea>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please write the article.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Publish</button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/news.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        const listEl = document.getElementById("news-admin-list");
        function render() {
          listEl.innerHTML = "";
          DEMO_NEWS.forEach((n) => {
            const el = document.createElement("div");
            el.className = "resource-row";
            el.innerHTML = `
        <span class="resource-icon"><i class="fa-solid fa-newspaper"></i></span>
        <div class="resource-info">
          <div class="resource-name">${Util.escape(n.title)}</div>
          <div class="resource-meta">
            <span>${Util.escape(n.category)}</span>
            <span>${Util.formatDate(n.date)}</span>
            <span>${Util.escape(n.author)}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-edit><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-ghost btn-sm" data-del style="color:var(--danger);"><i class="fa-solid fa-trash"></i></button>`;
            el.querySelector("[data-edit]").addEventListener("click", () =>
              Toast.info('Edit "' + n.title + '" (simulated).', "Edit news"),
            );
            el.querySelector("[data-del]").addEventListener(
              "click",
              async () => {
                if (
                  await Confirmation.confirm({
                    title: "Delete this article?",
                    message: '"' + n.title + '" will be removed.',
                    confirmLabel: "Delete",
                    variant: "danger",
                  })
                ) {
                  const idx = DEMO_NEWS.findIndex((x) => x.id === n.id);
                  DEMO_NEWS.splice(idx, 1);
                  render();
                  Toast.success("News article deleted.", "Removed");
                }
              },
            );
            listEl.appendChild(el);
          });
        }
        render();

        bindForm(
          document.getElementById("add-news-form"),
          {
            title: [Rules.required],
            category: [Rules.required],
            excerpt: [Rules.required],
            body: [Rules.required, Rules.minLen(20)],
          },
          (data) => {
            DEMO_NEWS.unshift({
              id: "news-" + Date.now(),
              title: data.get("title"),
              category: data.get("category"),
              author: session.name || session.username,
              date: new Date().toISOString().slice(0, 10),
              image: "../../assets/images/news/campus-event-01.jpg",
              excerpt: data.get("excerpt"),
              body: data.get("body"),
            });
            render();
            Modal.close("add-news-modal");
            document.getElementById("add-news-form").reset();
            Toast.success("News published.", "Published");
          },
        );
      });
    </script>
  </body>
</html>
