<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Departments — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar admin-sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Departments</h1>
              <p class="page-subtitle">Departments under each faculty.</p>
            </div>
            <button
              class="btn btn-primary"
              data-modal-open="add-dept-modal"
              type="button"
            >
              <i class="fa-solid fa-plus"></i> Add department
            </button>
          </div>

          <!-- Toolbar -->
          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="dept-search"
                placeholder="Search departments…"
                aria-label="Search departments"
              />
            </div>
            <select
              class="select"
              id="fac-filter"
              aria-label="Filter by faculty"
            >
              <option value="">All faculties</option>
            </select>
          </div>

          <div class="cluster-between" style="margin-bottom: 16px">
            <p class="section-desc" style="margin: 0" id="dept-count">
              Loading…
            </p>
          </div>

          <!-- Grouped list -->
          <div id="dept-list"></div>
        </main>
      </div>
    </div>

    <!-- ============ Add department modal ============ -->
    <div
      class="modal-backdrop"
      id="add-dept-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ad-title"
    >
      <div class="modal">
        <div class="modal-head">
          <h3 id="ad-title">Add department</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-dept-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label" for="ad-faculty"
                >Faculty <span class="req">*</span></label
              >
              <select class="select" name="facultyId" id="ad-faculty">
                <option value="">Select faculty</option>
              </select>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a faculty.</span>
              </div>
            </div>
            <div class="field">
              <label class="label" for="ad-name"
                >Department name <span class="req">*</span></label
              >
              <input
                class="input"
                id="ad-name"
                name="name"
                placeholder="e.g. Software Engineering"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a department name.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i> Add department
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============ Edit department modal ============ -->
    <div
      class="modal-backdrop"
      id="edit-dept-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ed-title"
    >
      <div class="modal">
        <div class="modal-head">
          <h3 id="ed-title">Edit department</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="edit-dept-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label" for="ed-faculty">Faculty</label>
              <input class="input" id="ed-faculty" disabled />
            </div>
            <div class="field">
              <label class="label" for="ed-name"
                >Department name <span class="req">*</span></label
              >
              <input class="input" id="ed-name" name="name" />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a department name.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i> Save changes
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/permissions.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      /* ==========================================================================
   Departments — Admin workspace.
   Role-aware: only admins with departments.manage.
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session || !Permissions.isAdminRole(session)) {
          window.location.href = "../auth/login.html";
          return;
        }
        if (!Permissions.can(session, "departments.manage")) {
          window.location.href = "dashboard.html";
          return;
        }

        initAppShell("admin");

        /* ------------------------------------------------------------------
     WORKING COPY OF FACULTIES + DEPARTMENTS
     ------------------------------------------------------------------ */
        var faculties = (
          typeof DEMO_FACULTIES !== "undefined" ? DEMO_FACULTIES : []
        ).map(function (f) {
          return {
            id: f.id,
            name: f.name,
            shortName: f.shortName,
            active: f.active !== false,
            departments: (Array.isArray(f.departments)
              ? f.departments
              : []
            ).map(function (d) {
              return { id: d.id, name: d.name, active: d.active !== false };
            }),
          };
        });

        /* Apply saved overrides from previous sessions */
        var saved = Store.get("departments_overrides", null);
        if (Array.isArray(saved)) {
          saved.forEach(function (entry) {
            var fac = faculties.find(function (f) {
              return f.id === entry.facultyId;
            });
            if (!fac) return;
            entry.departments.forEach(function (d) {
              var match = fac.departments.find(function (x) {
                return x.id === d.id;
              });
              if (match) {
                if (d.name) match.name = d.name;
                if (typeof d.active === "boolean") match.active = d.active;
              } else if (d.name) {
                /* Newly added department */
                fac.departments.push({
                  id: d.id,
                  name: d.name,
                  active: d.active !== false,
                });
              }
            });
          });
        }

        /* ------------------------------------------------------------------
     ELEMENTS
     ------------------------------------------------------------------ */
        var listEl = document.getElementById("dept-list");
        var searchEl = document.getElementById("dept-search");
        var facFilter = document.getElementById("fac-filter");
        var countEl = document.getElementById("dept-count");
        var newDeptFac = document.getElementById("ad-faculty");

        /* Populate faculty dropdowns */
        faculties.forEach(function (f) {
          var opt = document.createElement("option");
          opt.value = f.id;
          opt.textContent = f.name;
          facFilter.appendChild(opt);

          var opt2 = document.createElement("option");
          opt2.value = f.id;
          opt2.textContent = f.name;
          newDeptFac.appendChild(opt2);
        });

        /* Rebuild custom dropdowns now that options exist */
        if (typeof initCustomSelects === "function") {
          /* Tear down any existing custom wrappers on the two faculty selects */
          [facFilter, newDeptFac].forEach(function (sel) {
            var staleNext = sel.nextElementSibling;
            if (staleNext && staleNext.classList.contains("cselect"))
              staleNext.remove();
            var stalePrev = sel.previousElementSibling;
            if (stalePrev && stalePrev.classList.contains("cselect"))
              stalePrev.remove();
            sel.classList.remove("cselect-native");
            sel.removeAttribute("data-customized");
          });
          initCustomSelects();
        }

        /* Preset from URL */
        var preset = new URLSearchParams(location.search).get("faculty");
        if (preset) facFilter.value = preset;

        /* ------------------------------------------------------------------
     PERSIST
     ------------------------------------------------------------------ */
        function persist() {
          Store.set(
            "departments_overrides",
            faculties.map(function (f) {
              return {
                facultyId: f.id,
                departments: f.departments.map(function (d) {
                  return { id: d.id, name: d.name, active: d.active };
                }),
              };
            }),
          );
        }

        /* ------------------------------------------------------------------
     RENDER
     ------------------------------------------------------------------ */
        function render() {
          var q = searchEl.value.trim().toLowerCase();
          var filterId = facFilter.value;

          var visibleFaculties = faculties.filter(function (f) {
            if (filterId && f.id !== filterId) return false;
            return true;
          });

          listEl.innerHTML = "";

          var total = 0;

          visibleFaculties.forEach(function (f) {
            /* Filter departments within the faculty */
            var departments = f.departments.filter(function (d) {
              if (!q) return true;
              return (
                d.name.toLowerCase().indexOf(q) !== -1 ||
                f.name.toLowerCase().indexOf(q) !== -1
              );
            });

            /* If we have a search query and this faculty has no matching departments,
         skip the whole group */
            if (q && !departments.length) return;

            total += departments.length;

            var group = document.createElement("div");
            group.className = "card";
            group.style.marginBottom = "16px";

            var headHtml =
              '<div class="card-head" style="background:var(--bg-subtle);">' +
              '<div style="display:flex; align-items:center; gap:10px; min-width:0;">' +
              '<span class="badge badge-marine">' +
              Util.escape(f.shortName) +
              "</span>" +
              '<h3 style="margin:0; font-size:var(--fs-sm);">' +
              Util.escape(f.name) +
              "</h3>" +
              "</div>" +
              '<span class="badge ' +
              (f.active ? "badge-success" : "badge-neutral") +
              '">' +
              (f.active ? "Active" : "Inactive") +
              "</span>" +
              "</div>";

            var bodyHtml = "<div>";

            if (!departments.length) {
              bodyHtml +=
                '<div class="empty-state" style="padding:32px 20px;">' +
                '<div class="empty-icon" style="width:48px; height:48px; font-size:18px; margin-bottom:12px;">' +
                '<i class="fa-solid fa-diagram-project"></i>' +
                "</div>" +
                '<h3 style="font-size:var(--fs-sm);">No departments yet</h3>' +
                '<p style="font-size:var(--fs-xs);">Add the first department to this faculty.</p>' +
                '<button class="btn btn-secondary btn-sm" data-add-to-faculty="' +
                f.id +
                '" type="button">' +
                '<i class="fa-solid fa-plus"></i> Add department' +
                "</button>" +
                "</div>";
            } else {
              departments.forEach(function (d) {
                var row = document.createElement("div");
                row.className = "resource-row";
                row.style.padding = "14px 20px";
                row.innerHTML =
                  '<span class="resource-icon" style="' +
                  (!d.active
                    ? "background:var(--bg-subtle); color:var(--text-tertiary);"
                    : "") +
                  '">' +
                  '<i class="fa-solid fa-diagram-project"></i>' +
                  "</span>" +
                  '<div class="resource-info">' +
                  '<div class="resource-name">' +
                  Util.escape(d.name) +
                  (!d.active
                    ? ' <span class="badge badge-neutral" style="margin-left:8px;">Inactive</span>'
                    : "") +
                  "</div>" +
                  '<div class="resource-meta">' +
                  "<span>" +
                  Util.escape(f.name) +
                  "</span>" +
                  "</div>" +
                  "</div>" +
                  '<button class="btn btn-ghost btn-sm" data-edit type="button" aria-label="Edit department">' +
                  '<i class="fa-solid fa-pen"></i>' +
                  "</button>" +
                  '<button class="btn btn-ghost btn-sm" data-toggle type="button" aria-label="' +
                  (d.active ? "Deactivate" : "Reactivate") +
                  ' department" style="color:' +
                  (d.active ? "var(--danger)" : "var(--success)") +
                  ';">' +
                  (d.active
                    ? '<i class="fa-solid fa-ban"></i>'
                    : '<i class="fa-solid fa-circle-check"></i>') +
                  "</button>";

                row
                  .querySelector("[data-edit]")
                  .addEventListener("click", function () {
                    openEditModal(f, d);
                  });

                row
                  .querySelector("[data-toggle]")
                  .addEventListener("click", async function () {
                    var willDeactivate = d.active;
                    var ok = await Confirmation.confirm({
                      title: willDeactivate
                        ? "Deactivate this department?"
                        : "Reactivate this department?",
                      message: willDeactivate
                        ? 'The department "' +
                          d.name +
                          '" will no longer appear in the student registration form. Existing student records are kept.'
                        : 'The department "' +
                          d.name +
                          '" will be reactivated.',
                      confirmLabel: willDeactivate
                        ? "Deactivate"
                        : "Reactivate",
                      variant: willDeactivate ? "danger" : "primary",
                    });
                    if (!ok) return;
                    d.active = !d.active;
                    persist();
                    render();
                    Toast.success(
                      "Department " +
                        (d.active ? "reactivated" : "deactivated") +
                        ".",
                      "Saved",
                    );
                  });

                bodyHtml += row.outerHTML;
              });
            }

            bodyHtml += "</div>";

            group.innerHTML = headHtml + bodyHtml;
            listEl.appendChild(group);

            /* Wire the "add to faculty" buttons and re-wire row buttons since
         we used outerHTML (which loses event listeners) */
            group
              .querySelectorAll("[data-add-to-faculty]")
              .forEach(function (btn) {
                btn.addEventListener("click", function () {
                  newDeptFac.value = btn.getAttribute("data-add-to-faculty");
                  Modal.open("add-dept-modal");
                });
              });
          });

          /* Re-wire row actions after innerHTML assignment above */
          listEl.querySelectorAll(".resource-row").forEach(function (row) {
            var editBtn = row.querySelector("[data-edit]");
            var toggleBtn = row.querySelector("[data-toggle]");
            var name = row.querySelector(".resource-name").textContent.trim();

            /* Find the department matching this row */
            var dept = null;
            var fac = null;
            for (var i = 0; i < faculties.length; i++) {
              var ff = faculties[i];
              for (var j = 0; j < ff.departments.length; j++) {
                if (ff.departments[j].name === name) {
                  dept = ff.departments[j];
                  fac = ff;
                  break;
                }
              }
              if (dept) break;
            }

            if (editBtn && dept && fac) {
              editBtn.onclick = function () {
                openEditModal(fac, dept);
              };
            }
            if (toggleBtn && dept && fac) {
              toggleBtn.onclick = async function () {
                var willDeactivate = dept.active;
                var ok = await Confirmation.confirm({
                  title: willDeactivate
                    ? "Deactivate this department?"
                    : "Reactivate this department?",
                  message: willDeactivate
                    ? 'The department "' +
                      dept.name +
                      '" will no longer appear in the student registration form. Existing student records are kept.'
                    : 'The department "' + dept.name + '" will be reactivated.',
                  confirmLabel: willDeactivate ? "Deactivate" : "Reactivate",
                  variant: willDeactivate ? "danger" : "primary",
                });
                if (!ok) return;
                dept.active = !dept.active;
                persist();
                render();
                Toast.success(
                  "Department " +
                    (dept.active ? "reactivated" : "deactivated") +
                    ".",
                  "Saved",
                );
              };
            }
          });

          countEl.textContent =
            total + " department" + (total === 1 ? "" : "s");

          if (!total && (q || filterId)) {
            listEl.innerHTML =
              '<div class="card">' +
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-diagram-project"></i></div>' +
              "<h3>No departments match</h3>" +
              "<p>Try a different search term or clear the faculty filter.</p>" +
              "</div>" +
              "</div>";
          }
        }

        /* ------------------------------------------------------------------
     EDIT MODAL
     ------------------------------------------------------------------ */
        var currentEditDept = null;
        var currentEditFac = null;

        function openEditModal(faculty, dept) {
          currentEditDept = dept;
          currentEditFac = faculty;

          var form = document.getElementById("edit-dept-form");
          form.querySelector('[name="name"]').value = dept.name;
          document.getElementById("ed-faculty").value = faculty.name;

          /* Clear any leftover error state */
          form.querySelectorAll(".field").forEach(function (field) {
            field.classList.remove("is-invalid", "is-valid");
          });

          Modal.open("edit-dept-modal");
        }

        bindForm(
          document.getElementById("edit-dept-form"),
          {
            name: [Rules.required, Rules.minLen(3)],
          },
          function (data) {
            if (!currentEditDept || !currentEditFac) return;

            var newName = data.get("name").trim();

            /* Check duplicates within the same faculty */
            var duplicate = currentEditFac.departments.some(function (x) {
              return (
                x.id !== currentEditDept.id &&
                x.name.toLowerCase() === newName.toLowerCase()
              );
            });
            if (duplicate) {
              Toast.error(
                'A department named "' +
                  newName +
                  '" already exists in this faculty.',
                "Duplicate name",
              );
              return;
            }

            currentEditDept.name = newName;
            persist();

            Modal.close("edit-dept-modal");
            currentEditDept = null;
            currentEditFac = null;

            render();
            Toast.success("Department updated.", "Saved");
          },
        );

        /* ------------------------------------------------------------------
     ADD FORM
     ------------------------------------------------------------------ */
        bindForm(
          document.getElementById("add-dept-form"),
          {
            facultyId: [Rules.required],
            name: [Rules.required, Rules.minLen(3)],
          },
          function (data) {
            var facId = data.get("facultyId");
            var fac = faculties.find(function (x) {
              return x.id === facId;
            });
            if (!fac) return;

            var newName = data.get("name").trim();

            /* Check duplicates within the faculty */
            var duplicate = fac.departments.some(function (x) {
              return x.name.toLowerCase() === newName.toLowerCase();
            });
            if (duplicate) {
              Toast.error(
                'A department named "' +
                  newName +
                  '" already exists in this faculty.',
                "Duplicate name",
              );
              return;
            }

            fac.departments.push({
              id: "dep-" + Date.now(),
              name: newName,
              active: true,
            });

            persist();
            render();
            Modal.close("add-dept-modal");
            document.getElementById("add-dept-form").reset();
            Toast.success("Department added.", "Saved");
          },
        );

        /* ------------------------------------------------------------------
     EVENTS
     ------------------------------------------------------------------ */
        var debounce;
        searchEl.addEventListener("input", function () {
          clearTimeout(debounce);
          debounce = setTimeout(render, 120);
        });

        facFilter.addEventListener("change", render);

        /* ------------------------------------------------------------------
     INITIAL RENDER
     ------------------------------------------------------------------ */
        render();
      });
    </script>
  </body>
</html>
