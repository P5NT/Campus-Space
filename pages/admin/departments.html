<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Departments — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Departments</h1>
              <p class="page-subtitle">Departments under each faculty.</p>
            </div>
            <button class="btn btn-primary" data-modal-open="add-dept-modal">
              <i class="fa-solid fa-plus"></i> Add department
            </button>
          </div>

          <div class="toolbar">
            <select
              class="select"
              id="fac-filter"
              aria-label="Filter by faculty"
            >
              <option value="">All faculties</option>
            </select>
          </div>

          <div class="card">
            <div id="dept-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="add-dept-modal">
      <div class="modal">
        <div class="modal-head">
          <h3>Add department</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-dept-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label">Faculty <span class="req">*</span></label>
              <select class="select" name="facultyId" id="new-dept-fac">
                <option value="">Select faculty</option>
              </select>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a faculty.</span>
              </div>
            </div>
            <div class="field">
              <label class="label"
                >Department name <span class="req">*</span></label
              >
              <input
                class="input"
                name="name"
                placeholder="e.g. Software Engineering"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a department name.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Add department
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        const facFilter = document.getElementById("fac-filter");
        const newDeptFac = document.getElementById("new-dept-fac");
        DEMO_FACULTIES.forEach((f) => {
          facFilter.insertAdjacentHTML(
            "beforeend",
            `<option value="${f.id}">${Util.escape(f.name)}</option>`,
          );
          newDeptFac.insertAdjacentHTML(
            "beforeend",
            `<option value="${f.id}">${Util.escape(f.name)}</option>`,
          );
        });

        const presetFaculty = new URLSearchParams(location.search).get(
          "faculty",
        );
        if (presetFaculty) facFilter.value = presetFaculty;

        function render() {
          const list = document.getElementById("dept-list");
          list.innerHTML = "";
          const filterId = facFilter.value;
          const faculties = filterId
            ? DEMO_FACULTIES.filter((f) => f.id === filterId)
            : DEMO_FACULTIES;
          faculties.forEach((f) => {
            const head = document.createElement("div");
            head.style.background = "var(--bg-subtle)";
            head.style.padding = "12px 20px";
            head.style.fontWeight = "700";
            head.style.fontSize = "var(--fs-sm)";
            head.style.borderBottom = "1px solid var(--border-subtle)";
            head.textContent = f.name;
            list.appendChild(head);
            f.departments.forEach((d) => {
              const el = document.createElement("div");
              el.className = "resource-row";
              el.innerHTML = `
          <span class="resource-icon"><i class="fa-solid fa-diagram-project"></i></span>
          <div class="resource-info">
            <div class="resource-name">${Util.escape(d.name)}</div>
            <div class="resource-meta"><span>${Util.escape(f.shortName)}</span></div>
          </div>
          <button class="btn btn-ghost btn-sm" data-edit><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-ghost btn-sm" data-toggle style="color:var(--danger);"><i class="fa-solid fa-trash"></i></button>`;
              el.querySelector("[data-edit]").addEventListener("click", () => {
                Toast.info(
                  'Editing "' + d.name + '" (simulated).',
                  "Edit department",
                );
              });
              el.querySelector("[data-toggle]").addEventListener(
                "click",
                async () => {
                  if (
                    await Confirmation.confirm({
                      title: "Remove this department?",
                      message:
                        'The department "' +
                        d.name +
                        '" will no longer appear in the registration form.',
                      confirmLabel: "Remove",
                      variant: "danger",
                    })
                  ) {
                    f.departments = f.departments.filter((x) => x.id !== d.id);
                    render();
                    Toast.success("Department removed.", "Saved");
                  }
                },
              );
              list.appendChild(el);
            });
            if (!f.departments.length) {
              const empty = document.createElement("div");
              empty.style.padding = "20px";
              empty.style.textAlign = "center";
              empty.style.color = "var(--text-tertiary)";
              empty.style.fontSize = "var(--fs-sm)";
              empty.textContent = "No departments in this faculty.";
              list.appendChild(empty);
            }
          });
        }
        facFilter.addEventListener("change", render);
        render();

        bindForm(
          document.getElementById("add-dept-form"),
          {
            facultyId: [Rules.required],
            name: [Rules.required],
          },
          (data) => {
            const f = DEMO_FACULTIES.find(
              (x) => x.id === data.get("facultyId"),
            );
            if (f)
              f.departments.push({
                id: "dep-" + Date.now(),
                name: data.get("name"),
                active: true,
              });
            render();
            Modal.close("add-dept-modal");
            document.getElementById("add-dept-form").reset();
            Toast.success("Department added.", "Saved");
          },
        );
      });
    </script>
  </body>
</html>
