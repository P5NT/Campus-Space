<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registered Students — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Registered Students</h1>
              <p class="page-subtitle">
                All students with accounts on Campus Space.
              </p>
            </div>
          </div>

          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="student-search"
                placeholder="Search by name, username, matric, faculty, department…"
              />
            </div>
            <select
              class="select"
              id="student-status"
              aria-label="Filter by status"
            >
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="deactivated">Deactivated</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-card-mode">
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Matric</th>
                    <th>Faculty</th>
                    <th>Level</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="students-tbody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        const tbody = document.getElementById("students-tbody");
        const search = document.getElementById("student-search");
        const status = document.getElementById("student-status");

        function apply() {
          let list = Admin.searchStudents(search.value.trim());
          if (status.value)
            list = list.filter((s) => s.status === status.value);
          tbody.innerHTML = "";
          if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-tertiary);">No students match your filters.</td></tr>`;
            return;
          }
          list.forEach((s) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
        <td data-label="Student">
          <div class="table-user">
            <span class="avatar avatar-32 avatar-fallback">${Util.initials(s.firstName + " " + s.lastName)}</span>
            <div class="table-user-info">
              <div class="name">${Util.escape(s.firstName + " " + s.lastName)}</div>
              <div class="meta">@${Util.escape(s.username)}</div>
            </div>
          </div>
        </td>
        <td data-label="Matric">${Util.escape(s.matric)}</td>
        <td data-label="Faculty">${Util.escape(s.faculty)}</td>
        <td data-label="Level">${Util.escape(s.level)}</td>
        <td data-label="Status"><span class="badge ${s.status === "active" ? "badge-success" : s.status === "suspended" ? "badge-danger" : "badge-warning"}">${s.status}</span></td>
        <td class="table-actions">
          <a href="student-details.html?id=${s.id}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-eye"></i> Open
          </a>
        </td>`;
            tbody.appendChild(tr);
          });
        }

        search.addEventListener("input", apply);
        status.addEventListener("change", apply);
        apply();
      });
    </script>
  </body>
</html>
