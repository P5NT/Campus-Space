<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Details — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar admin-sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="registered-students.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to Registered Students
            </a>
          </div>

          <div id="student-detail"></div>
        </main>
      </div>
    </div>

    <!-- ============ Assign role modal (Super Admin only) ============ -->
    <div
      class="modal-backdrop"
      id="assign-role-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ar-title"
    >
      <div class="modal">
        <div class="modal-head">
          <h3 id="ar-title">Assign admin role</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="assign-role-form" novalidate>
          <div class="modal-body">
            <p
              style="
                font-size: var(--fs-sm);
                color: var(--text-secondary);
                margin-bottom: 20px;
              "
            >
              Roles are internal. They grant this student additional tools
              inside their account without changing their public profile.
            </p>

            <div class="field">
              <label class="label">Role <span class="req">*</span></label>
              <select class="select" name="role" id="ar-role">
                <option value="">Select a role</option>
                <option value="academia">
                  Academic Admin — can upload and edit academic materials
                </option>
                <option value="su_pro">
                  SU PRO — can publish announcements, news, and opportunities
                </option>
              </select>
              <div class="field-help">
                A welcome email will be sent automatically on assignment.
              </div>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a role.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i> Assign role
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/permissions.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      /* ==========================================================================
   Student Details — Admin workspace.

   Sections adapt to the current admin's role:
   - Profile hero (always)
   - Account info + leadership info (always)
   - Verification panel (students.verify)
   - Role assignment panel (admins.assign_roles — Super Admin only)
   - Action buttons (students.suspend)
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session || !Permissions.isAdminRole(session)) {
          window.location.href = "../auth/login.html";
          return;
        }
        if (!Permissions.can(session, "students.view")) {
          window.location.href = "dashboard.html";
          return;
        }

        initAppShell("admin");

        var id = new URLSearchParams(location.search).get("id");
        var wrap = document.getElementById("student-detail");

        var s = Admin.studentById(id);
        if (!s) {
          wrap.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div>' +
            "<h3>Student not found</h3>" +
            "<p>This student record does not exist or has been removed.</p>" +
            '<a class="btn btn-secondary" href="registered-students.html">Back to Registered Students</a>' +
            "</div>";
          return;
        }

        var fullName =
          s.firstName +
          " " +
          (s.otherName ? s.otherName + " " : "") +
          s.lastName;
        var isVerified = s.verified !== false;
        var isSuper = Permissions.can(session, "admins.assign_roles");
        var canSuspend = Permissions.can(session, "students.suspend");
        var canVerify = Permissions.can(session, "students.verify");

        /* ------------ Status helpers ------------ */
        var statusClass =
          s.status === "active"
            ? "badge-success"
            : s.status === "suspended"
              ? "badge-danger"
              : "badge-warning";

        /* ------------ Hero ------------ */
        var heroHtml =
          '<div class="card card-pad-lg" style="margin-bottom:20px;">' +
          '<div class="cluster" style="gap:20px; align-items:flex-start; flex-wrap:wrap;">' +
          '<span class="avatar avatar-96 avatar-fallback">' +
          Util.initials(fullName) +
          "</span>" +
          '<div style="flex:1; min-width:240px;">' +
          '<div class="cluster" style="gap:10px; margin-bottom:6px;">' +
          '<h1 class="page-title" style="font-size:var(--fs-xl); margin:0;">' +
          Util.escape(fullName) +
          "</h1>" +
          (isVerified
            ? '<span class="badge badge-success"><i class="fa-solid fa-circle-check"></i> Verified</span>'
            : '<span class="badge badge-warning"><i class="fa-solid fa-hourglass-half"></i> Pending verification</span>') +
          "</div>" +
          '<div class="text-muted" style="margin-bottom:12px;">@' +
          Util.escape(s.username) +
          " · " +
          Util.escape(s.matric) +
          "</div>" +
          '<div class="cluster">' +
          '<span class="badge badge-marine">' +
          Util.escape(s.faculty) +
          "</span>" +
          '<span class="badge badge-neutral">' +
          Util.escape(s.department) +
          "</span>" +
          '<span class="badge badge-neutral">' +
          Util.escape(s.level) +
          " Level</span>" +
          '<span class="badge ' +
          statusClass +
          '">' +
          s.status +
          "</span>" +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>";

        /* ------------ Info cards ------------ */
        var accountCard =
          '<div class="card card-pad">' +
          '<h3 style="font-size:var(--fs-md); margin-bottom:16px; display:flex; align-items:center; gap:8px;">' +
          '<i class="fa-solid fa-id-card" style="color:var(--brand-primary);"></i> Account Information' +
          "</h3>" +
          '<div class="stack">' +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Email</div>' +
          '<div class="font-semibold" style="word-break:break-all;">' +
          Util.escape(s.email) +
          "</div></div>" +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Phone</div>' +
          '<div class="font-semibold">' +
          Util.escape(s.phone) +
          "</div></div>" +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Joined</div>' +
          '<div class="font-semibold">' +
          Util.formatDate(s.joined, {
            day: "numeric",
            month: "long",
            year: "numeric",
          }) +
          "</div></div>" +
          "</div>" +
          "</div>";

        var leadershipCard =
          '<div class="card card-pad">' +
          '<h3 style="font-size:var(--fs-md); margin-bottom:16px; display:flex; align-items:center; gap:8px;">' +
          '<i class="fa-solid fa-ranking-star" style="color:var(--brand-primary);"></i> Leadership &amp; Roles' +
          "</h3>" +
          '<div class="stack">' +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Association</div>' +
          '<div class="font-semibold">' +
          (s.association
            ? Util.escape(s.associationFull) +
              " (" +
              Util.escape(s.association) +
              ")"
            : "—") +
          "</div></div>" +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Position</div>' +
          '<div class="font-semibold">' +
          (s.position ? Util.escape(s.position) : "—") +
          "</div></div>" +
          '<div><div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Emergency Contact</div>' +
          '<div class="font-semibold">' +
          (s.isEmergencyContact
            ? "Yes — " + Util.escape(s.emergencyCategory)
            : "No") +
          "</div></div>" +
          "</div>" +
          "</div>";

        /* ------------ Verification panel (students.verify only) ------------ */
        var verificationCard = "";
        if (canVerify) {
          verificationCard =
            '<div class="card card-pad">' +
            '<h3 style="font-size:var(--fs-md); margin-bottom:16px; display:flex; align-items:center; gap:8px;">' +
            '<i class="fa-solid fa-user-check" style="color:var(--success);"></i> Verification' +
            "</h3>" +
            '<p style="font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:16px;">' +
            (isVerified
              ? "This student has been verified against official records."
              : "This student has not yet been verified. Compare their details against the official student-detail records.") +
            "</p>" +
            (isVerified
              ? '<button class="btn btn-secondary btn-block" type="button" disabled>' +
                '<i class="fa-solid fa-circle-check"></i> Verified' +
                "</button>"
              : '<button class="btn btn-primary btn-block" id="verify-student" type="button">' +
                '<i class="fa-solid fa-user-check"></i> Verify this student' +
                "</button>") +
            "</div>";
        }

        /* ------------ Super Admin role assignment ------------ */
        var rolesCard = "";
        if (isSuper) {
          var currentRoles = Array.isArray(s.adminRoles) ? s.adminRoles : [];
          rolesCard =
            '<div class="card card-pad">' +
            '<h3 style="font-size:var(--fs-md); margin-bottom:16px; display:flex; align-items:center; gap:8px;">' +
            '<i class="fa-solid fa-user-shield" style="color:var(--brand-secondary);"></i> Admin Roles' +
            "</h3>" +
            '<div class="stack" style="margin-bottom:16px;">' +
            (currentRoles.length
              ? currentRoles
                  .map(function (r) {
                    var label =
                      r === "academia"
                        ? "Academic Admin"
                        : r === "su_pro"
                          ? "SU PRO"
                          : r;
                    return (
                      '<span class="badge badge-brand">' +
                      Util.escape(label) +
                      "</span>"
                    );
                  })
                  .join("")
              : '<p style="font-size:var(--fs-sm); color:var(--text-tertiary); margin:0;">No admin roles assigned.</p>') +
            "</div>" +
            '<button class="btn btn-secondary btn-block" data-modal-open="assign-role-modal" type="button">' +
            '<i class="fa-solid fa-plus"></i> Assign admin role' +
            "</button>" +
            "</div>";
        }

        /* ------------ Action buttons (students.suspend only) ------------ */
        var actionsHtml = "";
        if (canSuspend) {
          var showReactivate = s.status !== "active";
          var showSuspend = s.status !== "suspended";
          var showDeactivate = s.status !== "deactivated";

          var actionButtons = [];
          if (showReactivate) {
            actionButtons.push(
              '<button class="btn btn-primary btn-block" data-activate type="button">' +
                '<i class="fa-solid fa-circle-check"></i> Reactivate account</button>',
            );
          }
          if (showSuspend) {
            actionButtons.push(
              '<button class="btn btn-secondary btn-block" data-suspend type="button">' +
                '<i class="fa-solid fa-ban"></i> Suspend account</button>',
            );
          }
          if (showDeactivate) {
            actionButtons.push(
              '<button class="btn btn-danger btn-block" data-deactivate type="button">' +
                '<i class="fa-solid fa-user-slash"></i> Deactivate account</button>',
            );
          }

          actionsHtml =
            '<div class="card card-pad">' +
            '<h3 style="font-size:var(--fs-md); margin-bottom:16px; display:flex; align-items:center; gap:8px;">' +
            '<i class="fa-solid fa-sliders" style="color:var(--text-tertiary);"></i> Account Actions' +
            "</h3>" +
            '<div class="stack">' +
            actionButtons.join("") +
            "</div>" +
            "</div>";
        }

        /* ------------ Assemble the page ------------ */
        var gridChildren = [
          accountCard,
          leadershipCard,
          verificationCard,
          rolesCard,
          actionsHtml,
        ].filter(Boolean);

        wrap.innerHTML =
          heroHtml +
          '<div class="grid grid-2" style="gap:20px;">' +
          gridChildren.join("") +
          "</div>";

        /* ==================================================================
     WIRE ACTIONS
     ================================================================== */

        var activateBtn = wrap.querySelector("[data-activate]");
        if (activateBtn) {
          activateBtn.addEventListener("click", async function () {
            var ok = await Confirmation.confirm({
              title: "Reactivate this account?",
              message: "The student will regain full access to Campus Space.",
              confirmLabel: "Reactivate",
            });
            if (!ok) return;
            s.status = "active";
            /* Simulate persistence */
            Store.set("student_status_" + s.id, "active");
            Toast.success("Account reactivated.", "Done");
            setTimeout(function () {
              window.location.reload();
            }, 500);
          });
        }

        var suspendBtn = wrap.querySelector("[data-suspend]");
        if (suspendBtn) {
          suspendBtn.addEventListener("click", async function () {
            var ok = await Confirmation.confirm({
              title: "Suspend this account?",
              message:
                "The student will lose access to Campus Space, including posting and commenting.",
              confirmLabel: "Suspend",
              variant: "danger",
            });
            if (!ok) return;
            s.status = "suspended";
            Store.set("student_status_" + s.id, "suspended");
            Toast.warning("Account suspended.", "Suspended");
            setTimeout(function () {
              window.location.reload();
            }, 500);
          });
        }

        var deactivateBtn = wrap.querySelector("[data-deactivate]");
        if (deactivateBtn) {
          deactivateBtn.addEventListener("click", async function () {
            var ok = await Confirmation.confirm({
              title: "Deactivate this account?",
              message:
                "The account will be marked Deactivated. The student can request reactivation later.",
              confirmLabel: "Deactivate",
              variant: "danger",
            });
            if (!ok) return;
            s.status = "deactivated";
            Store.set("student_status_" + s.id, "deactivated");
            Toast.warning("Account deactivated.", "Deactivated");
            setTimeout(function () {
              window.location.reload();
            }, 500);
          });
        }

        var verifyBtn = document.getElementById("verify-student");
        if (verifyBtn) {
          verifyBtn.addEventListener("click", async function () {
            var ok = await Confirmation.confirm({
              title: "Verify this student?",
              message:
                "Confirm that the details match the official student-detail records. Once verified, the student gains full access.",
              confirmLabel: "Verify student",
            });
            if (!ok) return;
            s.verified = true;
            Store.set("student_verified_" + s.id, true);
            Toast.success(
              "Student verified. They now have full access.",
              "Verified",
            );
            setTimeout(function () {
              window.location.reload();
            }, 600);
          });
        }

        /* ==================================================================
     ASSIGN ROLE MODAL (Super Admin only)
     ================================================================== */
        var roleForm = document.getElementById("assign-role-form");
        if (roleForm && isSuper) {
          bindForm(
            roleForm,
            {
              role: [Rules.required],
            },
            function (data) {
              var role = data.get("role");
              if (!Array.isArray(s.adminRoles)) s.adminRoles = [];
              if (s.adminRoles.indexOf(role) === -1) s.adminRoles.push(role);
              Store.set("student_roles_" + s.id, s.adminRoles);

              Modal.close("assign-role-modal");
              roleForm.reset();

              var label =
                role === "academia"
                  ? "Academic Admin"
                  : role === "su_pro"
                    ? "SU PRO"
                    : role;
              Toast.success(
                label +
                  " role assigned. A welcome email has been sent to " +
                  s.email +
                  " (simulated).",
                "Role assigned",
              );
              setTimeout(function () {
                window.location.reload();
              }, 700);
            },
          );
        }
      });
    </script>
  </body>
</html>
