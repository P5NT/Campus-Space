<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Associations — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Student Associations</h1>
              <p class="page-subtitle">
                Manage recognised associations and their public tags.
              </p>
            </div>
            <button class="btn btn-primary" data-modal-open="add-assoc-modal">
              <i class="fa-solid fa-plus"></i> Add association
            </button>
          </div>
          <div class="card">
            <div id="assoc-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="add-assoc-modal">
      <div class="modal">
        <div class="modal-head">
          <h3>Add association</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-assoc-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label"
                >Official full name <span class="req">*</span></label
              >
              <input
                class="input"
                name="name"
                placeholder="e.g. Nigerian Association of Science Students"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter the full name.</span>
              </div>
            </div>
            <div class="field">
              <label class="label"
                >Acronym / Tag <span class="req">*</span></label
              >
              <input
                class="input"
                name="acronym"
                placeholder="e.g. NASS"
                maxlength="10"
              />
              <div class="field-help">
                This is the public tag used in community posts.
              </div>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter an acronym.</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Add association
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        let assocs = DEMO_ASSOCIATIONS.slice();
        const listEl = document.getElementById("assoc-list");

        function render() {
          listEl.innerHTML = "";
          assocs.forEach((a) => {
            const el = document.createElement("div");
            el.className = "resource-row";
            el.innerHTML = `
        <span class="resource-icon"><i class="fa-solid fa-people-group"></i></span>
        <div class="resource-info">
          <div class="resource-name">${Util.escape(a.name)}</div>
          <div class="resource-meta">
            <span>Public tag: <strong>${Util.escape(a.acronym)}</strong></span>
            <span class="badge ${a.active ? "badge-success" : "badge-neutral"}">${a.active ? "Active" : "Inactive"}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-edit><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-ghost btn-sm" data-toggle style="color:${a.active ? "var(--danger)" : "var(--success)"};">
          ${a.active ? '<i class="fa-solid fa-ban"></i>' : '<i class="fa-solid fa-circle-check"></i>'}
        </button>`;
            el.querySelector("[data-edit]").addEventListener("click", () => {
              Toast.info(
                'Editing "' + a.name + '" (simulated).',
                "Edit association",
              );
            });
            el.querySelector("[data-toggle]").addEventListener(
              "click",
              async () => {
                if (
                  await Confirmation.confirm({
                    title: a.active
                      ? "Deactivate this association?"
                      : "Reactivate this association?",
                    message: a.active
                      ? "New students will not be able to select this association."
                      : "This association will be available again.",
                    confirmLabel: a.active ? "Deactivate" : "Reactivate",
                    variant: a.active ? "danger" : "primary",
                  })
                ) {
                  a.active = !a.active;
                  render();
                  Toast.success("Association updated.", "Saved");
                }
              },
            );
            listEl.appendChild(el);
          });
        }
        render();

        bindForm(
          document.getElementById("add-assoc-form"),
          {
            name: [Rules.required],
            acronym: [Rules.required],
          },
          (data) => {
            assocs.push({
              id: "as-" + Date.now(),
              name: data.get("name"),
              acronym: data.get("acronym").toUpperCase(),
              active: true,
            });
            render();
            Modal.close("add-assoc-modal");
            document.getElementById("add-assoc-form").reset();
            Toast.success("Association added.", "Saved");
          },
        );
      });
    </script>
  </body>
</html>
