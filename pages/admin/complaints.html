<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaints — Admin — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar admin-sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Complaints</h1>
              <p class="page-subtitle">
                Review student complaints, respond with the office byline, and
                update statuses.
              </p>
            </div>
          </div>

          <!-- Summary stats -->
          <div class="grid grid-4" style="margin-bottom: 24px">
            <div class="stat">
              <div class="stat-label">Submitted</div>
              <div
                class="stat-value"
                id="stat-submitted"
                style="color: var(--info)"
              >
                —
              </div>
              <div class="stat-meta">Awaiting first review</div>
            </div>
            <div class="stat">
              <div class="stat-label">Under Review</div>
              <div
                class="stat-value"
                id="stat-review"
                style="color: var(--warning)"
              >
                —
              </div>
              <div class="stat-meta">Being assessed</div>
            </div>
            <div class="stat">
              <div class="stat-label">In Progress</div>
              <div
                class="stat-value"
                id="stat-progress"
                style="color: var(--brand-primary)"
              >
                —
              </div>
              <div class="stat-meta">Being acted upon</div>
            </div>
            <div class="stat">
              <div class="stat-label">Resolved</div>
              <div
                class="stat-value"
                id="stat-resolved"
                style="color: var(--success)"
              >
                —
              </div>
              <div class="stat-meta">Closed</div>
            </div>
          </div>

          <!-- Search -->
          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="cm-search"
                placeholder="Search by subject, ID, category or filer…"
                aria-label="Search complaints"
              />
            </div>
          </div>

          <!-- Status tabs -->
          <div class="filter-bar" id="cm-status-filter" role="tablist">
            <button class="chip is-active" data-status="all" role="tab">
              All
            </button>
            <button class="chip" data-status="Submitted" role="tab">
              Submitted
            </button>
            <button class="chip" data-status="Under Review" role="tab">
              Under Review
            </button>
            <button class="chip" data-status="In Progress" role="tab">
              In Progress
            </button>
            <button class="chip" data-status="Resolved" role="tab">
              Resolved
            </button>
          </div>

          <!-- Visibility tabs -->
          <div class="filter-bar" id="cm-visibility-filter" role="tablist">
            <button class="chip is-active" data-visibility="all" role="tab">
              All complaints
            </button>
            <button class="chip" data-visibility="private" role="tab">
              Private
            </button>
            <button class="chip" data-visibility="public" role="tab">
              Public
            </button>
          </div>

          <div class="cluster-between" style="margin-bottom: 12px">
            <p class="section-desc" style="margin: 0" id="cm-count">Loading…</p>
          </div>

          <div class="card">
            <div id="admin-complaints-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/permissions.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/complaints.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      /* ==========================================================================
         Complaints — Admin workspace.
         - Lists ALL complaints (private + public)
         - Filter tabs for status and visibility
         - Opens a modal with full details, history, responses
         - Status updates and responses are recorded with:
             PUBLIC identity:  Permissions.getByline(session)  →  office byline
             INTERNAL audit:   session.name + office
         - Admin responses display as the office (Space Admin / PRO, OAUSTECHSU)
           rather than the responding admin's personal name.
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session || !Permissions.isAdminRole(session)) {
          window.location.href = "../auth/login.html";
          return;
        }
        if (!Permissions.can(session, "complaints.view")) {
          window.location.href = "dashboard.html";
          return;
        }
        initAppShell("admin");

        var canRespond = Permissions.can(session, "complaints.respond");

        var listEl = document.getElementById("admin-complaints-list");
        var countEl = document.getElementById("cm-count");
        var searchEl = document.getElementById("cm-search");
        var statusFilterBar = document.getElementById("cm-status-filter");
        var visibilityFilterBar = document.getElementById(
          "cm-visibility-filter",
        );

        var statusFilter = "all";
        var visibilityFilter = "all";

        /* ------------------------------------------------------------------
           HELPERS
           ------------------------------------------------------------------ */
        var CATEGORY_ICONS = {
          Facilities: "fa-building",
          Academic: "fa-graduation-cap",
          Welfare: "fa-heart",
          Hostel: "fa-house",
          Security: "fa-shield-halved",
          Finance: "fa-coins",
          Other: "fa-circle-info",
        };

        function getCategoryIcon(category) {
          return CATEGORY_ICONS[category] || CATEGORY_ICONS.Other;
        }

        /* ------------------------------------------------------------------
           RENDER
           ------------------------------------------------------------------ */
        function render() {
          var all = Complaints.all();
          var q = searchEl.value.trim().toLowerCase();

          /* Update stat cards — count across ALL complaints */
          var counts = {
            Submitted: 0,
            "Under Review": 0,
            "In Progress": 0,
            Resolved: 0,
          };
          all.forEach(function (c) {
            if (counts[c.status] !== undefined) counts[c.status]++;
          });
          document.getElementById("stat-submitted").textContent =
            counts["Submitted"];
          document.getElementById("stat-review").textContent =
            counts["Under Review"];
          document.getElementById("stat-progress").textContent =
            counts["In Progress"];
          document.getElementById("stat-resolved").textContent =
            counts["Resolved"];

          /* Filter */
          var visible = all.filter(function (c) {
            if (statusFilter !== "all" && c.status !== statusFilter)
              return false;
            if (visibilityFilter !== "all" && c.visibility !== visibilityFilter)
              return false;
            if (!q) return true;
            return (
              (c.subject || "").toLowerCase().indexOf(q) !== -1 ||
              (c.id || "").toLowerCase().indexOf(q) !== -1 ||
              (c.category || "").toLowerCase().indexOf(q) !== -1 ||
              (c.submittedBy || "").toLowerCase().indexOf(q) !== -1 ||
              (c.submittedByName || "").toLowerCase().indexOf(q) !== -1
            );
          });

          /* Sort: unresolved first, newest first within each */
          var statusOrder = {
            Submitted: 0,
            "Under Review": 1,
            "In Progress": 2,
            Resolved: 3,
          };
          visible.sort(function (a, b) {
            var sa =
              statusOrder[a.status] !== undefined ? statusOrder[a.status] : 9;
            var sb =
              statusOrder[b.status] !== undefined ? statusOrder[b.status] : 9;
            if (sa !== sb) return sa - sb;
            return (b.updated || b.date) - (a.updated || a.date);
          });

          countEl.textContent =
            visible.length +
            " complaint" +
            (visible.length === 1 ? "" : "s") +
            (q || statusFilter !== "all" || visibilityFilter !== "all"
              ? " matching"
              : "");

          listEl.innerHTML = "";

          if (!visible.length) {
            var emptyMsg = q
              ? "No complaints match your search."
              : "No complaints in this filter";
            listEl.innerHTML =
              '<div class="empty-state" style="padding: 48px 24px;">' +
              '<div class="empty-icon"><i class="fa-solid fa-file-shield"></i></div>' +
              "<h3>" +
              emptyMsg +
              "</h3>" +
              "<p>Try a different filter or search term.</p>" +
              "</div>";
            return;
          }

          visible.forEach(function (c) {
            var isPublic = c.visibility === "public";
            var visibilityBadge = isPublic
              ? '<span class="badge badge-marine"><i class="fa-solid fa-globe"></i> Public</span>'
              : '<span class="badge badge-neutral"><i class="fa-solid fa-lock"></i> Private</span>';

            var row = document.createElement("div");
            row.className = "complaint-row cm-admin-row";

            row.innerHTML =
              '<span class="complaint-icon"><i class="fa-solid ' +
              getCategoryIcon(c.category) +
              '"></i></span>' +
              '<div class="complaint-info">' +
              "<h4>" +
              Util.escape(c.subject) +
              "</h4>" +
              '<div class="meta">' +
              '<span class="cm-id"><i class="fa-solid fa-hashtag"></i> ' +
              Util.escape(c.id) +
              "</span>" +
              '<span><i class="fa-solid fa-tag"></i> ' +
              Util.escape(c.category) +
              "</span>" +
              '<span><i class="fa-solid fa-user"></i> @' +
              Util.escape(c.submittedBy || "unknown") +
              "</span>" +
              '<span><i class="fa-regular fa-clock"></i> ' +
              Util.relativeTime(c.updated || c.date) +
              "</span>" +
              "</div>" +
              "</div>" +
              '<div class="cm-admin-badges">' +
              visibilityBadge +
              complaintStatusPill(c.status) +
              "</div>" +
              '<div class="cm-admin-actions">' +
              '<button class="btn btn-secondary btn-sm" data-open type="button">' +
              '<i class="fa-solid fa-eye"></i> <span>Open</span>' +
              "</button>" +
              "</div>";

            row
              .querySelector("[data-open]")
              .addEventListener("click", function () {
                openComplaint(c.id);
              });

            listEl.appendChild(row);
          });
        }

        /* ------------------------------------------------------------------
           OPEN COMPLAINT — full modal with details, history, responses, actions
           ------------------------------------------------------------------ */
        function openComplaint(id) {
          var c = Complaints.all().find(function (x) {
            return x.id === id;
          });
          if (!c) return;

          var existing = document.getElementById("admin-complaint-modal");
          if (existing) existing.remove();

          var isPublic = c.visibility === "public";

          /* --- Build history timeline --- */
          var historyHtml = (c.history || [])
            .map(function (h) {
              return (
                '<div style="padding:8px 0; border-bottom:1px dashed var(--border-subtle); font-size:var(--fs-xs);">' +
                '<div style="font-weight:600; color:var(--text-primary);">' +
                Util.escape(h.action) +
                "</div>" +
                '<div style="color:var(--text-tertiary); margin-top:2px;">' +
                Util.escape(h.actor) +
                " · " +
                Util.relativeTime(h.at) +
                "</div>" +
                "</div>"
              );
            })
            .join("");

          /* --- Build responses --- */
          var responsesHtml = (c.responses || []).length
            ? (c.responses || [])
                .map(function (r) {
                  var rtagHtml =
                    r.tag === "ADMIN"
                      ? ' <span class="tag-admin"><i class="fa-solid fa-shield-halved"></i> Admin</span>'
                      : r.tag
                        ? ' <span class="tag-leader">' +
                          Util.escape(r.tag) +
                          "</span>"
                        : "";
                  return (
                    '<div class="cm-response">' +
                    '<div class="cm-response-head">' +
                    '<span class="avatar avatar-32 avatar-fallback" style="background:var(--brand-primary);">' +
                    Util.initials(r.name || "Admin") +
                    "</span>" +
                    "<div>" +
                    '<div class="font-semibold" style="font-size:var(--fs-sm); display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
                    Util.escape(r.name || "Space Admin") +
                    rtagHtml +
                    "</div>" +
                    '<div class="text-xs text-muted">' +
                    Util.relativeTime(r.at) +
                    "</div>" +
                    "</div>" +
                    "</div>" +
                    '<p style="font-size:var(--fs-sm); color:var(--text-secondary); line-height:1.6; margin:0;">' +
                    Util.escape(r.text) +
                    "</p>" +
                    "</div>"
                  );
                })
                .join("")
            : '<p style="font-size:var(--fs-sm); color:var(--text-tertiary); margin:0 0 20px;">No responses yet.</p>';

          /* --- Visibility notice --- */
          var visibilityNotice = isPublic
            ? '<div class="cm-public-notice" style="margin-bottom: 20px;">' +
              '<i class="fa-solid fa-globe"></i>' +
              "<div>" +
              "<strong>This is a public complaint</strong>" +
              "<p>The campus community can see this and any responses you post. The filer\u2019s username (@' + Util.escape(c.submittedBy) + ') is shown, not their full name.</p>" +
              "</div>" +
              "</div>"
            : '<div class="cm-public-notice" style="margin-bottom: 20px; background: var(--bg-subtle); border-left-color: var(--text-tertiary);">' +
              '<i class="fa-solid fa-lock" style="color: var(--text-tertiary);"></i>' +
              "<div>" +
              "<strong>This is a private complaint</strong>" +
              "<p>Only the student who filed it and Admins can see this complaint.</p>" +
              "</div>" +
              "</div>";

          /* --- Filer identity strip (admin sees full identity) --- */
          var filerStrip =
            '<div class="cm-filer-strip">' +
            '<i class="fa-solid fa-user"></i>' +
            "<div>" +
            '<div class="cm-filer-name">' +
            Util.escape(c.submittedByName || c.submittedBy || "Unknown") +
            "</div>" +
            '<div class="cm-filer-handle">@' +
            Util.escape(c.submittedBy || "unknown") +
            "</div>" +
            "</div>" +
            '<span class="badge badge-neutral" style="margin-left:auto;">Only visible to you</span>' +
            "</div>";

          var modal = document.createElement("div");
          modal.className = "modal-backdrop";
          modal.id = "admin-complaint-modal";
          modal.setAttribute("role", "dialog");
          modal.setAttribute("aria-modal", "true");

          modal.innerHTML =
            '<div class="modal modal-lg">' +
            '<div class="modal-head">' +
            '<div style="min-width: 0;">' +
            "<h3>" +
            Util.escape(c.subject) +
            "</h3>" +
            '<p style="font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: 2px;">' +
            Util.escape(c.id) +
            " · " +
            Util.escape(c.category) +
            " · " +
            (isPublic ? "Public" : "Private") +
            "</p>" +
            "</div>" +
            '<button class="btn-icon" data-modal-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>' +
            "</div>" +
            '<div class="modal-body">' +
            /* Status strip */
            '<div class="cm-modal-status-strip">' +
            '<span class="text-xs text-muted" style="text-transform:uppercase; letter-spacing:.05em; font-weight:700;">Current status</span>' +
            complaintStatusPill(c.status) +
            "</div>" +
            /* Filer identity */
            filerStrip +
            /* Visibility notice */
            visibilityNotice +
            /* Description */
            '<div style="margin-bottom:24px;">' +
            '<div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;">Description</div>' +
            '<p style="color:var(--text-secondary); line-height:1.7; margin:0;">' +
            Util.escape(c.description) +
            "</p>" +
            "</div>" +
            /* Two-column: history + responses */
            '<div class="cm-modal-grid">' +
            "<div>" +
            '<div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;">History</div>' +
            '<div style="max-height: 240px; overflow-y: auto;">' +
            historyHtml +
            "</div>" +
            "</div>" +
            "<div>" +
            '<div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;">Responses</div>' +
            responsesHtml +
            "</div>" +
            "</div>" +
            /* Action panel */
            (canRespond
              ? '<div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border-subtle);">' +
                '<div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;">Take action</div>' +
                '<div class="cm-identity-preview">' +
                '<i class="fa-solid fa-shield-halved"></i>' +
                "<div>" +
                '<div class="cm-identity-label">Your response will be published as</div>' +
                '<div class="cm-identity-value">' +
                Util.escape(Permissions.getByline(session).name) +
                (Permissions.getByline(session).tag
                  ? ' <span class="tag-admin"><i class="fa-solid fa-shield-halved"></i> ' +
                    Util.escape(Permissions.getByline(session).tag) +
                    "</span>"
                  : "") +
                "</div>" +
                "</div>" +
                "</div>" +
                '<div class="field">' +
                '<label class="label" for="cm-status">Update status</label>' +
                '<select class="select" id="cm-status">' +
                ["Submitted", "Under Review", "In Progress", "Resolved"]
                  .map(function (s) {
                    return (
                      "<option" +
                      (c.status === s ? " selected" : "") +
                      ">" +
                      s +
                      "</option>"
                    );
                  })
                  .join("") +
                "</select>" +
                "</div>" +
                '<div class="field">' +
                '<label class="label" for="cm-response">Respond to student <span class="label-hint">Optional</span></label>' +
                '<textarea class="textarea" id="cm-response" placeholder="Write a response. The student will be notified." style="min-height:100px;"></textarea>' +
                "</div>" +
                '<div class="cluster" style="justify-content: flex-end; gap:10px;">' +
                '<button type="button" class="btn btn-secondary" data-modal-close>Close</button>' +
                '<button type="button" class="btn btn-primary" id="cm-submit">' +
                '<i class="fa-solid fa-check"></i> Update complaint' +
                "</button>" +
                "</div>" +
                "</div>"
              : '<div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border-subtle); text-align:right;">' +
                '<button type="button" class="btn btn-secondary" data-modal-close>Close</button>' +
                "</div>") +
            "</div>" +
            "</div>";

          document.body.appendChild(modal);

          /* --- Submit handler --- */
          if (canRespond) {
            modal
              .querySelector("#cm-submit")
              .addEventListener("click", function () {
                var newStatus = modal.querySelector("#cm-status").value;
                var response = modal.querySelector("#cm-response").value.trim();
                var changed = false;

                /* Public-facing byline (what students see) */
                var byline = Permissions.getByline(session);

                /* Internal audit identity (name + office) */
                var role = Permissions.getRole(session);
                var auditIdentity =
                  (session.name || session.username) +
                  " (" +
                  (Permissions.getRoleLabel(role) || "Admin") +
                  ")";

                if (newStatus !== c.status) {
                  Complaints.updateStatus(c.id, newStatus, auditIdentity);
                  changed = true;
                }
                if (response) {
                  /* Pass the office byline so students see the office, not the admin's name */
                  Complaints.respond(c.id, response, {
                    name: byline.name,
                    tag: byline.tag,
                  });
                  changed = true;
                }

                if (!changed) {
                  Toast.info("No changes made.", "Nothing to save");
                  return;
                }

                Modal.close("admin-complaint-modal");
                render();
                Toast.success(
                  "Complaint updated. Student will be notified.",
                  "Saved",
                );
              });
          }

          Modal.open("admin-complaint-modal");
        }

        /* ------------------------------------------------------------------
           FILTERS
           ------------------------------------------------------------------ */
        statusFilterBar.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-status]");
          if (!btn) return;
          statusFilterBar.querySelectorAll(".chip").forEach(function (c) {
            c.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          statusFilter = btn.getAttribute("data-status");
          render();
        });

        visibilityFilterBar.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-visibility]");
          if (!btn) return;
          visibilityFilterBar.querySelectorAll(".chip").forEach(function (c) {
            c.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          visibilityFilter = btn.getAttribute("data-visibility");
          render();
        });

        var debounce;
        searchEl.addEventListener("input", function () {
          clearTimeout(debounce);
          debounce = setTimeout(render, 120);
        });

        render();
      });
    </script>
  </body>
</html>
