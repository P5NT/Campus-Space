<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources — Admin — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Resources</h1>
              <p class="page-subtitle">
                A quick view of all resources across the platform.
              </p>
            </div>
            <a href="academic-resources.html" class="btn btn-primary">
              <i class="fa-solid fa-upload"></i> Manage resources
            </a>
          </div>
          <div class="grid grid-3">
            <div class="stat">
              <div class="stat-label">Total Resources</div>
              <div class="stat-value" id="rs-total">—</div>
              <div class="stat-meta">Across all categories</div>
            </div>
            <div class="stat">
              <div class="stat-label">This Month</div>
              <div class="stat-value" id="rs-month">—</div>
              <div class="stat-meta">New uploads</div>
            </div>
            <div class="stat">
              <div class="stat-label">Categories</div>
              <div class="stat-value" id="rs-cats">—</div>
              <div class="stat-meta">Distinct resource types</div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");
        document.getElementById("rs-total").textContent = DEMO_RESOURCES.length;
        const month = new Date().getMonth();
        document.getElementById("rs-month").textContent = DEMO_RESOURCES.filter(
          (r) => new Date(r.uploaded).getMonth() === month,
        ).length;
        document.getElementById("rs-cats").textContent = new Set(
          DEMO_RESOURCES.map((r) => r.category),
        ).size;
      });
    </script>
  </body>
</html>
