<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunities — Admin — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Opportunities</h1>
              <p class="page-subtitle">
                Manage scholarships, internships and other listings.
              </p>
            </div>
            <button class="btn btn-primary" data-modal-open="add-opp-modal">
              <i class="fa-solid fa-plus"></i> Add opportunity
            </button>
          </div>
          <div class="card">
            <div id="opp-admin-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="add-opp-modal">
      <div class="modal modal-lg">
        <div class="modal-head">
          <h3>Add opportunity</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="add-opp-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label">Title <span class="req">*</span></label>
              <input class="input" name="title" />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a title.</span>
              </div>
            </div>
            <div class="grid grid-2" style="gap: 16px">
              <div class="field">
                <label class="label">Category <span class="req">*</span></label>
                <select class="select" name="category">
                  <option value="">Select category</option>
                  <option>Scholarships</option>
                  <option>Internships</option>
                  <option>SIWES</option>
                  <option>Jobs</option>
                  <option>Competitions</option>
                  <option>Hackathons</option>
                  <option>Fellowships</option>
                  <option>Volunteering</option>
                  <option>Conferences</option>
                  <option>Training</option>
                  <option>Grants</option>
                </select>
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please select a category.</span>
                </div>
              </div>
              <div class="field">
                <label class="label"
                  >Organization <span class="req">*</span></label
                >
                <input class="input" name="organization" />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please enter the organization.</span>
                </div>
              </div>
              <div class="field">
                <label class="label">Location <span class="req">*</span></label>
                <input class="input" name="location" />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please enter the location.</span>
                </div>
              </div>
              <div class="field">
                <label class="label">Deadline <span class="req">*</span></label>
                <input class="input" type="date" name="deadline" />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please set a deadline.</span>
                </div>
              </div>
            </div>
            <div class="field">
              <label class="label">Summary <span class="req">*</span></label>
              <input class="input" name="summary" />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please add a summary.</span>
              </div>
            </div>
            <div class="field">
              <label class="label"
                >Description <span class="req">*</span></label
              >
              <textarea class="textarea" name="description"></textarea>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please write a description.</span>
              </div>
            </div>
            <div class="field">
              <label class="label">Application URL</label>
              <input class="input" name="applyUrl" placeholder="https://…" />
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Add opportunity
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/opportunities.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (
          !session ||
          (session.role !== "admin" && session.role !== "super_admin")
        ) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        const listEl = document.getElementById("opp-admin-list");
        function render() {
          listEl.innerHTML = "";
          DEMO_OPPORTUNITIES.forEach((o) => {
            const el = document.createElement("div");
            el.className = "resource-row";
            el.innerHTML = `
        <span class="resource-icon"><i class="fa-solid fa-briefcase"></i></span>
        <div class="resource-info">
          <div class="resource-name">${Util.escape(o.title)}</div>
          <div class="resource-meta">
            <span>${Util.escape(o.category)}</span>
            <span>${Util.escape(o.organization)}</span>
            <span><i class="fa-regular fa-clock"></i> ${Util.formatDate(o.deadline)}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-edit><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-ghost btn-sm" data-del style="color:var(--danger);"><i class="fa-solid fa-trash"></i></button>`;
            el.querySelector("[data-edit]").addEventListener("click", () =>
              Toast.info('Edit "' + o.title + '" (simulated).', "Edit"),
            );
            el.querySelector("[data-del]").addEventListener(
              "click",
              async () => {
                if (
                  await Confirmation.confirm({
                    title: "Delete this opportunity?",
                    message: '"' + o.title + '" will be removed.',
                    confirmLabel: "Delete",
                    variant: "danger",
                  })
                ) {
                  const idx = DEMO_OPPORTUNITIES.findIndex(
                    (x) => x.id === o.id,
                  );
                  DEMO_OPPORTUNITIES.splice(idx, 1);
                  render();
                  Toast.success("Opportunity deleted.", "Removed");
                }
              },
            );
            listEl.appendChild(el);
          });
        }
        render();

        bindForm(
          document.getElementById("add-opp-form"),
          {
            title: [Rules.required],
            category: [Rules.required],
            organization: [Rules.required],
            location: [Rules.required],
            deadline: [Rules.required],
            summary: [Rules.required],
            description: [Rules.required, Rules.minLen(20)],
          },
          (data) => {
            DEMO_OPPORTUNITIES.unshift({
              id: "opp-" + Date.now(),
              title: data.get("title"),
              category: data.get("category"),
              organization: data.get("organization"),
              location: data.get("location"),
              deadline: data.get("deadline"),
              summary: data.get("summary"),
              description: data.get("description"),
              requirements: ["See description for requirements"],
              applyUrl: data.get("applyUrl") || "#",
            });
            render();
            Modal.close("add-opp-modal");
            document.getElementById("add-opp-form").reset();
            Toast.success("Opportunity added. Students notified.", "Added");
          },
        );
      });
    </script>
  </body>
</html>
