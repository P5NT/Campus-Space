<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div
            class="container-narrow"
            style="padding-left: 0; padding-right: 0"
          >
            <div class="cluster" style="margin-bottom: 16px">
              <a href="campus-news.html" class="btn btn-ghost btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to news
              </a>
            </div>
            <article id="news-article"></article>
          </div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/news.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      /* ==========================================================================
         News detail page.
         Three states:
           1. Valid article       → render it
           2. Expired article     → show "no longer available" state
           3. Not found / deleted → show "article not found" state
         Reads merged data from DEMO_NEWS + cs_news_overrides (added/edits/deleted).
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var el = document.getElementById("news-article");
        var id = new URLSearchParams(location.search).get("id");

        /* ------------------------------------------------------------------
           LOAD — merge demo seed with admin overrides
           ------------------------------------------------------------------ */
        function loadNews() {
          var base = (typeof DEMO_NEWS !== "undefined" ? DEMO_NEWS : []).map(
            function (n) {
              return Object.assign({}, n);
            },
          );

          var saved = Store.get("news_overrides", null);
          if (saved && Array.isArray(saved.added)) {
            saved.added.forEach(function (n) {
              if (
                !base.some(function (x) {
                  return x.id === n.id;
                })
              ) {
                base.unshift(n);
              }
            });
          }
          if (saved && Array.isArray(saved.deleted)) {
            base = base.filter(function (n) {
              return saved.deleted.indexOf(n.id) === -1;
            });
          }
          if (saved && saved.edits) {
            base.forEach(function (n) {
              var edit = saved.edits[n.id];
              if (edit) Object.assign(n, edit);
            });
          }
          return base;
        }

        function isExpired(article) {
          if (!article || !article.expiresAt) return false;
          var expiry = new Date(article.expiresAt);
          if (isNaN(expiry.getTime())) return false;
          var now = new Date();
          now.setHours(0, 0, 0, 0);
          return expiry < now;
        }

        var allNews = loadNews();
        var article = id
          ? allNews.find(function (n) {
              return n.id === id;
            })
          : null;

        /* ---------- State 3 — Not found ---------- */
        if (!article) {
          el.innerHTML =
            '<div class="empty-state" style="padding: 64px 24px; max-width: 480px; margin: 0 auto;">' +
            '<div class="empty-icon"><i class="fa-regular fa-newspaper"></i></div>' +
            "<h3>Article not found</h3>" +
            "<p>This article may have been removed or the link is incorrect.</p>" +
            '<a class="btn btn-secondary" href="campus-news.html">' +
            '<i class="fa-solid fa-arrow-left"></i> Back to Campus News' +
            "</a>" +
            "</div>";
          return;
        }

        /* ---------- State 2 — Expired ---------- */
        if (isExpired(article)) {
          el.innerHTML =
            '<div class="empty-state" style="padding: 64px 24px; max-width: 520px; margin: 0 auto;">' +
            '<div class="empty-icon" style="background: var(--warning-soft); color: var(--warning);">' +
            '<i class="fa-solid fa-clock"></i>' +
            "</div>" +
            "<h3>This article is no longer available</h3>" +
            "<p>" +
            "It expired on " +
            Util.formatDate(article.expiresAt, {
              day: "numeric",
              month: "long",
              year: "numeric",
            }) +
            ". You may be able to find related coverage in Campus News." +
            "</p>" +
            '<a class="btn btn-secondary" href="campus-news.html">' +
            '<i class="fa-solid fa-arrow-left"></i> Back to Campus News' +
            "</a>" +
            "</div>";
          return;
        }

        /* ---------- State 1 — Render the article ---------- */
        var fullDate = Util.formatDate(article.date, {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        /* Media block: image when available, branded placeholder otherwise.
           On image load error, swap to placeholder. */
        var mediaHtml = article.image
          ? '<div class="news-detail-media">' +
            '<img src="' +
            Util.escape(article.image) +
            '" alt="" ' +
            "onerror=\"this.parentElement.classList.add('is-placeholder'); this.remove();\">" +
            "</div>"
          : '<div class="news-detail-media is-placeholder"></div>';

        /* Body paragraphs — split on blank lines */
        var bodyHtml = (article.body || "")
          .split(/\n\s*\n/)
          .map(function (p) {
            return '<p style="margin-bottom:16px;">' + Util.escape(p) + "</p>";
          })
          .join("");

        /* Build the author line with an optional admin badge */
        var authorHtml =
          '<span><i class="fa-solid fa-user"></i> ' +
          Util.escape(article.author || "Space Admin") +
          (article.isAdminAuthor || article.authorTag === "ADMIN"
            ? ' <span class="tag-admin"><i class="fa-solid fa-shield-halved"></i> Admin</span>'
            : "") +
          "</span>";

        el.innerHTML =
          '<span class="badge badge-brand" style="margin-bottom:16px;">' +
          Util.escape(article.category) +
          "</span>" +
          '<h1 class="page-title" style="font-size:var(--fs-3xl); line-height:1.15; margin-bottom:16px;">' +
          Util.escape(article.title) +
          "</h1>" +
          '<div class="cluster" style="font-size:var(--fs-sm); color:var(--text-tertiary); margin-bottom:24px; gap:16px;">' +
          authorHtml +
          '<span><i class="fa-regular fa-calendar"></i> ' +
          fullDate +
          "</span>" +
          "</div>" +
          mediaHtml +
          '<div style="font-size:var(--fs-md); line-height:1.75; color:var(--text-primary);">' +
          bodyHtml +
          "</div>";
      });
    </script>
  </body>
</html>
