<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunity — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="opportunities.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to opportunities
            </a>
          </div>
          <div id="opp-detail"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/opportunities.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const id = new URLSearchParams(location.search).get("id");
        const o =
          DEMO_OPPORTUNITIES.find((x) => x.id === id) || DEMO_OPPORTUNITIES[0];
        const days = Math.ceil((new Date(o.deadline) - Date.now()) / 86400000);
        const wrap = document.getElementById("opp-detail");

        wrap.innerHTML = `
    <div class="card card-pad-lg" style="margin-bottom:24px;">
      <div class="cluster" style="margin-bottom:16px;">
        <span class="badge badge-marine">${Util.escape(o.category)}</span>
        <span class="badge badge-neutral"><i class="fa-solid fa-location-dot"></i> ${Util.escape(o.location)}</span>
      </div>
      <h1 class="page-title" style="font-size:var(--fs-2xl); margin-bottom:8px;">${Util.escape(o.title)}</h1>
      <p style="font-size:var(--fs-md); color:var(--brand-secondary); font-weight:600;">${Util.escape(o.organization)}</p>

      <div class="grid grid-3" style="margin-top:24px; gap:16px;">
        <div>
          <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Deadline</div>
          <div class="font-semibold">${Util.formatDate(o.deadline, { day: "numeric", month: "long", year: "numeric" })}</div>
          <div class="text-xs text-muted" style="margin-top:2px;">${days < 0 ? "Expired" : days === 0 ? "Due today" : days + " days remaining"}</div>
        </div>
        <div>
          <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Category</div>
          <div class="font-semibold">${Util.escape(o.category)}</div>
        </div>
        <div>
          <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Location</div>
          <div class="font-semibold">${Util.escape(o.location)}</div>
        </div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start;">
      <div>
        <div class="card card-pad">
          <h2 style="font-size:var(--fs-lg); margin-bottom:12px;">About this opportunity</h2>
          <p style="line-height:1.75; color:var(--text-secondary);">${Util.escape(o.description)}</p>
        </div>

        <div class="card card-pad" style="margin-top:16px;">
          <h2 style="font-size:var(--fs-lg); margin-bottom:12px;">Requirements</h2>
          <ul style="display:grid; gap:10px; padding-left:0; list-style:none;">
            ${o.requirements.map((r) => `<li style="display:flex; gap:10px; align-items:flex-start; font-size:var(--fs-sm); color:var(--text-secondary);"><i class="fa-solid fa-circle-check" style="color:var(--success); margin-top:4px;"></i> ${Util.escape(r)}</li>`).join("")}
          </ul>
        </div>
      </div>

      <aside>
        <div class="card card-pad">
          <h3 style="font-size:var(--fs-md); margin-bottom:8px;">Ready to apply?</h3>
          <p style="font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:16px;">Open the official application page for full instructions.</p>
          <a href="${o.applyUrl}" target="_blank" rel="noopener" class="btn btn-primary btn-block" data-external>
            Apply now <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <button class="btn btn-secondary btn-block" style="margin-top:8px;" id="save-opp">
            <i class="fa-regular fa-bookmark"></i> Save for later
          </button>
        </div>
      </aside>
    </div>
  `;

        document.getElementById("save-opp").addEventListener("click", (e) => {
          const saved = Store.get("saved_opportunities", []);
          if (!saved.includes(o.id)) {
            saved.push(o.id);
            Store.set("saved_opportunities", saved);
            e.currentTarget.innerHTML =
              '<i class="fa-solid fa-bookmark"></i> Saved';
            Toast.success("Opportunity saved.", "Saved");
          } else {
            Toast.info("Already in your saved list.", "Saved");
          }
        });

        document
          .querySelector("[data-external]")
          .addEventListener("click", (e) => {
            if (o.applyUrl === "#") {
              e.preventDefault();
              Toast.info(
                "This opportunity opens externally in the live product.",
                "External link",
              );
            }
          });
      });
    </script>
  </body>
</html>
