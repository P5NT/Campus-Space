<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="community.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back
            </a>
          </div>

          <div id="student-profile-root"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      /* ==========================================================================
   Public student profile.

   Phone visibility rules:
   - Leaders: phone ALWAYS visible (Admin-tagged, mandatory).
   - Regular students: phone visible only if student.phoneVisible === true.
     Default when the field is missing: hidden.
   - When phone is hidden, the Call button is also hidden (both in the
     hero actions and in the sidebar Contact card).
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        if (window._studentProfileInit) return;
        window._studentProfileInit = true;

        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var id = new URLSearchParams(location.search).get("id");
        var root = document.getElementById("student-profile-root");

        var student =
          typeof DEMO_STUDENTS !== "undefined"
            ? DEMO_STUDENTS.find(function (s) {
                return String(s.id) === String(id);
              })
            : null;

        if (!student) {
          root.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div>' +
            "<h3>Student not found</h3>" +
            "<p>We couldn't find that student.</p>" +
            '<a class="btn btn-secondary" href="community.html">Back to Community</a>' +
            "</div>";
          return;
        }

        if (student.status && student.status !== "active") {
          root.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-user-lock"></i></div>' +
            "<h3>This account is not available</h3>" +
            "<p>This student's profile is not currently visible.</p>" +
            '<a class="btn btn-secondary" href="community.html">Back to Community</a>' +
            "</div>";
          return;
        }

        var isSelf = session.username === student.username;
        var leaderInfo =
          typeof getLeaderList === "function"
            ? getLeaderList().find(function (l) {
                return l.student.id === student.id;
              })
            : null;
        var isLeader = !!leaderInfo;

        /* ---------- The visibility rule ---------- */
        var phoneVisible = isLeader ? true : student.phoneVisible === true;

        var fullName = [student.firstName, student.otherName, student.lastName]
          .filter(Boolean)
          .join(" ");
        var initials = Util.initials(fullName);
        var avatarUrl = student.avatar || "";

        var avatarInner = avatarUrl
          ? '<img src="' + avatarUrl + '" alt="" class="avatar avatar-96">'
          : '<span class="avatar avatar-96 avatar-fallback">' +
            initials +
            "</span>";

        /* ---------- Hero actions ---------- */
        var heroActions;
        if (isSelf) {
          heroActions =
            '<a href="profile.html" class="btn btn-primary"><i class="fa-solid fa-pen"></i> Edit my profile</a>' +
            '<a href="settings.html" class="btn btn-secondary"><i class="fa-solid fa-gear"></i> Settings</a>';
        } else if (phoneVisible) {
          heroActions =
            '<a href="tel:' +
            student.phone.replace(/\s+/g, "") +
            '" class="btn btn-primary"><i class="fa-solid fa-phone"></i> Call</a>' +
            '<button class="btn btn-secondary" id="copy-contact-btn" type="button"><i class="fa-solid fa-copy"></i> Copy contact</button>';
        } else {
          // Phone hidden — no Call CTA, no copy
          heroActions =
            '<a href="mailto:' +
            student.email +
            '" class="btn btn-secondary"><i class="fa-solid fa-envelope"></i> Send email</a>';
        }

        /* ---------- Leader tags row ---------- */
        var leaderTagHtml = isLeader
          ? '<span class="badge badge-brand"><i class="fa-solid fa-ranking-star"></i> ' +
            Util.escape(leaderInfo.assoc.acronym) +
            " · " +
            Util.escape(leaderInfo.pos.name) +
            "</span>"
          : "";

        /* ---------- Leadership section ---------- */
        var leaderSection = isLeader
          ? '<div class="card profile-v2-card">' +
            '<div class="card-head">' +
            '<h3><i class="fa-solid fa-ranking-star" style="color:var(--brand-primary); margin-right:8px;"></i> Leadership Role</h3>' +
            "</div>" +
            '<div class="profile-v2-info-grid">' +
            '<div class="profile-v2-info">' +
            '<span class="label">Association</span>' +
            '<span class="value">' +
            Util.escape(leaderInfo.assoc.name) +
            "</span>" +
            "</div>" +
            '<div class="profile-v2-info">' +
            '<span class="label">Public tag</span>' +
            '<span class="value">' +
            Util.escape(leaderInfo.assoc.acronym) +
            "</span>" +
            "</div>" +
            '<div class="profile-v2-info profile-v2-info-wide">' +
            '<span class="label">Position</span>' +
            '<span class="value">' +
            Util.escape(leaderInfo.pos.name) +
            "</span>" +
            "</div>" +
            "</div>" +
            "</div>"
          : "";

        /* ---------- Contact sidebar — dynamic per phone visibility ---------- */
        var phoneRow = phoneVisible
          ? '<div class="profile-v2-side-row">' +
            '<span class="label">Phone</span>' +
            '<a class="value" href="tel:' +
            student.phone.replace(/\s+/g, "") +
            '" style="color:var(--brand-primary); text-decoration:none; font-weight:600;">' +
            Util.escape(student.phone) +
            "</a>" +
            "</div>"
          : '<div class="profile-v2-side-row">' +
            '<span class="label">Phone</span>' +
            '<span class="value" style="color:var(--text-tertiary); font-weight:500; display:inline-flex; align-items:center; gap:6px;">' +
            '<i class="fa-solid fa-eye-slash" style="font-size:11px;"></i> Hidden by user' +
            "</span>" +
            "</div>";

        var contactCard =
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-address-book" style="color:var(--brand-secondary); margin-right:8px;"></i> Contact</h3>' +
          "</div>" +
          '<div class="profile-v2-side-list">' +
          phoneRow +
          '<div class="profile-v2-side-row">' +
          '<span class="label">Email</span>' +
          '<a class="value" href="mailto:' +
          student.email +
          '" style="color:var(--brand-primary); text-decoration:none; font-weight:600; word-break:break-all;">' +
          Util.escape(student.email) +
          "</a>" +
          "</div>" +
          "</div>" +
          "</div>";

        root.innerHTML =
          '<div class="profile-hero-v2">' +
          '<div class="profile-cover-v2">' +
          '<div class="profile-cover-grain" aria-hidden="true"></div>' +
          '<div class="profile-cover-overlay" aria-hidden="true"></div>' +
          "</div>" +
          '<div class="profile-hero-body-v2">' +
          '<div class="profile-avatar-v2">' +
          '<div class="profile-avatar-slot">' +
          avatarInner +
          "</div>" +
          "</div>" +
          '<div class="profile-hero-info">' +
          '<div class="profile-hero-name-row">' +
          "<h1>" +
          Util.escape(fullName) +
          "</h1>" +
          (isLeader
            ? '<i class="fa-solid fa-circle-check tag-verified" aria-label="Verified leader"></i>'
            : "") +
          "</div>" +
          '<div class="profile-hero-handle">@' +
          Util.escape(student.username) +
          "</div>" +
          '<div class="profile-hero-tags">' +
          leaderTagHtml +
          '<span class="badge badge-marine"><i class="fa-solid fa-building-columns"></i> ' +
          Util.escape(student.department) +
          "</span>" +
          '<span class="badge badge-neutral"><i class="fa-solid fa-graduation-cap"></i> ' +
          Util.escape(student.level) +
          " Level</span>" +
          '<span class="badge badge-success"><i class="fa-solid fa-shield-halved"></i> Verified</span>' +
          "</div>" +
          '<p class="profile-hero-bio">' +
          Util.escape(student.department) +
          " student at OAUSTECH · Faculty of " +
          Util.escape(student.faculty) +
          "</p>" +
          "</div>" +
          '<div class="profile-hero-actions">' +
          heroActions +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="profile-v2-grid">' +
          '<div class="profile-v2-main">' +
          leaderSection +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-graduation-cap" style="color:var(--brand-primary); margin-right:8px;"></i> Academic Information</h3>' +
          "</div>" +
          '<div class="profile-v2-info-grid">' +
          '<div class="profile-v2-info"><span class="label">Faculty</span><span class="value">' +
          Util.escape(student.faculty) +
          "</span></div>" +
          '<div class="profile-v2-info"><span class="label">Department</span><span class="value">' +
          Util.escape(student.department) +
          "</span></div>" +
          '<div class="profile-v2-info"><span class="label">Level</span><span class="value">' +
          Util.escape(student.level) +
          " Level</span></div>" +
          '<div class="profile-v2-info"><span class="label">Member since</span><span class="value">' +
          Util.formatDate(student.joined, { month: "long", year: "numeric" }) +
          "</span></div>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<aside class="profile-v2-side">' +
          contactCard +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-user-check" style="color:var(--brand-primary); margin-right:8px;"></i> Account</h3>' +
          "</div>" +
          '<div class="profile-v2-side-list">' +
          '<div class="profile-v2-side-row"><span class="label">Username</span><span class="value">@' +
          Util.escape(student.username) +
          "</span></div>" +
          '<div class="profile-v2-side-row"><span class="label">Status</span><span class="badge badge-success"><i class="fa-solid fa-circle-check"></i> Active</span></div>' +
          "</div>" +
          "</div>" +
          "</aside>" +
          "</div>";

        var copyBtn = document.getElementById("copy-contact-btn");
        if (copyBtn) {
          copyBtn.addEventListener("click", function () {
            var text =
              fullName +
              " — " +
              student.department +
              ", " +
              student.level +
              " Level\nPhone: " +
              student.phone +
              "\nEmail: " +
              student.email;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText(text)
                .then(function () {
                  if (typeof Toast !== "undefined")
                    Toast.success("Contact details copied.", "Copied");
                })
                .catch(function () {
                  if (typeof Toast !== "undefined")
                    Toast.info("Copy failed.", "Copied");
                });
            } else {
              if (typeof Toast !== "undefined")
                Toast.success("Contact details copied.", "Copied");
            }
          });
        }
      });
    </script>
  </body>
</html>
