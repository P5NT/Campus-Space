<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Events</h1>
              <p class="page-subtitle">
                Discover what's happening at OAUSTECH. Tickets via our partner,
                PassSpot.
              </p>
            </div>
            <a
              href="https://passspot.netlify.app/"
              target="_blank"
              rel="noopener"
              class="btn btn-secondary"
              data-external
            >
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Open
              PassSpot
            </a>
          </div>

          <div class="filter-bar">
            <button class="chip is-active" data-cat="all">All</button>
            <button class="chip" data-cat="Technology">Technology</button>
            <button class="chip" data-cat="Career">Career</button>
            <button class="chip" data-cat="Culture">Culture</button>
            <button class="chip" data-cat="Hackathon">Hackathon</button>
            <button class="chip" data-cat="Health">Health</button>
            <button class="chip" data-cat="Business">Business</button>
          </div>

          <div class="grid grid-3" id="events-grid"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/events.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/events.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const grid = document.getElementById("events-grid");
        let cat = "all";
        function apply() {
          let list = DEMO_EVENTS.slice();
          if (cat !== "all") list = list.filter((e) => e.category === cat);
          renderEvents(grid, list);
        }
        document.querySelectorAll("[data-cat]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll("[data-cat]")
              .forEach((b) => b.classList.remove("is-active"));
            btn.classList.add("is-active");
            cat = btn.getAttribute("data-cat");
            apply();
          });
        });
        apply();
      });
    </script>
  </body>
</html>
