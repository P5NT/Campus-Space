<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Information — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">My Department</h1>
              <p class="page-subtitle">
                Details about the department your account is registered under.
              </p>
            </div>
          </div>

          <div id="dept-root"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      /* ==========================================================================
   Department Information — shows ONLY the student's own department.
   ========================================================================== */
      (function () {
        "use strict";
        if (window._deptInfoInit) return;
        window._deptInfoInit = true;

        function boot() {
          var session = Auth.current();
          if (!session) {
            window.location.href = "../auth/login.html";
            return;
          }
          initAppShell("student");

          var student = DEMO_STUDENTS.find(function (s) {
            return s.username === session.username;
          });
          var root = document.getElementById("dept-root");

          if (!student) {
            root.innerHTML =
              '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div>' +
              "<h3>Account not found</h3><p>Contact Admin.</p></div>";
            return;
          }

          /* Find faculty to get department details */
          var faculty = DEMO_FACULTIES.find(function (f) {
            return f.name === student.faculty;
          });
          var dept = faculty
            ? faculty.departments.find(function (d) {
                return d.name === student.department;
              })
            : null;

          /* Student's level and courses */
          var levelCourses = DEMO_COURSES.filter(function (c) {
            return (
              c.department === student.department && c.level === student.level
            );
          });
          var allDeptCourses = DEMO_COURSES.filter(function (c) {
            return c.department === student.department;
          });

          /* Demo faculty/department leadership — same for all, but plausible */
          var deptHead = "Dr. A. O. Bakare";
          var studentAdviser = "Dr. F. Ogundipe";

          var html = "";

          /* Hero */
          html += '<div class="card card-pad-lg" style="margin-bottom:20px;">';
          html +=
            '<div class="cluster" style="align-items:flex-start; gap:20px;">';
          html +=
            '<div class="qa-icon marine" style="width:56px; height:56px; font-size:22px; flex-shrink:0;">';
          html += '<i class="fa-solid fa-diagram-project"></i>';
          html += "</div>";
          html += '<div style="flex:1; min-width:0;">';
          if (faculty) {
            html +=
              '<span class="badge badge-marine" style="margin-bottom:8px;">' +
              Util.escape(faculty.shortName) +
              "</span>";
          }
          html +=
            '<h2 style="font-size:var(--fs-2xl); font-weight:800; letter-spacing:-0.02em; margin-bottom:6px;">' +
            Util.escape(student.department) +
            "</h2>";
          html +=
            '<p style="color:var(--text-secondary); font-size:var(--fs-base);">Your department at OAUSTECH · ' +
            Util.escape(student.level) +
            " Level</p>";
          html += "</div>";
          html += "</div>";
          html += "</div>";

          /* Quick stats */
          html += '<div class="grid grid-3" style="margin-bottom:20px;">';
          html +=
            '<div class="stat"><div class="stat-label">Level</div><div class="stat-value">' +
            Util.escape(student.level) +
            '</div><div class="stat-meta">Your current level</div></div>';
          html +=
            '<div class="stat"><div class="stat-label">Courses at your level</div><div class="stat-value">' +
            levelCourses.length +
            '</div><div class="stat-meta">' +
            allDeptCourses.length +
            " across all levels</div></div>";
          html +=
            '<div class="stat"><div class="stat-label">Faculty</div><div class="stat-value" style="font-size:var(--fs-base); line-height:1.3;">' +
            Util.escape(student.faculty) +
            "</div></div>";
          html += "</div>";

          /* Leadership */
          html += '<div class="card" style="margin-bottom:20px;">';
          html +=
            '<div class="card-head"><h3><i class="fa-solid fa-user-tie" style="color:var(--brand-primary); margin-right:8px;"></i> Department Leadership</h3></div>';
          html += '<div class="dept-info-grid">';
          html +=
            '<div class="dept-info-block"><div class="label">Head of Department</div><div class="value">' +
            Util.escape(deptHead) +
            "</div></div>";
          html +=
            '<div class="dept-info-block"><div class="label">Student Adviser</div><div class="value">' +
            Util.escape(studentAdviser) +
            "</div></div>";
          html += "</div>";
          html += "</div>";

          /* Courses at student's level */
          html += '<div class="card">';
          html +=
            '<div class="card-head"><h3><i class="fa-solid fa-book" style="color:var(--brand-secondary); margin-right:8px;"></i> Your Courses (' +
            Util.escape(student.level) +
            " Level)</h3></div>";

          if (!levelCourses.length) {
            html +=
              '<div class="empty-state" style="padding:32px;"><div class="empty-icon"><i class="fa-solid fa-book"></i></div>';
            html += "<h3>No courses listed for your level yet</h3>";
            html +=
              "<p>Course information will appear once Admin publishes the catalog for your level.</p>";
            html += "</div>";
          } else {
            levelCourses.forEach(function (c) {
              html +=
                '<a class="course-item" href="course-details.html?id=' +
                Util.escape(c.id) +
                '">';
              html +=
                '<span class="course-code">' + Util.escape(c.code) + "</span>";
              html += '<div class="course-info">';
              html +=
                '<div class="course-title">' + Util.escape(c.title) + "</div>";
              html +=
                '<div class="course-meta">' +
                Util.escape(c.lecturer) +
                " · " +
                c.units +
                " units · " +
                Util.escape(c.semester) +
                " Semester</div>";
              html += "</div>";
              html +=
                '<i class="fa-solid fa-chevron-right" style="color:var(--text-tertiary); font-size:12px;"></i>';
              html += "</a>";
            });
          }

          html += "</div>";

          root.innerHTML = html;
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
