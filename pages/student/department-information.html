<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Information — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Department Information</h1>
              <p class="page-subtitle">Your department at a glance.</p>
            </div>
          </div>
          <div id="dept-detail"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const student =
          DEMO_STUDENTS.find((s) => s.username === session.username) || {};
        const wrap = document.getElementById("dept-detail");
        const deptCourses = DEMO_COURSES.filter(
          (c) => c.department === student.department,
        );

        wrap.innerHTML = `
    <div class="card card-pad-lg" style="margin-bottom:24px;">
      <span class="badge badge-brand" style="margin-bottom:12px;">${Util.escape(student.faculty || "")}</span>
      <h1 class="page-title" style="font-size:var(--fs-2xl);">${Util.escape(student.department || "Department")}</h1>
      <p style="font-size:var(--fs-md); color:var(--text-secondary); margin-top:8px;">Everything you need to know about your academic department — courses, contacts and resources.</p>
    </div>

    <div class="grid grid-3" style="margin-bottom:24px;">
      <div class="stat">
        <div class="stat-label">Courses available</div>
        <div class="stat-value">${deptCourses.length || DEMO_COURSES.length}</div>
        <div class="stat-meta">In the current session</div>
      </div>
      <div class="stat">
        <div class="stat-label">Department Head</div>
        <div class="stat-value" style="font-size:var(--fs-lg);">Dr. A. O. Bakare</div>
        <div class="stat-meta">Available on weekdays</div>
      </div>
      <div class="stat">
        <div class="stat-label">Student Adviser</div>
        <div class="stat-value" style="font-size:var(--fs-lg);">Dr. F. Ogundipe</div>
        <div class="stat-meta">Department office</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Courses in this department</h3></div>
      <div id="dept-course-list"></div>
    </div>
  `;

        const list = document.getElementById("dept-course-list");
        const courses = deptCourses.length ? deptCourses : DEMO_COURSES;
        courses.forEach((c) => {
          const el = document.createElement("a");
          el.className = "course-item";
          el.href = "course-details.html?id=" + c.id;
          el.innerHTML = `
      <span class="course-code">${Util.escape(c.code)}</span>
      <div class="course-info">
        <div class="course-title">${Util.escape(c.title)}</div>
        <div class="course-meta">${c.units} units · ${Util.escape(c.lecturer)}</div>
      </div>
      <i class="fa-solid fa-chevron-right" style="color:var(--text-tertiary); font-size:12px;"></i>`;
          list.appendChild(el);
        });
      });
    </script>
  </body>
</html>
