<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Calendar — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Academic Calendar</h1>
              <p class="page-subtitle">
                Key dates for the 2026/2027 academic session.
              </p>
            </div>
            <button
              class="btn btn-primary"
              id="download-calendar"
              type="button"
            >
              <i class="fa-solid fa-download"></i> Download PDF
            </button>
          </div>

          <div class="cluster" style="margin-bottom: 16px">
            <span class="badge badge-brand">2026/2027 Session</span>
            <span class="badge badge-neutral" id="cal-count">—</span>
          </div>

          <div class="filter-bar" id="cal-tabs" role="tablist">
            <button class="chip is-active" data-semester="all" role="tab">
              All events
            </button>
            <button class="chip" data-semester="First" role="tab">
              First Semester
            </button>
            <button class="chip" data-semester="Second" role="tab">
              Second Semester
            </button>
          </div>

          <!-- First Semester section -->
          <section class="cal-student-section" id="cal-section-first">
            <div class="cal-student-section-head">
              <span
                class="cal-student-section-dot"
                style="background: var(--brand-primary)"
              ></span>
              <h2 class="cal-student-section-title">First Semester</h2>
              <span class="cal-student-section-count" id="cal-count-first"
                >0 events</span
              >
            </div>
            <div class="card card-pad-lg">
              <div class="timeline" id="cal-first-list"></div>
            </div>
          </section>

          <!-- Second Semester section -->
          <section class="cal-student-section" id="cal-section-second">
            <div class="cal-student-section-head">
              <span
                class="cal-student-section-dot"
                style="background: var(--brand-secondary)"
              ></span>
              <h2 class="cal-student-section-title">Second Semester</h2>
              <span class="cal-student-section-count" id="cal-count-second"
                >0 events</span
              >
            </div>
            <div class="card card-pad-lg">
              <div class="timeline" id="cal-second-list"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/calendar-events.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/calendar-admin.js"></script>
    <script src="../../js/pdf-generator.js"></script>
    <script>
      /* ==========================================================================
         Academic Calendar — Student view.
         Reads merged events (demo + admin overrides) via CalendarAdmin.
         Groups events by semester (First / Second) with bold section headings.
         Download produces the branded PDF, split by semester.
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var SESSION = "2026/2027";
        var activeSemester = "all";

        var firstList = document.getElementById("cal-first-list");
        var secondList = document.getElementById("cal-second-list");
        var sectionFirst = document.getElementById("cal-section-first");
        var sectionSecond = document.getElementById("cal-section-second");
        var countEl = document.getElementById("cal-count");
        var countFirstEl = document.getElementById("cal-count-first");
        var countSecondEl = document.getElementById("cal-count-second");
        var tabs = document.getElementById("cal-tabs");

        /* ------------------------------------------------------------------
           RENDER
           ------------------------------------------------------------------ */
        function render() {
          /* Merge demo + overrides via CalendarAdmin */
          var split =
            typeof CalendarAdmin !== "undefined"
              ? CalendarAdmin.getSplitEvents(SESSION)
              : {
                  first: (typeof DEMO_CALENDAR_EVENTS !== "undefined"
                    ? DEMO_CALENDAR_EVENTS
                    : []
                  ).filter(function (e) {
                    return e.semester === "First";
                  }),
                  second: (typeof DEMO_CALENDAR_EVENTS !== "undefined"
                    ? DEMO_CALENDAR_EVENTS
                    : []
                  ).filter(function (e) {
                    return e.semester === "Second";
                  }),
                };

          var first = split.first;
          var second = split.second;

          countEl.textContent =
            first.length +
            second.length +
            " event" +
            (first.length + second.length === 1 ? "" : "s");

          countFirstEl.textContent =
            first.length + " event" + (first.length === 1 ? "" : "s");
          countSecondEl.textContent =
            second.length + " event" + (second.length === 1 ? "" : "s");

          /* Tab filter — show/hide whole sections */
          if (activeSemester === "all" || activeSemester === "First") {
            sectionFirst.style.display = "";
          } else {
            sectionFirst.style.display = "none";
          }
          if (activeSemester === "all" || activeSemester === "Second") {
            sectionSecond.style.display = "";
          } else {
            sectionSecond.style.display = "none";
          }

          renderTimeline(firstList, first);
          renderTimeline(secondList, second);
        }

        function renderTimeline(wrap, list) {
          wrap.innerHTML = "";

          if (!list.length) {
            wrap.innerHTML =
              '<div style="padding:24px 0;text-align:center;color:var(--text-tertiary);font-size:var(--fs-sm);">' +
              "No dates in this semester yet." +
              "</div>";
            return;
          }

          list.forEach(function (e) {
            var item = document.createElement("div");
            item.className = "timeline-item";
            item.innerHTML =
              '<div class="timeline-date">' +
              Util.escape(
                e.displayDate ||
                  Util.formatDate(e.isoDate, {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                  }),
              ) +
              "</div>" +
              '<div class="timeline-title">' +
              Util.escape(e.title) +
              "</div>" +
              (e.desc
                ? '<div class="timeline-desc">' + Util.escape(e.desc) + "</div>"
                : "");
            wrap.appendChild(item);
          });
        }

        /* ------------------------------------------------------------------
           TABS
           ------------------------------------------------------------------ */
        tabs.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-semester]");
          if (!btn) return;
          tabs.querySelectorAll(".chip").forEach(function (c) {
            c.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          activeSemester = btn.getAttribute("data-semester");
          render();
        });

        /* ------------------------------------------------------------------
           DOWNLOAD — branded PDF via PdfGenerator
           ------------------------------------------------------------------ */
        document
          .getElementById("download-calendar")
          .addEventListener("click", function () {
            if (typeof PdfGenerator === "undefined") {
              Toast.error("Document generator not loaded.", "Error");
              return;
            }

            var split =
              typeof CalendarAdmin !== "undefined"
                ? CalendarAdmin.getSplitEvents(SESSION)
                : { first: [], second: [] };

            var all = split.first.concat(split.second);

            /* Filter to the active tab, if not "all" */
            if (activeSemester !== "all") {
              all = all.filter(function (e) {
                return e.semester === activeSemester;
              });
            }

            /* Map to PdfGenerator's expected shape */
            var data = all.map(function (e) {
              return {
                date:
                  e.displayDate ||
                  Util.formatDate(e.isoDate, {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                  }),
                title: e.title,
                desc: e.desc || "",
                semester: e.semester,
              };
            });

            var subtitle =
              "2026/2027 Academic Session" +
              (activeSemester !== "all"
                ? " — " + activeSemester + " Semester"
                : "");

            PdfGenerator.open({
              type: "calendar",
              title: "Academic Calendar",
              subtitle: subtitle,
              data: data,
            });
          });

        /* Initial render */
        render();
      });
    </script>
  </body>
</html>
