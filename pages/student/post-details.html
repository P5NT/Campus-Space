<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="community.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to community
            </a>
          </div>
          <div id="post-detail"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script src="../../js/community.js"></script>
    <script>
      /* ==========================================================================
   Post details — reads the post and its comments from the Community store,
   keeps them in sync with the feed, and persists new comments + likes.
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var id = new URLSearchParams(location.search).get("id");
        var allPosts = Community.all();
        var post =
          allPosts.find(function (p) {
            return p.id === id;
          }) || allPosts[0];

        if (!post) {
          document.getElementById("post-detail").innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-regular fa-comments"></i></div>' +
            "<h3>Post not found</h3>" +
            "<p>This post may have been deleted.</p>" +
            '<a class="btn btn-secondary" href="community.html">Back to community</a>' +
            "</div>";
          return;
        }

        /* Ensure the comments array exists (older posts may not have it) */
        if (!Array.isArray(post.comments)) post.comments = [];

        var wrap = document.getElementById("post-detail");

        /* ---- Helpers ---- */
        function tagHtmlFor(tag) {
          if (tag === "ADMIN") {
            return '<span class="tag-admin"><i class="fa-solid fa-shield-halved"></i> Admin</span>';
          }
          if (tag) {
            return '<span class="tag-leader">' + Util.escape(tag) + "</span>";
          }
          return "";
        }

        function commentCount() {
          return Community.countComments(post);
        }

        /* ---- Initial layout ---- */
        function renderShell() {
          var likeCount = post.likes || 0;
          var likedClass = post.liked ? " is-liked" : "";
          var heartIcon = post.liked ? "fa-solid" : "fa-regular";
          var imageHtml = post.image
            ? '<div class="post-media" style="margin-top:12px;"><img src="' +
              post.image +
              '" alt="" style="width:100%; border-radius:10px;"></div>'
            : "";

          wrap.innerHTML =
            '<article class="card" style="margin-bottom:20px;">' +
            '<div class="card-body">' +
            '<div class="post-head">' +
            '<span class="avatar avatar-48 avatar-fallback">' +
            Util.escape(post.initials) +
            "</span>" +
            '<div class="post-author">' +
            '<div class="post-author-name">' +
            Util.escape(post.author) +
            " " +
            tagHtmlFor(post.tag) +
            "</div>" +
            '<div class="post-author-handle">@' +
            Util.escape(post.handle) +
            " · " +
            Util.relativeTime(post.time) +
            "</div>" +
            "</div>" +
            "</div>" +
            (post.text
              ? '<div class="post-body" style="font-size:var(--fs-md);">' +
                Util.escape(post.text) +
                "</div>"
              : "") +
            imageHtml +
            '<div class="post-actions" style="border-top:none; padding-top:12px;">' +
            '<button class="post-action' +
            likedClass +
            '" id="detail-like" aria-label="Like post">' +
            '<i class="' +
            heartIcon +
            ' fa-heart"></i>' +
            "<span>" +
            likeCount +
            "</span>" +
            "</button>" +
            '<span class="post-action" aria-label="Comments">' +
            '<i class="fa-regular fa-comment"></i>' +
            '<span id="detail-comment-count">' +
            commentCount() +
            "</span>" +
            "</span>" +
            '<button class="post-action" id="detail-share" aria-label="Share post">' +
            '<i class="fa-solid fa-share-nodes"></i>' +
            "<span>Share</span>" +
            "</button>" +
            "</div>" +
            "</div>" +
            "</article>" +
            '<div class="card">' +
            '<div class="card-head">' +
            '<h3>Comments (<span id="comments-header-count">' +
            commentCount() +
            "</span>)</h3>" +
            "</div>" +
            '<div class="card-body" id="comments-wrap"></div>' +
            '<div class="card-foot">' +
            '<form id="comment-form" class="cluster" style="gap:12px; align-items:flex-end;">' +
            '<div class="field" style="flex:1; margin:0;">' +
            '<input class="input" type="text" name="comment" placeholder="Write a comment…" aria-label="Comment">' +
            "</div>" +
            '<button class="btn btn-primary" type="submit">' +
            '<i class="fa-solid fa-paper-plane"></i> Reply' +
            "</button>" +
            "</form>" +
            "</div>" +
            "</div>";

          wireActions();
          renderComments();
        }

        /* ---- Render comments ---- */
        function renderComments() {
          var commentsWrap = document.getElementById("comments-wrap");
          commentsWrap.innerHTML = "";

          if (!post.comments.length) {
            commentsWrap.innerHTML =
              '<div style="text-align:center; color:var(--text-tertiary); padding:24px 0;">No comments yet. Be the first to reply.</div>';
            return;
          }

          post.comments.forEach(function (c) {
            var el = document.createElement("div");
            el.className = "comment";
            el.innerHTML =
              '<span class="avatar avatar-32 avatar-fallback">' +
              Util.initials(c.author || c.name) +
              "</span>" +
              '<div class="comment-body">' +
              '<div class="comment-meta">' +
              '<span class="name">' +
              Util.escape(c.author || c.name) +
              "</span>" +
              '<span class="handle">@' +
              Util.escape(c.handle) +
              "</span>" +
              tagHtmlFor(c.tag) +
              '<span class="handle" style="margin-left:auto;">' +
              Util.relativeTime(c.time) +
              "</span>" +
              "</div>" +
              '<div class="comment-text">' +
              Util.escape(c.text) +
              "</div>" +
              "</div>";
            commentsWrap.appendChild(el);
          });
        }

        /* ---- Wire up like, share, and comment form ---- */
        function wireActions() {
          /* Like */
          var likeBtn = document.getElementById("detail-like");
          if (likeBtn) {
            likeBtn.addEventListener("click", function () {
              Community.toggleLike(post.id);
              var updated = Community.all().find(function (p) {
                return p.id === post.id;
              });
              if (!updated) return;
              post.liked = updated.liked;
              post.likes = updated.likes;
              var icon = likeBtn.querySelector("i");
              var span = likeBtn.querySelector("span");
              likeBtn.classList.toggle("is-liked", updated.liked);
              icon.className =
                (updated.liked ? "fa-solid" : "fa-regular") + " fa-heart";
              span.textContent = updated.likes;
            });
          }

          /* Share — copies the post URL */
          var shareBtn = document.getElementById("detail-share");
          if (shareBtn) {
            shareBtn.addEventListener("click", function () {
              var url = new URL(
                "post-details.html?id=" + encodeURIComponent(post.id),
                location.href,
              ).href;
              var done = function () {
                Toast.success("Post link copied to clipboard.", "Copied");
              };
              var failed = function () {
                Toast.info("Copy failed. The link is: " + url, "Copy manually");
              };

              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(done).catch(failed);
              } else {
                var ta = document.createElement("textarea");
                ta.value = url;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                try {
                  document.execCommand("copy");
                  done();
                } catch (e) {
                  failed();
                }
                document.body.removeChild(ta);
              }
            });
          }

          /* Comment form */
          var form = document.getElementById("comment-form");
          if (form) {
            form.addEventListener("submit", function (e) {
              e.preventDefault();
              var input = form.querySelector('[name="comment"]');
              var text = input.value.trim();
              if (!text) return;

              /* Build the new comment */
              var newComment = {
                id: "c" + Date.now(),
                author: session.name || session.username,
                handle: session.username,
                tag: "",
                time: Date.now(),
                text: text,
              };

              /* Push to the post's comments array and persist */
              post.comments.push(newComment);
              var stored = Community.all();
              var target = stored.find(function (p) {
                return p.id === post.id;
              });
              if (target) {
                target.comments = post.comments;
                Community.save(stored);
              }

              input.value = "";
              renderComments();

              /* Update both count displays */
              var hdr = document.getElementById("comments-header-count");
              var badge = document.getElementById("detail-comment-count");
              if (hdr) hdr.textContent = commentCount();
              if (badge) badge.textContent = commentCount();

              Toast.success("Comment posted.", "Posted");
            });
          }
        }

        renderShell();
      });
    </script>
  </body>
</html>
