<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Official Announcements</h1>
              <p class="page-subtitle">Important messages from Space Admin.</p>
            </div>
          </div>
          <div id="ann-list"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/news.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const wrap = document.getElementById("ann-list");
        const student = DEMO_STUDENTS.find(
          (s) => s.username === session.username,
        );

        /* ------------------------------------------------------------------
     Visibility rule — does this announcement target this student?
     ------------------------------------------------------------------ */
        function announcementVisibleTo(a, student) {
          if (!student) return true;
          if (!a.affected) return true;

          const audiences = Array.isArray(a.affected)
            ? a.affected
            : [a.affected];

          if (audiences.indexOf("All students") !== -1) return true;

          if (audiences.indexOf(student.level) !== -1) return true;
          if (audiences.indexOf(student.level + " Level") !== -1) return true;

          if (audiences.indexOf(student.faculty) !== -1) return true;

          const fac =
            typeof DEMO_FACULTIES !== "undefined"
              ? DEMO_FACULTIES.find((f) => f.name === student.faculty)
              : null;
          if (fac && audiences.indexOf(fac.shortName) !== -1) return true;

          if (audiences.indexOf(student.department) !== -1) return true;

          if (
            audiences.indexOf("New students") !== -1 &&
            student.level === "100"
          )
            return true;
          if (
            audiences.indexOf("Final year students") !== -1 &&
            student.level === "500"
          )
            return true;
          if (
            audiences.indexOf("Final year students") !== -1 &&
            student.level === "400"
          )
            return true;

          return false;
        }

        const visibleAnnouncements = DEMO_ANNOUNCEMENTS.filter((a) =>
          announcementVisibleTo(a, student),
        );

        /* ------------------------------------------------------------------
     Empty state
     ------------------------------------------------------------------ */
        if (!visibleAnnouncements.length) {
          wrap.innerHTML =
            '<div class="card"><div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-bullhorn"></i></div>' +
            "<h3>No announcements for you yet</h3>" +
            "<p>You'll see announcements here once Admin publishes messages aimed at your faculty, department, level or the entire student body.</p>" +
            "</div></div>";
          return;
        }

        /* ------------------------------------------------------------------
     Render each visible announcement
     ------------------------------------------------------------------ */
        visibleAnnouncements.forEach((a) => {
          const el = document.createElement("div");
          el.className = "announcement" + (a.important ? " is-important" : "");

          const audienceText = Array.isArray(a.affected)
            ? a.affected.join(", ")
            : a.affected || "All students";

          el.innerHTML = `
      <div class="announcement-head">
        <span class="avatar avatar-32 avatar-fallback" style="background:var(--brand-secondary); flex-shrink:0;">SA</span>
        <div class="announcement-head-info">
          <div class="font-semibold" style="font-size:var(--fs-sm);">${Util.escape(a.author)}</div>
          <div class="text-xs text-muted">${Util.formatDate(a.date, { day: "numeric", month: "long", year: "numeric" })}</div>
        </div>
        ${a.important ? '<span class="badge badge-brand" style="margin-left:auto; flex-shrink:0;">Important</span>' : ""}
      </div>

      <h3>${Util.escape(a.title)}</h3>
      ${a.body
        .split("\\n\\n")
        .map((p) => `<p style="margin-bottom:8px;">${Util.escape(p)}</p>`)
        .join("")}

      <div class="announcement-foot">
        <span><i class="fa-solid fa-users"></i> ${Util.escape(audienceText)}</span>
        ${
          a.source
            ? '<span style="margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--brand-primary);"><i class="fa-solid fa-quote-left"></i> Source: ' +
              Util.escape(a.source) +
              "</span>"
            : ""
        }
      </div>
    `;

          wrap.appendChild(el);
        });
      });
    </script>
  </body>
</html>
