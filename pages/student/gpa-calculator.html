<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Calculator — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">GPA Calculator</h1>
              <p class="page-subtitle">
                Calculate your semester GPA from course units and grades.
              </p>
            </div>
          </div>

          <div
            class="grid"
            style="
              grid-template-columns: minmax(0, 1fr) 340px;
              gap: 24px;
              align-items: start;
            "
          >
            <div class="card">
              <div class="card-head">
                <h3>Courses</h3>
                <button class="btn btn-secondary btn-sm" id="gpa-add">
                  <i class="fa-solid fa-plus"></i> Add course
                </button>
              </div>
              <div class="card-body">
                <form id="gpa-form" novalidate>
                  <div id="gpa-rows"></div>
                </form>
              </div>
            </div>

            <aside>
              <div class="gpa-result" id="gpa-result">
                <div>
                  <div class="label">Your GPA</div>
                  <div class="value">0.00</div>
                </div>
                <div class="class">—</div>
              </div>
              <div class="card card-pad" style="margin-top: 16px">
                <h4 style="font-size: var(--fs-sm); margin-bottom: 8px">
                  Grade scale
                </h4>
                <ul
                  style="
                    font-size: var(--fs-xs);
                    color: var(--text-secondary);
                    display: grid;
                    gap: 6px;
                  "
                >
                  <li>A — 5 points · 70–100</li>
                  <li>B — 4 points · 60–69</li>
                  <li>C — 3 points · 50–59</li>
                  <li>D — 2 points · 45–49</li>
                  <li>E — 1 point · 40–44</li>
                  <li>F — 0 points · 0–39</li>
                </ul>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/academics.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");
      });
    </script>
  </body>
</html>
