<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Groups — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Study Groups</h1>
              <p class="page-subtitle" id="sg-subtitle">
                Join a group, request to join one, or start your own.
              </p>
            </div>
            <button
              class="btn btn-primary"
              data-modal-open="create-group-modal"
              type="button"
            >
              <i class="fa-solid fa-plus"></i> Create group
            </button>
          </div>

          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="sg-search"
                placeholder="Search groups by name or course…"
                aria-label="Search study groups"
              />
            </div>
            <select
              class="select"
              id="sg-filter"
              aria-label="Filter by membership"
            >
              <option value="">All groups</option>
              <option value="mine">My groups</option>
              <option value="requested">Requested</option>
              <option value="creator">Created by me</option>
            </select>
          </div>

          <div class="cluster-between" style="margin-bottom: 16px">
            <p class="section-desc" style="margin: 0" id="sg-count">Loading…</p>
          </div>

          <div class="grid grid-3" id="groups-grid"></div>
        </main>
      </div>
    </div>

    <!-- Create group modal -->
    <div
      class="modal-backdrop"
      id="create-group-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cg-title"
    >
      <div class="modal">
        <div class="modal-head">
          <h3 id="cg-title">Create a study group</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="create-group-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label" for="cg-name"
                >Group name <span class="req">*</span></label
              >
              <input
                class="input"
                type="text"
                id="cg-name"
                name="name"
                placeholder="e.g. CSC 401 Study Circle"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a group name (at least 3 characters).</span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="cg-course"
                >Course <span class="req">*</span></label
              >
              <select class="select" id="cg-course" name="course">
                <option value="">Select a course</option>
              </select>
              <div class="field-help">
                You can create a group for any course.
              </div>
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please select a course.</span>
              </div>
            </div>

            <div class="field">
              <label class="label" for="cg-desc">Short description</label>
              <textarea
                class="textarea"
                id="cg-desc"
                name="description"
                placeholder="What is this group about? Where and when do you meet?"
              ></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Create group</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete group confirmation is handled via Confirmation.confirm() in JS -->

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/groups.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      /* ==========================================================================
         Study Groups — student page.
         Shows all non-deleted groups. Three-state join button.
         Creator-only request inbox and delete.
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var me = session.username;

        /* ------------------------------------------------------------------
           DOM refs
           ------------------------------------------------------------------ */
        var grid = document.getElementById("groups-grid");
        var searchEl = document.getElementById("sg-search");
        var filterEl = document.getElementById("sg-filter");
        var countEl = document.getElementById("sg-count");

        /* ------------------------------------------------------------------
           Course dropdown — allow ALL courses
           ------------------------------------------------------------------ */
        var courseSelect = document.getElementById("cg-course");
        if (courseSelect && typeof DEMO_COURSES !== "undefined") {
          DEMO_COURSES.slice()
            .sort(function (a, b) {
              return a.code.localeCompare(b.code);
            })
            .forEach(function (c) {
              var opt = document.createElement("option");
              opt.value = c.code;
              opt.textContent = c.code + " — " + c.title;
              courseSelect.appendChild(opt);
            });
        }

        /* ------------------------------------------------------------------
           Helpers
           ------------------------------------------------------------------ */
        function timeAgo(ts) {
          if (typeof Util !== "undefined" && Util.relativeTime) {
            return Util.relativeTime(ts);
          }
          return new Date(ts).toLocaleDateString();
        }

        function memberCountLabel(n) {
          return n + " member" + (n === 1 ? "" : "s");
        }

        /* ------------------------------------------------------------------
           Render a single group card
           ------------------------------------------------------------------ */
        function renderCard(g) {
          var card = document.createElement("div");
          card.className = "card card-pad";

          var state = Groups.membershipState(g, me);
          var isCreator = Groups.isCreator(g, me);
          var creatorName = Groups.displayName(g.createdBy);

          /* --- Top row: course badge + Group Admin badge (if creator) --- */
          var topRow =
            '<div class="cluster" style="margin-bottom:12px;">' +
            '<span class="qa-icon marine"><i class="fa-solid fa-users"></i></span>' +
            '<span class="badge badge-marine">' +
            Util.escape(g.course) +
            "</span>" +
            (isCreator
              ? '<span class="tag-group-admin"><i class="fa-solid fa-crown"></i> Group Admin</span>'
              : "") +
            "</div>";

          /* --- Title + creator line --- */
          var titleHtml =
            '<h3 style="font-size:var(--fs-md); margin-bottom:6px;">' +
            Util.escape(g.name) +
            "</h3>";

          var creatorHtml =
            '<div style="font-size:var(--fs-xs); color:var(--text-tertiary); margin-bottom:10px;">' +
            '<i class="fa-solid fa-user-pen"></i> Created by ' +
            '<strong style="color:var(--text-secondary);">' +
            Util.escape(creatorName) +
            "</strong>" +
            " · " +
            timeAgo(g.createdAt) +
            "</div>";

          /* --- Meta block --- */
          var metaHtml =
            '<div class="stack" style="font-size:var(--fs-xs); color:var(--text-tertiary); gap:6px; margin-bottom:16px;">' +
            '<div><i class="fa-solid fa-location-dot"></i> ' +
            Util.escape(g.location) +
            "</div>" +
            '<div><i class="fa-regular fa-clock"></i> ' +
            Util.escape(g.time) +
            "</div>" +
            '<div><i class="fa-solid fa-user-group"></i> ' +
            memberCountLabel((g.members || []).length) +
            "</div>" +
            "</div>";

          /* --- Action button --- */
          var actionHtml = "";
          if (isCreator) {
            actionHtml =
              '<div class="cluster" style="gap:8px;">' +
              '<a class="btn btn-primary btn-sm" style="flex:1;" href="group-chat.html?id=' +
              encodeURIComponent(g.id) +
              '">' +
              '<i class="fa-solid fa-comments"></i> View Group' +
              "</a>" +
              '<button class="btn btn-danger btn-sm" data-delete-group title="Delete group" type="button" aria-label="Delete group">' +
              '<i class="fa-solid fa-trash"></i>' +
              "</button>" +
              "</div>";
          } else if (state === "member") {
            actionHtml =
              '<a class="btn btn-primary btn-sm btn-block" href="group-chat.html?id=' +
              encodeURIComponent(g.id) +
              '">' +
              '<i class="fa-solid fa-comments"></i> View Group' +
              "</a>";
          } else if (state === "requested") {
            actionHtml =
              '<button class="btn btn-secondary btn-sm btn-block" data-cancel-request type="button">' +
              '<i class="fa-regular fa-clock"></i> Request Sent' +
              "</button>";
          } else {
            actionHtml =
              '<button class="btn btn-secondary btn-sm btn-block" data-request-join type="button">' +
              '<i class="fa-solid fa-arrow-right-to-bracket"></i> Join Group' +
              "</button>";
          }

          /* --- Creator's request inbox --- */
          var requestsHtml = "";
          if (isCreator && (g.joinRequests || []).length) {
            requestsHtml =
              '<div class="grp-requests">' +
              '<div class="grp-requests-title">' +
              g.joinRequests.length +
              " join request" +
              (g.joinRequests.length === 1 ? "" : "s") +
              "</div>" +
              g.joinRequests
                .map(function (username) {
                  var name = Groups.displayName(username);
                  var initials = (name || username)
                    .split(" ")
                    .filter(Boolean)
                    .slice(0, 2)
                    .map(function (p) {
                      return p[0].toUpperCase();
                    })
                    .join("");
                  return (
                    '<div class="grp-request-row" data-req-user="' +
                    Util.escape(username) +
                    '">' +
                    '<span class="avatar avatar-32 avatar-fallback">' +
                    Util.escape(initials) +
                    "</span>" +
                    '<div class="info">' +
                    '<div class="name">' +
                    Util.escape(name) +
                    "</div>" +
                    '<div class="handle">@' +
                    Util.escape(username) +
                    "</div>" +
                    "</div>" +
                    '<div class="actions">' +
                    '<button class="btn btn-primary btn-sm" data-accept type="button">' +
                    '<i class="fa-solid fa-check"></i> Accept' +
                    "</button>" +
                    '<button class="btn btn-ghost btn-sm" data-reject type="button" style="color:var(--danger);">' +
                    '<i class="fa-solid fa-xmark"></i>' +
                    "</button>" +
                    "</div>" +
                    "</div>"
                  );
                })
                .join("") +
              "</div>";
          }

          card.innerHTML =
            topRow +
            titleHtml +
            creatorHtml +
            metaHtml +
            actionHtml +
            requestsHtml;

          /* ---- Bind: Request Join ---- */
          var reqBtn = card.querySelector("[data-request-join]");
          if (reqBtn) {
            reqBtn.addEventListener("click", function () {
              Groups.requestJoin(g.id, me);
              render();
              Toast.success(
                "Request sent to the group creator.",
                "Request sent",
              );
            });
          }

          /* ---- Bind: Cancel Request ---- */
          var cancelBtn = card.querySelector("[data-cancel-request]");
          if (cancelBtn) {
            cancelBtn.addEventListener("click", function () {
              Groups.cancelRequest(g.id, me);
              render();
              Toast.info("Request cancelled.", "Cancelled");
            });
          }

          /* ---- Bind: Delete Group (creator only) ---- */
          var delBtn = card.querySelector("[data-delete-group]");
          if (delBtn) {
            delBtn.addEventListener("click", async function () {
              var ok = await Confirmation.confirm({
                title: "Delete this group?",
                message:
                  '"' +
                  g.name +
                  '" will be deleted permanently. All members will be removed, the chat will be closed, and this group will no longer appear anywhere in Campus Space. This action cannot be undone.',
                confirmLabel: "Delete group",
                variant: "danger",
              });
              if (!ok) return;
              Groups.softDelete(g.id, me);
              render();
              Toast.success("Group deleted.", "Deleted");
            });
          }

          /* ---- Bind: Accept / Reject requests ---- */
          card.querySelectorAll("[data-req-user]").forEach(function (row) {
            var username = row.getAttribute("data-req-user");
            var accept = row.querySelector("[data-accept]");
            var reject = row.querySelector("[data-reject]");
            if (accept) {
              accept.addEventListener("click", function () {
                Groups.acceptRequest(g.id, username);
                render();
                Toast.success(
                  Groups.displayName(username) +
                    " has been added to the group.",
                  "Accepted",
                );
              });
            }
            if (reject) {
              reject.addEventListener("click", function () {
                Groups.rejectRequest(g.id, username);
                render();
                Toast.info("Request rejected.", "Rejected");
              });
            }
          });

          return card;
        }

        /* ------------------------------------------------------------------
           Render all cards (with search + filter)
           ------------------------------------------------------------------ */
        function render() {
          var list = Groups.all(); // non-deleted only
          var q = (searchEl.value || "").trim().toLowerCase();
          var filter = filterEl.value;

          if (q) {
            list = list.filter(function (g) {
              return (
                g.name.toLowerCase().indexOf(q) !== -1 ||
                (g.course || "").toLowerCase().indexOf(q) !== -1
              );
            });
          }

          if (filter === "mine") {
            list = list.filter(function (g) {
              return Groups.isMember(g, me);
            });
          } else if (filter === "requested") {
            list = list.filter(function (g) {
              return Groups.hasRequested(g, me);
            });
          } else if (filter === "creator") {
            list = list.filter(function (g) {
              return Groups.isCreator(g, me);
            });
          }

          grid.innerHTML = "";

          if (!list.length) {
            grid.innerHTML =
              '<div class="card" style="grid-column: 1 / -1;">' +
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-users"></i></div>' +
              "<h3>No groups match</h3>" +
              "<p>Try a different search term or filter. Or create a new group.</p>" +
              '<button class="btn btn-primary" data-modal-open="create-group-modal" type="button">' +
              '<i class="fa-solid fa-plus"></i> Create a group' +
              "</button>" +
              "</div>" +
              "</div>";
          } else {
            list.forEach(function (g) {
              grid.appendChild(renderCard(g));
            });
          }

          countEl.textContent =
            list.length + " group" + (list.length === 1 ? "" : "s");

          /* Pending requests banner — shown to creators who have pending requests */
          renderPendingBanner();
        }

        function renderPendingBanner() {
          var mount = document.getElementById("sg-pending-banner-mount");
          if (!mount) return;
          var allMine = Groups.all().filter(function (g) {
            return Groups.isCreator(g, me) && (g.joinRequests || []).length > 0;
          });
          var total = allMine.reduce(function (sum, g) {
            return sum + (g.joinRequests || []).length;
          }, 0);
          if (!total) {
            mount.innerHTML = "";
            return;
          }
          mount.innerHTML =
            '<div class="sg-pending-banner">' +
            '<i class="fa-solid fa-bell"></i>' +
            "<span>You have " +
            total +
            " pending join request" +
            (total === 1 ? "" : "s") +
            ". Open the relevant group card below to accept or reject." +
            "</span>" +
            "</div>";
        }

        /* ------------------------------------------------------------------
           Search + filter events
           ------------------------------------------------------------------ */
        var debounce;
        searchEl.addEventListener("input", function () {
          clearTimeout(debounce);
          debounce = setTimeout(render, 120);
        });
        filterEl.addEventListener("change", render);

        /* ------------------------------------------------------------------
           Create group form
           ------------------------------------------------------------------ */
        var createForm = document.getElementById("create-group-form");
        if (createForm) {
          bindForm(
            createForm,
            {
              name: [Rules.required, Rules.minLen(3)],
              course: [Rules.required],
            },
            function (data) {
              /* Look up the selected course to derive dept + level for the
                 group's own metadata, so Admin can filter by dept later. */
              var courseCode = data.get("course");
              var course =
                typeof DEMO_COURSES !== "undefined"
                  ? DEMO_COURSES.find(function (c) {
                      return c.code === courseCode;
                    })
                  : null;

              Groups.create({
                name: data.get("name"),
                course: courseCode,
                description: data.get("description") || "",
                department: course ? course.department : "—",
                level: course ? course.level : "—",
                creator: session,
              });

              Modal.close("create-group-modal");
              createForm.reset();
              render();
              Toast.success("Study group created.", "Group created");
            },
          );
        }

        /* Initial render */
        render();
      });
    </script>
  </body>
</html>
