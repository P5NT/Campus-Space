<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Groups — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Study Groups</h1>
              <p class="page-subtitle">Study together, prepare better.</p>
            </div>
            <button
              class="btn btn-primary"
              data-modal-open="create-group-modal"
            >
              <i class="fa-solid fa-plus"></i> Create group
            </button>
          </div>
          <div class="grid grid-3" id="groups-grid"></div>
        </main>
      </div>
    </div>

    <!-- Create group modal -->
    <div
      class="modal-backdrop"
      id="create-group-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cg-title"
    >
      <div class="modal">
        <div class="modal-head">
          <h3 id="cg-title">Create a study group</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="create-group-form" novalidate>
          <div class="modal-body">
            <div class="field">
              <label class="label" for="cg-name"
                >Group name <span class="req">*</span></label
              >
              <input
                class="input"
                type="text"
                id="cg-name"
                name="name"
                placeholder="e.g. CSC 401 Study Circle"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a group name.</span>
              </div>
            </div>
            <div class="field">
              <label class="label" for="cg-course"
                >Course <span class="req">*</span></label
              >
              <input
                class="input"
                type="text"
                id="cg-course"
                name="course"
                placeholder="e.g. CSC 401"
              />
              <div class="field-error">
                <i class="fa-solid fa-circle-exclamation"></i
                ><span>Please enter a course.</span>
              </div>
            </div>
            <div class="field">
              <label class="label" for="cg-desc">Short description</label>
              <textarea
                class="textarea"
                id="cg-desc"
                name="description"
                placeholder="What is this group about? Where and when do you meet?"
              ></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Create group</button>
          </div>
        </form>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const groups = [
          {
            name: "CSC 401 Study Circle",
            course: "CSC 401",
            members: 6,
            location: "Library — Group Room B",
            time: "Tue & Thu · 6pm",
          },
          {
            name: "EEE 305 Tutorial Group",
            course: "EEE 305",
            members: 4,
            location: "Engineering Block C",
            time: "Mon · 5pm",
          },
          {
            name: "BCH 201 Revision Squad",
            course: "BCH 201",
            members: 8,
            location: "Science Library",
            time: "Sat · 10am",
          },
          {
            name: "ACC 401 Problem Solving",
            course: "ACC 401",
            members: 5,
            location: "Management Building",
            time: "Wed · 4pm",
          },
          {
            name: "CYB 301 Hands-on Group",
            course: "CYB 301",
            members: 3,
            location: "ICT Lab 2",
            time: "Fri · 3pm",
          },
          {
            name: "Compiler Construction Mentoring",
            course: "CSC 403",
            members: 7,
            location: "Faculty Auditorium",
            time: "Sun · 2pm",
          },
        ];

        const grid = document.getElementById("groups-grid");
        function render() {
          grid.innerHTML = "";
          groups.forEach((g) => {
            const card = document.createElement("div");
            card.className = "card card-pad";
            card.innerHTML = `
        <div class="cluster" style="margin-bottom:12px;">
          <span class="qa-icon marine"><i class="fa-solid fa-users"></i></span>
          <span class="badge badge-marine">${Util.escape(g.course)}</span>
        </div>
        <h3 style="font-size:var(--fs-md); margin-bottom:6px;">${Util.escape(g.name)}</h3>
        <div class="stack" style="font-size:var(--fs-xs); color:var(--text-tertiary); gap:6px; margin-bottom:16px;">
          <div><i class="fa-solid fa-location-dot"></i> ${Util.escape(g.location)}</div>
          <div><i class="fa-regular fa-clock"></i> ${Util.escape(g.time)}</div>
          <div><i class="fa-solid fa-user-group"></i> ${g.members} member${g.members === 1 ? "" : "s"}</div>
        </div>
        <button class="btn btn-secondary btn-sm btn-block" data-join>
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Join group
        </button>`;
            card.querySelector("[data-join]").addEventListener("click", (e) => {
              e.currentTarget.outerHTML =
                '<span class="badge badge-success" style="display:flex; justify-content:center;"><i class="fa-solid fa-circle-check"></i> Joined</span>';
              Toast.success(
                'You joined "' + g.name + '" (simulated).',
                "Joined",
              );
            });
            grid.appendChild(card);
          });
        }
        render();

        // Create group form
        const createForm = document.getElementById("create-group-form");
        bindForm(
          createForm,
          {
            name: [Rules.required],
            course: [Rules.required],
          },
          (data) => {
            groups.unshift({
              name: data.get("name"),
              course: data.get("course"),
              members: 1,
              location: "TBD",
              time: "To be scheduled",
            });
            render();
            Modal.close("create-group-modal");
            createForm.reset();
            Toast.success("Study group created (simulated).", "Group created");
          },
        );
      });
    </script>
  </body>
</html>
