<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leader Profile — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="student-leaders.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to Student Leaders
            </a>
          </div>

          <div id="leader-profile-root"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      /* ==========================================================================
         Leader profile page — three states:
           1. Active leader        → full profile
           2. Deactivated leader   → profile with an "Inactive" banner
           3. Not a leader / no id → "Leader not found" empty state
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        if (window._leaderProfileInit) return;
        window._leaderProfileInit = true;

        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var root = document.getElementById("leader-profile-root");
        var leaderId = new URLSearchParams(location.search).get("id");

        /* Resolve the leader — includeInactive so we can distinguish
           "deactivated leader" from "no such leader". */
        var leader =
          typeof getLeaderById === "function" && leaderId
            ? getLeaderById(leaderId, { includeInactive: true })
            : null;

        /* ---------- No leader found ---------- */
        if (!leader) {
          root.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-user-tie"></i></div>' +
            "<h3>Leader not found</h3>" +
            "<p>This leader profile may have been removed, or the link is incorrect.</p>" +
            '<a class="btn btn-secondary" href="student-leaders.html">' +
            '<i class="fa-solid fa-arrow-left"></i> Browse all leaders' +
            "</a>" +
            "</div>";
          return;
        }

        var isInactive = leader.active === false;
        var student = leader.student;
        var assoc = leader.assoc;
        var pos = leader.pos;

        var fullName = [student.firstName, student.otherName, student.lastName]
          .filter(Boolean)
          .join(" ");
        var initials = Util.initials(fullName);
        var avatarUrl = student.avatar || "";

        var avatarInner = avatarUrl
          ? '<img src="' + avatarUrl + '" alt="" class="avatar avatar-96">'
          : '<span class="avatar avatar-96 avatar-fallback">' +
            initials +
            "</span>";

        var rootClass = isInactive ? "is-inactive-leader" : "";

        root.innerHTML =
          (isInactive
            ? '<div class="leader-inactive-banner" role="alert">' +
              '<i class="fa-solid fa-circle-pause"></i>' +
              "<div>" +
              "<strong>This leader is no longer active</strong>" +
              "<p>" +
              Util.escape(student.firstName) +
              " is not currently holding a leadership position. Contact details below are for reference only." +
              "</p>" +
              "</div>" +
              "</div>"
            : "") +
          '<div class="profile-hero-v2 ' +
          rootClass +
          '">' +
          '<div class="profile-cover-v2">' +
          '<div class="profile-cover-grain" aria-hidden="true"></div>' +
          '<div class="profile-cover-overlay" aria-hidden="true"></div>' +
          "</div>" +
          '<div class="profile-hero-body-v2">' +
          '<div class="profile-avatar-v2">' +
          '<div class="profile-avatar-slot">' +
          avatarInner +
          "</div>" +
          "</div>" +
          '<div class="profile-hero-info">' +
          '<div class="profile-hero-name-row">' +
          "<h1>" +
          Util.escape(fullName) +
          "</h1>" +
          (!isInactive
            ? '<i class="fa-solid fa-circle-check tag-verified" aria-label="Verified leader"></i>'
            : '<span class="badge badge-neutral" style="font-size:11px;"><i class="fa-solid fa-circle-pause"></i> Inactive</span>') +
          "</div>" +
          '<div class="profile-hero-handle">@' +
          Util.escape(student.username) +
          "</div>" +
          '<div class="profile-hero-tags">' +
          '<span class="badge ' +
          (isInactive ? "badge-neutral" : "badge-brand") +
          '">' +
          '<i class="fa-solid fa-ranking-star"></i> ' +
          Util.escape(assoc.acronym) +
          "</span>" +
          '<span class="badge ' +
          (isInactive ? "badge-neutral" : "badge-marine") +
          '">' +
          '<i class="fa-solid fa-user-tie"></i> ' +
          Util.escape(pos.name) +
          "</span>" +
          '<span class="badge badge-neutral"><i class="fa-solid fa-building-columns"></i> ' +
          Util.escape(student.department) +
          "</span>" +
          '<span class="badge badge-neutral"><i class="fa-solid fa-graduation-cap"></i> ' +
          Util.escape(student.level) +
          " Level</span>" +
          "</div>" +
          '<p class="profile-hero-bio">' +
          Util.escape(pos.name) +
          " of the " +
          Util.escape(assoc.name) +
          " · " +
          Util.escape(student.faculty) +
          "</p>" +
          "</div>" +
          '<div class="profile-hero-actions">' +
          '<a href="tel:' +
          student.phone.replace(/\s+/g, "") +
          '" class="btn btn-primary">' +
          '<i class="fa-solid fa-phone"></i> Call' +
          "</a>" +
          '<button class="btn btn-secondary" id="copy-contact-btn" type="button">' +
          '<i class="fa-solid fa-copy"></i> Copy contact' +
          "</button>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="profile-v2-grid">' +
          '<div class="profile-v2-main">' +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-ranking-star" style="color:' +
          (isInactive ? "var(--text-tertiary)" : "var(--brand-primary)") +
          '; margin-right:8px;"></i> Leadership Role</h3>' +
          "</div>" +
          '<div class="profile-v2-info-grid">' +
          '<div class="profile-v2-info">' +
          '<span class="label">Association</span>' +
          '<span class="value">' +
          Util.escape(assoc.name) +
          "</span>" +
          "</div>" +
          '<div class="profile-v2-info">' +
          '<span class="label">Public tag</span>' +
          '<span class="value">' +
          Util.escape(assoc.acronym) +
          "</span>" +
          "</div>" +
          '<div class="profile-v2-info profile-v2-info-wide">' +
          '<span class="label">Position</span>' +
          '<span class="value">' +
          Util.escape(pos.name) +
          "</span>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-graduation-cap" style="color:var(--brand-primary); margin-right:8px;"></i> Academic Information</h3>' +
          "</div>" +
          '<div class="profile-v2-info-grid">' +
          '<div class="profile-v2-info">' +
          '<span class="label">Faculty</span>' +
          '<span class="value">' +
          Util.escape(student.faculty) +
          "</span>" +
          "</div>" +
          '<div class="profile-v2-info">' +
          '<span class="label">Department</span>' +
          '<span class="value">' +
          Util.escape(student.department) +
          "</span>" +
          "</div>" +
          '<div class="profile-v2-info">' +
          '<span class="label">Level</span>' +
          '<span class="value">' +
          Util.escape(student.level) +
          " Level</span>" +
          "</div>" +
          '<div class="profile-v2-info">' +
          '<span class="label">Member since</span>' +
          '<span class="value">' +
          Util.formatDate(student.joined, { month: "long", year: "numeric" }) +
          "</span>" +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<aside class="profile-v2-side">' +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid fa-address-book" style="color:var(--brand-secondary); margin-right:8px;"></i> Contact</h3>' +
          "</div>" +
          '<div class="profile-v2-side-list">' +
          '<div class="profile-v2-side-row">' +
          '<span class="label">Phone</span>' +
          '<a class="value" href="tel:' +
          student.phone.replace(/\s+/g, "") +
          '" style="color:var(--brand-primary); text-decoration:none; font-weight:600;">' +
          Util.escape(student.phone) +
          "</a>" +
          "</div>" +
          '<div class="profile-v2-side-row">' +
          '<span class="label">Email</span>' +
          '<a class="value" href="mailto:' +
          student.email +
          '" style="color:var(--brand-primary); text-decoration:none; font-weight:600; word-break:break-all;">' +
          Util.escape(student.email) +
          "</a>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="card profile-v2-card">' +
          '<div class="card-head">' +
          '<h3><i class="fa-solid ' +
          (isInactive ? "fa-circle-pause" : "fa-shield-halved") +
          '" style="color:' +
          (isInactive ? "var(--text-tertiary)" : "var(--brand-primary)") +
          '; margin-right:8px;"></i> Verification</h3>' +
          "</div>" +
          '<div class="profile-v2-side-list">' +
          '<div class="profile-v2-side-row">' +
          '<span class="label">Status</span>' +
          (isInactive
            ? '<span class="badge badge-neutral"><i class="fa-solid fa-circle-pause"></i> Inactive</span>'
            : '<span class="badge badge-success"><i class="fa-solid fa-circle-check"></i> Verified</span>') +
          "</div>" +
          '<div class="profile-v2-side-row">' +
          '<span class="label">Assigned by</span>' +
          '<span class="value">Admin</span>' +
          "</div>" +
          "</div>" +
          "</div>" +
          "</aside>" +
          "</div>";

        /* ---------- Copy contact button ---------- */
        var copyBtn = document.getElementById("copy-contact-btn");
        if (copyBtn) {
          copyBtn.addEventListener("click", function () {
            var text =
              fullName +
              " — " +
              pos.name +
              ", " +
              assoc.name +
              "\nPhone: " +
              student.phone +
              "\nEmail: " +
              student.email;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText(text)
                .then(function () {
                  if (typeof Toast !== "undefined")
                    Toast.success("Contact details copied.", "Copied");
                })
                .catch(function () {
                  if (typeof Toast !== "undefined")
                    Toast.info(
                      "Copy failed. You can still tap Call or Email.",
                      "Copied",
                    );
                });
            } else {
              if (typeof Toast !== "undefined")
                Toast.success("Contact details copied.", "Copied");
            }
          });
        }
      });
    </script>
  </body>
</html>
