<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Catalog — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Course Catalog</h1>
              <p class="page-subtitle" id="catalog-subtitle">
                Courses you're offering this session.
              </p>
            </div>
            <button class="btn btn-secondary" id="dl-catalog" type="button">
              <i class="fa-solid fa-download"></i> Download PDF
            </button>
          </div>

          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="course-search"
                placeholder="Search by course code or title…"
                aria-label="Search courses"
              />
            </div>
            <select
              class="select"
              id="filter-semester"
              aria-label="Filter by semester"
            >
              <option value="">All semesters</option>
              <option value="First">First Semester</option>
              <option value="Second">Second Semester</option>
            </select>
          </div>

          <div class="card">
            <div class="card-head">
              <h3 id="result-count">Loading…</h3>
            </div>
            <div id="course-list"></div>
          </div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/pdf-generator.js"></script>
    <script>
      /* ==========================================================================
   Course Catalog — shows and prints ONLY courses for the student's
   own department and level. Filters narrow further within that set.
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var student = DEMO_STUDENTS.find(function (s) {
          return s.username === session.username;
        });
        var listEl = document.getElementById("course-list");
        var countEl = document.getElementById("result-count");
        var searchEl = document.getElementById("course-search");
        var semesterEl = document.getElementById("filter-semester");

        if (!student) {
          listEl.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div>' +
            "<h3>Account not found</h3>" +
            "<p>We couldn't find your student record.</p>" +
            "</div>";
          countEl.textContent = "";
          return;
        }

        /* Update subtitle with the student's own department and level */
        var subtitleEl = document.getElementById("catalog-subtitle");
        if (subtitleEl) {
          subtitleEl.textContent =
            "Courses for " +
            student.department +
            " · " +
            student.level +
            " Level";
        }

        /* Scope: department + level only */
        var scoped = DEMO_COURSES.filter(function (c) {
          return (
            c.department === student.department && c.level === student.level
          );
        });

        /* ------------------------------------------------------------------
     Render helper
     ------------------------------------------------------------------ */
        function render(list) {
          listEl.innerHTML = "";

          if (!list.length) {
            listEl.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-book"></i></div>' +
              "<h3>No courses available yet</h3>" +
              "<p>" +
              (scoped.length
                ? "No courses match your search or filter."
                : "Admin hasn't published courses for your department at this level yet.") +
              "</p>" +
              "</div>";
            countEl.textContent = "No courses";
            return;
          }

          list.forEach(function (c) {
            var el = document.createElement("a");
            el.className = "course-item";
            el.href = "course-details.html?id=" + encodeURIComponent(c.id);
            el.innerHTML =
              '<span class="course-code">' +
              Util.escape(c.code) +
              "</span>" +
              '<div class="course-info">' +
              '<div class="course-title">' +
              Util.escape(c.title) +
              "</div>" +
              '<div class="course-meta">' +
              Util.escape(c.lecturer) +
              " · " +
              c.units +
              " units · " +
              Util.escape(c.semester) +
              " Semester" +
              "</div>" +
              "</div>" +
              '<i class="fa-solid fa-chevron-right" style="color:var(--text-tertiary); font-size:12px;"></i>';
            listEl.appendChild(el);
          });

          countEl.textContent =
            list.length + " course" + (list.length === 1 ? "" : "s");
        }

        /* ------------------------------------------------------------------
     Apply filters
     ------------------------------------------------------------------ */
        function apply() {
          var q = searchEl.value.trim().toLowerCase();
          var semester = semesterEl.value;
          var list = scoped.slice();

          if (semester) {
            list = list.filter(function (c) {
              return c.semester === semester;
            });
          }

          if (q) {
            list = list.filter(function (c) {
              return (
                c.code.toLowerCase().indexOf(q) !== -1 ||
                c.title.toLowerCase().indexOf(q) !== -1 ||
                c.lecturer.toLowerCase().indexOf(q) !== -1
              );
            });
          }

          render(list);
        }

        searchEl.addEventListener("input", apply);
        semesterEl.addEventListener("change", apply);
        apply();

        /* ------------------------------------------------------------------
     Download the full catalog as a PDF
     ------------------------------------------------------------------ */
        var dlBtn = document.getElementById("dl-catalog");
        if (dlBtn) {
          dlBtn.addEventListener("click", function () {
            if (!scoped.length) {
              Toast.warning("No courses to print.", "Nothing to download");
              return;
            }

            /* Build the files-layout data: one row per course */
            var data = scoped.map(function (c) {
              return {
                name: c.code + " — " + c.title,
                course: c.lecturer,
                category: c.units + " unit" + (c.units === 1 ? "" : "s"),
                size: c.semester + " Semester",
              };
            });

            PdfGenerator.open({
              type: "files",
              title: "Course Catalog",
              subtitle:
                student.department +
                " — " +
                student.level +
                " Level · First Semester 2026/2027",
              data: data,
            });
          });
        }
      });
    </script>
  </body>
</html>
