<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Details — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="course-catalog.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to catalog
            </a>
          </div>
          <div id="course-detail"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const id = new URLSearchParams(location.search).get("id");
        const course = DEMO_COURSES.find((c) => c.id === id) || DEMO_COURSES[0];
        const wrap = document.getElementById("course-detail");

        wrap.innerHTML = `
    <div class="card" style="margin-bottom:24px;">
      <div class="card-pad-lg">
        <div class="cluster" style="margin-bottom:16px;">
          <span class="course-code" style="font-size:var(--fs-sm); padding:8px 14px;">${Util.escape(course.code)}</span>
          <span class="badge badge-marine">${Util.escape(course.semester)} Semester</span>
          <span class="badge badge-neutral">${course.units} Units</span>
        </div>
        <h1 class="page-title" style="font-size:var(--fs-2xl);">${Util.escape(course.title)}</h1>
        <p style="font-size:var(--fs-md); color:var(--text-secondary); margin-top:8px; max-width:680px;">${Util.escape(course.description)}</p>
        <div class="grid grid-3" style="margin-top:24px; gap:16px;">
          <div>
            <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Lecturer</div>
            <div class="font-semibold">${Util.escape(course.lecturer)}</div>
          </div>
          <div>
            <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Department</div>
            <div class="font-semibold">${Util.escape(course.department)}</div>
          </div>
          <div>
            <div class="text-xs text-muted font-semibold" style="text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Course Rep</div>
            <div class="font-semibold">${Util.escape(course.rep)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-head">
      <div class="page-head-text">
        <h2 class="section-title">Course Materials</h2>
        <p class="section-desc">Notes, past questions and resources for this course.</p>
      </div>
    </div>

    <div class="card" id="course-materials"></div>
  `;

        const matWrap = document.getElementById("course-materials");
        const iconMap = {
          pdf: "fa-file-pdf",
          doc: "fa-file-word",
          xls: "fa-file-excel",
        };
        course.materials.forEach((m) => {
          const el = document.createElement("div");
          el.className = "resource-row";
          el.innerHTML = `
      <div class="resource-icon ${m.type}"><i class="fa-solid ${iconMap[m.type] || "fa-file"}"></i></div>
      <div class="resource-info">
        <div class="resource-name">${Util.escape(m.name)}</div>
        <div class="resource-meta">
          <span><i class="fa-regular fa-clock"></i> ${Util.relativeTime(m.uploaded)}</span>
          <span>${Util.escape(m.size)}</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" data-dl>
        <i class="fa-solid fa-download"></i> Download
      </button>`;
          el.querySelector("[data-dl]").addEventListener("click", () => {
            Toast.success(
              'Downloading "' + m.name + '" (simulated).',
              "Download started",
            );
          });
          matWrap.appendChild(el);
        });
      });
    </script>
  </body>
</html>
