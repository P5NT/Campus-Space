<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="complaints.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to complaints
            </a>
          </div>

          <div id="complaint-detail"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/complaints.js"></script>
    <script>
      /* ==========================================================================
         Complaint details — handles both private and public complaints.
         Private: only the filer + admins can view.
         Public: everyone can view, but the filer shows as @username.
         Admin responses render with their office byline (tag if present).
         ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        /* ---- Verification gate ---- */
        if (Auth.requireVerifiedStudent && !Auth.requireVerifiedStudent())
          return;

        var wrap = document.getElementById("complaint-detail");
        var id = new URLSearchParams(location.search).get("id");

        /* Find the complaint among ALL records, then verify visibility */
        var all = Complaints.all();
        var c = id
          ? all.find(function (x) {
              return x.id === id;
            })
          : null;

        /* ---- Not found ---- */
        if (!c) {
          wrap.innerHTML =
            '<div class="empty-state" style="padding: 64px 24px; max-width: 480px; margin: 0 auto;">' +
            '<div class="empty-icon"><i class="fa-solid fa-file-shield"></i></div>' +
            "<h3>Complaint not found</h3>" +
            "<p>This complaint may have been removed or the link is incorrect.</p>" +
            '<a class="btn btn-secondary" href="complaints.html">' +
            '<i class="fa-solid fa-arrow-left"></i> Back to complaints' +
            "</a>" +
            "</div>";
          return;
        }

        var isAdmin =
          session.role === "admin" || session.role === "super_admin";
        var isOwn = c.submittedBy === session.username;
        var isPublic = c.visibility === "public";

        /* ---- Visibility check ---- */
        if (!isAdmin && !isPublic && !isOwn) {
          wrap.innerHTML =
            '<div class="empty-state" style="padding: 64px 24px; max-width: 480px; margin: 0 auto;">' +
            '<div class="empty-icon" style="background: var(--warning-soft); color: var(--warning);">' +
            '<i class="fa-solid fa-lock"></i>' +
            "</div>" +
            "<h3>This complaint is private</h3>" +
            "<p>Only the student who filed it and Admins can view this complaint.</p>" +
            '<a class="btn btn-secondary" href="complaints.html">' +
            '<i class="fa-solid fa-arrow-left"></i> Back to complaints' +
            "</a>" +
            "</div>";
          return;
        }

        /* ---- Category icon ---- */
        var ICONS = {
          Facilities: "fa-building",
          Academic: "fa-graduation-cap",
          Welfare: "fa-heart",
          Hostel: "fa-house",
          Security: "fa-shield-halved",
          Finance: "fa-coins",
          Other: "fa-circle-info",
        };

        /* ---- Visibility badge ---- */
        var visibilityBadge = isPublic
          ? '<span class="badge badge-marine"><i class="fa-solid fa-globe"></i> Public</span>'
          : '<span class="badge badge-neutral"><i class="fa-solid fa-lock"></i> Private</span>';

        /* ---- Author label ---- */
        var authorLabel = "";
        if (isPublic) {
          authorLabel = isOwn ? "You" : "@" + Util.escape(c.submittedBy);
        } else {
          authorLabel = isAdmin
            ? Util.escape(c.submittedByName || c.submittedBy || "Unknown") +
              " · @" +
              Util.escape(c.submittedBy || "")
            : "You";
        }

        /* ---- Build response thread ---- */
        var threadHtml = "";
        if (!c.responses || !c.responses.length) {
          threadHtml =
            '<div class="cm-thread-empty">' +
            '<i class="fa-regular fa-comments"></i>' +
            "<p>No responses yet. Admin will respond to this complaint.</p>" +
            "</div>";
        } else {
          c.responses.forEach(function (r) {
            var rtagHtml =
              r.tag === "ADMIN"
                ? '<span class="tag-admin"><i class="fa-solid fa-shield-halved"></i> Admin</span>'
                : r.tag
                  ? '<span class="tag-leader">' + Util.escape(r.tag) + "</span>"
                  : "";

            threadHtml +=
              '<div class="thread-msg from-admin">' +
              '<span class="avatar avatar-32 avatar-fallback" style="background: var(--brand-primary);">' +
              Util.initials(r.name || "Admin") +
              "</span>" +
              '<div class="thread-msg-bubble">' +
              '<div class="cm-response-head">' +
              '<strong class="cm-response-name">' +
              Util.escape(r.name || "Space Admin") +
              "</strong>" +
              rtagHtml +
              '<span class="cm-response-time">' +
              Util.relativeTime(r.at) +
              "</span>" +
              "</div>" +
              '<div class="cm-response-text">' +
              Util.escape(r.text) +
              "</div>" +
              "</div>" +
              "</div>";
          });
        }

        /* ---- Timeline ---- */
        var timelineHtml = (c.history || [])
          .map(function (h) {
            return (
              '<div class="timeline-item">' +
              '<div class="timeline-date">' +
              Util.relativeTime(h.at) +
              "</div>" +
              '<div class="timeline-title">' +
              Util.escape(h.action) +
              "</div>" +
              '<div class="timeline-desc">' +
              Util.escape(h.actor) +
              "</div>" +
              "</div>"
            );
          })
          .join("");

        /* ---- Build public notice text ---- */
        var publicNoticeHtml = "";
        if (isPublic) {
          var headline = isOwn
            ? "You shared this publicly"
            : "This is a public complaint";
          var body = isOwn
            ? "The whole campus can see this complaint and its responses. Your username (@" +
              Util.escape(c.submittedBy) +
              ") is shown, not your full name."
            : "Anyone on Campus Space can see this and its responses. The filer\u2019s username (@" +
              Util.escape(c.submittedBy) +
              ") is shown, not their full name.";
          publicNoticeHtml =
            '<div class="cm-public-notice">' +
            '<i class="fa-solid fa-globe"></i>' +
            "<div>" +
            "<strong>" +
            headline +
            "</strong>" +
            "<p>" +
            body +
            "</p>" +
            "</div>" +
            "</div>";
        }

        /* ---- Render the page ---- */
        wrap.innerHTML =
          /* Header card */
          '<div class="card card-pad-lg" style="margin-bottom: 20px;">' +
          '<div class="cluster-between" style="margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">' +
          '<div class="cluster" style="gap: 8px; flex-wrap: wrap;">' +
          '<span class="badge badge-neutral"><i class="fa-solid ' +
          (ICONS[c.category] || ICONS.Other) +
          '"></i> ' +
          Util.escape(c.category) +
          "</span>" +
          '<span class="badge badge-neutral"><i class="fa-solid fa-hashtag"></i> ' +
          Util.escape(c.id) +
          "</span>" +
          visibilityBadge +
          "</div>" +
          complaintStatusPill(c.status) +
          "</div>" +
          '<h1 class="page-title" style="font-size: var(--fs-xl); margin-bottom: 14px;">' +
          Util.escape(c.subject) +
          "</h1>" +
          '<div class="cm-meta-list">' +
          '<div class="cm-meta-item">' +
          '<i class="fa-solid fa-user"></i>' +
          "<span>" +
          authorLabel +
          "</span>" +
          "</div>" +
          '<div class="cm-meta-item">' +
          '<i class="fa-regular fa-calendar"></i>' +
          "<span>Submitted " +
          Util.formatDate(c.date, {
            day: "numeric",
            month: "long",
            year: "numeric",
          }) +
          "</span>" +
          "</div>" +
          (c.updated && c.updated !== c.date
            ? '<div class="cm-meta-item">' +
              '<i class="fa-solid fa-rotate"></i>' +
              "<span>Updated " +
              Util.relativeTime(c.updated) +
              "</span>" +
              "</div>"
            : "") +
          "</div>" +
          publicNoticeHtml +
          '<div class="cm-description">' +
          '<div class="cm-description-label">Description</div>' +
          '<p class="cm-description-text">' +
          Util.escape(c.description) +
          "</p>" +
          "</div>" +
          "</div>" +
          /* Two-column: conversation + timeline */
          '<div class="grid" style="grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start;">' +
          '<div class="card">' +
          '<div class="card-head"><h3>Conversation</h3></div>' +
          '<div class="card-body">' +
          '<div class="complaint-thread">' +
          threadHtml +
          "</div>" +
          "</div>" +
          "</div>" +
          '<aside class="card card-pad">' +
          '<h3 style="font-size: var(--fs-md); margin-bottom: 14px;">Status timeline</h3>' +
          '<div class="timeline">' +
          timelineHtml +
          "</div>" +
          "</aside>" +
          "</div>";
      });
    </script>
  </body>
</html>
