<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="cluster" style="margin-bottom: 16px">
            <a href="complaints.html" class="btn btn-ghost btn-sm">
              <i class="fa-solid fa-arrow-left"></i> Back to complaints
            </a>
          </div>

          <div id="complaint-detail"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/complaints.js"></script>
    <script>
      /* ==========================================================================
   Complaint details — hero + status timeline.
   No conversation panel: complaints are one-way reports from the student.
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var id = new URLSearchParams(location.search).get("id");
        var wrap = document.getElementById("complaint-detail");
        var c = Complaints.all().find(function (x) {
          return x.id === id;
        });

        /* ---- Not found ---- */
        if (!c) {
          wrap.innerHTML =
            '<div class="empty-state">' +
            '<div class="empty-icon"><i class="fa-solid fa-file-shield"></i></div>' +
            "<h3>Complaint not found</h3>" +
            "<p>This complaint may have been removed or the link is incorrect.</p>" +
            '<a class="btn btn-primary" href="complaints.html">Back to complaints</a>' +
            "</div>";
          return;
        }

        /* ---- Status → color/theme mapping ---- */
        var STATUS_TONE = {
          Submitted: { cls: "badge-info", icon: "fa-paper-plane" },
          "Under Review": { cls: "badge-warning", icon: "fa-magnifying-glass" },
          "In Progress": { cls: "badge-brand", icon: "fa-spinner" },
          Resolved: { cls: "badge-success", icon: "fa-circle-check" },
        };
        var tone = STATUS_TONE[c.status] || STATUS_TONE["Submitted"];

        /* ---- History rendering ---- */
        var historyHtml = (c.history || [])
          .map(function (h) {
            return (
              '<div class="timeline-item">' +
              '<div class="timeline-date">' +
              Util.relativeTime(h.at) +
              "</div>" +
              '<div class="timeline-title">' +
              Util.escape(h.action) +
              "</div>" +
              '<div class="timeline-desc">' +
              Util.escape(h.actor) +
              "</div>" +
              "</div>"
            );
          })
          .join("");

        /* ---- Meta line at top ---- */
        var submittedOn = Util.formatDate(c.date, {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        /* ---- Build the page ---- */
        wrap.innerHTML =
          '<div class="complaint-hero">' +
          '<div class="complaint-hero-top">' +
          '<span class="badge badge-neutral"><i class="fa-solid fa-hashtag"></i> ' +
          Util.escape(c.id) +
          "</span>" +
          '<span class="badge badge-neutral"><i class="fa-solid fa-tag"></i> ' +
          Util.escape(c.category) +
          "</span>" +
          '<span class="complaint-status ' +
          tone.cls +
          '">' +
          '<i class="fa-solid ' +
          tone.icon +
          '"></i> ' +
          Util.escape(c.status) +
          "</span>" +
          "</div>" +
          '<h1 class="complaint-title">' +
          Util.escape(c.subject) +
          "</h1>" +
          '<div class="complaint-meta">' +
          '<span><i class="fa-regular fa-calendar"></i> Submitted ' +
          submittedOn +
          "</span>" +
          '<span><i class="fa-regular fa-clock"></i> Updated ' +
          Util.relativeTime(c.updated) +
          "</span>" +
          "</div>" +
          '<div class="complaint-description">' +
          '<div class="complaint-description-label">Description</div>' +
          "<p>" +
          Util.escape(c.description) +
          "</p>" +
          "</div>" +
          "</div>" +
          '<div class="complaint-grid">' +
          '<aside class="complaint-grid-side">' +
          '<div class="card card-pad">' +
          '<h3 class="complaint-side-title"><i class="fa-solid fa-list-check"></i> Status timeline</h3>' +
          '<div class="timeline">' +
          historyHtml +
          "</div>" +
          "</div>" +
          "</aside>" +
          "</div>";
      });
    </script>
  </body>
</html>
