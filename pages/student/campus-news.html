<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus News — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Campus News</h1>
              <p class="page-subtitle">
                Editorial coverage of what's happening at OAUSTECH.
              </p>
            </div>
          </div>

          <div class="toolbar">
            <div class="input-wrap">
              <i class="fa-solid fa-magnifying-glass input-icon"></i>
              <input
                class="input"
                type="search"
                id="news-search"
                placeholder="Search news…"
                aria-label="Search news"
              />
            </div>
          </div>

          <div
            class="filter-bar"
            id="news-categories"
            role="tablist"
            aria-label="News categories"
          ></div>

          <div class="grid grid-3" id="news-grid"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/news.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      /* ==========================================================================
   Campus News — editorial listing with category filter and search.
   Missing images are handled gracefully (media block is removed).
   ========================================================================== */
      document.addEventListener("DOMContentLoaded", function () {
        var session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        var grid = document.getElementById("news-grid");
        var searchEl = document.getElementById("news-search");
        var categoriesWrap = document.getElementById("news-categories");

        var filterCategory = "all";
        var searchQuery = "";

        /* ---- Build the category list from the actual data ---- */
        var categories = ["all"];
        DEMO_NEWS.forEach(function (n) {
          if (n.category && categories.indexOf(n.category) === -1) {
            categories.push(n.category);
          }
        });

        function buildCategoryChips() {
          categoriesWrap.innerHTML = "";
          categories.forEach(function (cat) {
            var btn = document.createElement("button");
            btn.className =
              "chip" + (cat === filterCategory ? " is-active" : "");
            btn.setAttribute("data-cat", cat);
            btn.setAttribute("role", "tab");
            btn.textContent = cat === "all" ? "All" : cat;
            btn.addEventListener("click", function () {
              filterCategory = cat;
              buildCategoryChips();
              render();
            });
            categoriesWrap.appendChild(btn);
          });
        }

        /* ---- Render the news grid ---- */
        function render() {
          grid.innerHTML = "";

          var list = DEMO_NEWS.slice();

          if (filterCategory !== "all") {
            list = list.filter(function (n) {
              return n.category === filterCategory;
            });
          }

          if (searchQuery) {
            var q = searchQuery.toLowerCase();
            list = list.filter(function (n) {
              return (
                n.title.toLowerCase().indexOf(q) !== -1 ||
                n.excerpt.toLowerCase().indexOf(q) !== -1 ||
                (n.author || "").toLowerCase().indexOf(q) !== -1
              );
            });
          }

          if (!list.length) {
            grid.innerHTML =
              '<div class="card" style="grid-column: 1 / -1;">' +
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-regular fa-newspaper"></i></div>' +
              "<h3>No matching articles</h3>" +
              "<p>" +
              (searchQuery
                ? 'No articles match "' +
                  Util.escape(searchQuery) +
                  '". Try a different search.'
                : "There are no published articles in this category yet.") +
              "</p>" +
              '<button class="btn btn-secondary" id="news-reset" type="button">' +
              '<i class="fa-solid fa-rotate-left"></i> Show all news' +
              "</button>" +
              "</div>" +
              "</div>";

            var resetBtn = document.getElementById("news-reset");
            if (resetBtn) {
              resetBtn.addEventListener("click", function () {
                filterCategory = "all";
                searchQuery = "";
                searchEl.value = "";
                buildCategoryChips();
                render();
              });
            }
            return;
          }

          list.forEach(function (n) {
            var card = document.createElement("a");
            card.href = "news-details.html?id=" + n.id;
            card.className = "news-card";

            /* Build the media block. If the image fails to load, the whole
         block is hidden so the card doesn't show a big empty space. */
            var mediaHtml =
              '<div class="news-card-media">' +
              '<img src="' +
              Util.escape(n.image) +
              '" alt="" onerror="this.parentElement.style.display=\'none\'">' +
              "</div>";

            card.innerHTML =
              mediaHtml +
              '<div class="news-card-body">' +
              '<span class="badge badge-brand">' +
              Util.escape(n.category) +
              "</span>" +
              "<h3>" +
              Util.escape(n.title) +
              "</h3>" +
              "<p>" +
              Util.escape(n.excerpt) +
              "</p>" +
              '<div class="news-card-meta">' +
              '<span><i class="fa-solid fa-user"></i> ' +
              Util.escape(n.author) +
              "</span>" +
              '<span><i class="fa-regular fa-clock"></i> ' +
              Util.relativeTime(n.date) +
              "</span>" +
              "</div>" +
              "</div>";

            grid.appendChild(card);
          });
        }

        searchEl.addEventListener("input", function () {
          searchQuery = searchEl.value.trim();
          render();
        });

        buildCategoryChips();
        render();
      });
    </script>
  </body>
</html>
