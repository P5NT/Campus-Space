<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Representatives — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Course Representatives</h1>
              <p class="page-subtitle">
                Contact the representatives for your courses.
              </p>
            </div>
          </div>
          <div class="grid grid-3" id="reps-grid"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const grid = document.getElementById("reps-grid");
        const reps = [];
        DEMO_COURSES.forEach((c) => {
          let r = reps.find((x) => x.name === c.rep);
          if (!r) {
            r = { name: c.rep, courses: [] };
            reps.push(r);
          }
          r.courses.push(c.code);
        });

        reps.forEach((r) => {
          const card = document.createElement("div");
          card.className = "card card-pad";
          card.innerHTML = `
      <div style="text-align:center;">
        <span class="avatar avatar-72 avatar-fallback" style="margin:0 auto 12px; display:inline-flex;">${Util.initials(r.name)}</span>
        <h3 style="font-size:var(--fs-md); margin-bottom:4px;">${Util.escape(r.name)}</h3>
        <p style="font-size:var(--fs-xs); color:var(--text-tertiary); margin-bottom:12px;">Course Representative</p>
        <div class="cluster" style="justify-content:center; margin-bottom:16px;">
          ${r.courses
            .slice(0, 3)
            .map(
              (c) =>
                `<span class="badge badge-marine">${Util.escape(c)}</span>`,
            )
            .join("")}
        </div>
        <button class="btn btn-secondary btn-sm btn-block" data-contact>
          <i class="fa-solid fa-phone"></i> Contact
        </button>
      </div>`;
          card.querySelector("[data-contact]").addEventListener("click", () => {
            Toast.info(
              "Opening contact options for " + r.name + " (simulated).",
              "Contact",
            );
          });
          grid.appendChild(card);
        });
      });
    </script>
  </body>
</html>
