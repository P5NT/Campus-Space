<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Timetable — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Exam Timetable</h1>
              <p class="page-subtitle">
                First semester 2026/2027 examination schedule.
              </p>
            </div>
            <button class="btn btn-secondary" id="dl-exam" type="button">
              <i class="fa-solid fa-download"></i> Download PDF
            </button>
          </div>

          <!-- Notice -->
          <div
            class="card"
            style="margin-bottom: 20px; border-left: 4px solid var(--danger)"
          >
            <div class="card-body">
              <div class="cluster" style="gap: 14px; align-items: flex-start">
                <i
                  class="fa-solid fa-circle-info"
                  style="color: var(--danger); font-size: 22px; margin-top: 2px"
                ></i>
                <div>
                  <div class="font-semibold" style="font-size: var(--fs-base)">
                    Examinations begin 20 April 2026
                  </div>
                  <p
                    style="
                      font-size: var(--fs-sm);
                      color: var(--text-secondary);
                      margin-top: 4px;
                    "
                  >
                    Please arrive 30 minutes before each exam. Bring your
                    student ID.
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Desktop table (>= 861px) -->
          <div class="exam-desktop">
            <div class="exam-table">
              <div class="exam-head">
                <div>Date</div>
                <div>Time</div>
                <div>Course</div>
                <div>Venue</div>
              </div>
              <div id="exam-body"></div>
            </div>
          </div>

          <!-- Mobile card list (<= 860px) -->
          <div class="exam-mobile" id="exam-mobile"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/pdf-generator.js"></script>
    <script>
      /* ==========================================================================
   Exam Timetable — displays and prints the student's own exam schedule.
   ========================================================================== */
      (function () {
        "use strict";
        if (window._examTTInit) return;
        window._examTTInit = true;

        var MONTHS_SHORT = [
          "JAN",
          "FEB",
          "MAR",
          "APR",
          "MAY",
          "JUN",
          "JUL",
          "AUG",
          "SEP",
          "OCT",
          "NOV",
          "DEC",
        ];

        function formatDay(dateStr) {
          return new Date(dateStr).toLocaleDateString("en-GB", {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        }

        function formatDayLong(dateStr) {
          var d = new Date(dateStr);
          return {
            day: d.getDate(),
            month: d
              .toLocaleDateString("en-GB", { month: "short" })
              .toUpperCase(),
            weekday: d.toLocaleDateString("en-GB", { weekday: "long" }),
          };
        }

        function daysUntil(dateStr) {
          var now = new Date();
          now.setHours(0, 0, 0, 0);
          var target = new Date(dateStr);
          target.setHours(0, 0, 0, 0);
          return Math.round((target - now) / (1000 * 60 * 60 * 24));
        }

        function boot() {
          var session = Auth.current();
          if (!session) {
            window.location.href = "../auth/login.html";
            return;
          }
          initAppShell("student");

          var student = DEMO_STUDENTS.find(function (s) {
            return s.username === session.username;
          });
          var timetable =
            typeof getStudentExamTimetable === "function"
              ? getStudentExamTimetable(student)
              : null;

          /* ---- Empty state ---- */
          if (!timetable || !timetable.exams || !timetable.exams.length) {
            document.querySelector(".exam-desktop").innerHTML =
              '<div class="card"><div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-calendar-xmark"></i></div>' +
              "<h3>No exam timetable available yet</h3>" +
              "<p>The examination timetable for your department and level has not been published.</p>" +
              "</div></div>";
            document.querySelector(".exam-mobile").innerHTML = "";
            document.getElementById("dl-exam").disabled = true;
            return;
          }

          var exams = timetable.exams;

          /* ---- Download as PDF ---- */
          document
            .getElementById("dl-exam")
            .addEventListener("click", function () {
              var data = exams.map(function (e) {
                var d = new Date(e.date);
                return {
                  day: String(d.getDate()).padStart(2, "0"),
                  month: MONTHS_SHORT[d.getMonth()],
                  course: e.course,
                  title: e.title,
                  time: e.time,
                  venue: e.venue,
                };
              });

              PdfGenerator.open({
                type: "exams",
                title: "Exam Timetable",
                subtitle:
                  student.department +
                  " — " +
                  student.level +
                  " Level · First Semester 2026/2027",
                data: data,
              });
            });

          /* ---- Desktop table rows ---- */
          var body = document.getElementById("exam-body");
          exams.forEach(function (e) {
            var row = document.createElement("div");
            row.className = "exam-row";

            var days = daysUntil(e.date);
            var dayBadge = "";
            if (days === 0) {
              dayBadge =
                '<span class="badge badge-brand" style="margin-left:6px;">Today</span>';
            } else if (days > 0 && days <= 7) {
              dayBadge =
                '<span class="badge badge-warning" style="margin-left:6px;">In ' +
                days +
                "d</span>";
            }

            row.innerHTML =
              '<div class="exam-date">' +
              '<span class="exam-date-main">' +
              formatDay(e.date) +
              "</span>" +
              dayBadge +
              "</div>" +
              '<div class="exam-time">' +
              '<i class="fa-regular fa-clock"></i> ' +
              Util.escape(e.time) +
              "</div>" +
              '<div class="exam-course">' +
              '<span class="exam-course-code">' +
              Util.escape(e.course) +
              "</span>" +
              '<span class="exam-course-title">' +
              Util.escape(e.title) +
              "</span>" +
              "</div>" +
              '<div class="exam-venue">' +
              '<i class="fa-solid fa-location-dot"></i> ' +
              Util.escape(e.venue) +
              "</div>";

            body.appendChild(row);
          });

          /* ---- Mobile cards ---- */
          var mobile = document.getElementById("exam-mobile");
          exams.forEach(function (e) {
            var d = formatDayLong(e.date);
            var days = daysUntil(e.date);

            var countdown = "";
            if (days === 0) {
              countdown = '<span class="badge badge-brand">Today</span>';
            } else if (days > 0) {
              countdown =
                '<span class="badge badge-neutral">' +
                days +
                " day" +
                (days === 1 ? "" : "s") +
                " to go</span>";
            } else {
              countdown = '<span class="badge badge-neutral">Past</span>';
            }

            var card = document.createElement("div");
            card.className = "exam-card";
            if (days >= 0 && days <= 3) card.classList.add("is-soon");

            card.innerHTML =
              '<div class="exam-card-head">' +
              '<div class="exam-card-date">' +
              '<div class="exam-card-day">' +
              d.day +
              "</div>" +
              '<div class="exam-card-month">' +
              d.month +
              "</div>" +
              "</div>" +
              '<div class="exam-card-meta">' +
              '<div class="exam-card-weekday">' +
              d.weekday +
              "</div>" +
              '<div class="exam-card-course">' +
              Util.escape(e.course) +
              " — " +
              Util.escape(e.title) +
              "</div>" +
              "</div>" +
              '<div class="exam-card-countdown">' +
              countdown +
              "</div>" +
              "</div>" +
              '<div class="exam-card-body">' +
              '<div class="exam-card-info">' +
              '<i class="fa-regular fa-clock"></i> ' +
              Util.escape(e.time) +
              "</div>" +
              '<div class="exam-card-info">' +
              '<i class="fa-solid fa-location-dot"></i> ' +
              Util.escape(e.venue) +
              "</div>" +
              "</div>";

            mobile.appendChild(card);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
