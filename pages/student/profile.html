<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div id="profile-root"></div>
        </main>
      </div>
    </div>

    <!-- Edit profile modal -->
    <div
      class="modal-backdrop"
      id="edit-profile-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ep-title"
    >
      <div class="modal modal-lg">
        <div class="modal-head">
          <h3 id="ep-title">Edit profile</h3>
          <button class="btn-icon" data-modal-close aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="edit-profile-form" novalidate>
          <div class="modal-body">
            <div class="grid grid-2" style="gap: 16px">
              <div class="field">
                <label class="label" for="ep-first"
                  >First name <span class="req">*</span></label
                >
                <input
                  class="input"
                  type="text"
                  id="ep-first"
                  name="firstName"
                />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please enter your first name.</span>
                </div>
              </div>
              <div class="field">
                <label class="label" for="ep-other"
                  >Other name <span class="label-hint">Optional</span></label
                >
                <input
                  class="input"
                  type="text"
                  id="ep-other"
                  name="otherName"
                />
              </div>
              <div class="field">
                <label class="label" for="ep-last"
                  >Last name <span class="req">*</span></label
                >
                <input class="input" type="text" id="ep-last" name="lastName" />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please enter your last name.</span>
                </div>
              </div>
              <div class="field">
                <label class="label" for="ep-phone"
                  >Phone <span class="req">*</span></label
                >
                <input class="input" type="tel" id="ep-phone" name="phone" />
                <div class="field-error">
                  <i class="fa-solid fa-circle-exclamation"></i
                  ><span>Please enter a valid phone number.</span>
                </div>
              </div>
            </div>
            <div class="field">
              <label class="label" for="ep-bio"
                >Short bio <span class="label-hint">Optional</span></label
              >
              <textarea
                class="textarea"
                id="ep-bio"
                name="bio"
                placeholder="A short line about you…"
                style="min-height: 80px"
              ></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-secondary" data-modal-close>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/associations.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script src="../../js/profile.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");
      });
    </script>
  </body>
</html>
