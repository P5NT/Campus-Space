<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Information — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Faculty Information</h1>
              <p class="page-subtitle">
                Faculties, departments and administrative contacts.
              </p>
            </div>
          </div>
          <div class="grid grid-3" id="faculties-grid"></div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");
        const grid = document.getElementById("faculties-grid");
        DEMO_FACULTIES.forEach((f) => {
          const card = document.createElement("div");
          card.className = "card card-pad";
          card.innerHTML = `
      <div class="cluster" style="margin-bottom:12px;">
        <span class="qa-icon"><i class="fa-solid fa-building-columns"></i></span>
        <span class="badge badge-marine">${Util.escape(f.shortName)}</span>
      </div>
      <h3 style="font-size:var(--fs-md); margin-bottom:6px;">${Util.escape(f.name)}</h3>
      <p style="font-size:var(--fs-sm); color:var(--text-secondary); margin-bottom:16px;">${f.departments.length} department${f.departments.length === 1 ? "" : "s"}</p>
      <button class="btn btn-secondary btn-sm btn-block" data-expand>
        <i class="fa-solid fa-list"></i> View departments
      </button>
      <div class="dept-list" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-subtle);">
        ${f.departments.map((d) => `<div style="font-size:var(--fs-sm); color:var(--text-secondary); padding:4px 0;">${Util.escape(d.name)}</div>`).join("")}
      </div>`;
          const list = card.querySelector(".dept-list");
          card.querySelector("[data-expand]").addEventListener("click", (e) => {
            const open = list.style.display === "block";
            list.style.display = open ? "none" : "block";
            e.currentTarget.innerHTML = open
              ? '<i class="fa-solid fa-list"></i> View departments'
              : '<i class="fa-solid fa-chevron-up"></i> Hide departments';
          });
          grid.appendChild(card);
        });
      });
    </script>
  </body>
</html>
