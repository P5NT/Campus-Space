<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Information — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">My Faculty</h1>
              <p class="page-subtitle">
                Details about the faculty your account is registered under.
              </p>
            </div>
          </div>

          <div id="faculty-root"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/faculties.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script>
      /* ==========================================================================
   Faculty Information — shows ONLY the student's own faculty.
   ========================================================================== */
      (function () {
        "use strict";
        if (window._facultyInfoInit) return;
        window._facultyInfoInit = true;

        function boot() {
          var session = Auth.current();
          if (!session) {
            window.location.href = "../auth/login.html";
            return;
          }
          initAppShell("student");

          var student = DEMO_STUDENTS.find(function (s) {
            return s.username === session.username;
          });
          var root = document.getElementById("faculty-root");

          if (!student) {
            root.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-user-slash"></i></div>' +
              "<h3>We couldn't find your account</h3>" +
              "<p>Please contact Admin.</p>" +
              "</div>";
            return;
          }

          var faculty = DEMO_FACULTIES.find(function (f) {
            return f.name === student.faculty;
          });

          if (!faculty) {
            root.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-building-columns"></i></div>' +
              "<h3>Faculty not found</h3>" +
              '<p>Your registered faculty "' +
              Util.escape(student.faculty) +
              '" is not currently listed.</p>' +
              "</div>";
            return;
          }

          var deptCount = faculty.departments.length;
          var activeDepts = faculty.departments.filter(function (d) {
            return d.active !== false;
          });

          var html = "";

          /* Hero card */
          html += '<div class="card card-pad-lg" style="margin-bottom:20px;">';
          html +=
            '<div class="cluster" style="align-items:flex-start; gap:20px;">';
          html +=
            '<div class="qa-icon" style="width:56px; height:56px; font-size:22px; flex-shrink:0;">';
          html += '<i class="fa-solid fa-building-columns"></i>';
          html += "</div>";
          html += '<div style="flex:1; min-width:0;">';
          html +=
            '<span class="badge badge-brand" style="margin-bottom:8px;">' +
            Util.escape(faculty.shortName) +
            "</span>";
          html +=
            '<h2 style="font-size:var(--fs-2xl); font-weight:800; letter-spacing:-0.02em; margin-bottom:6px;">' +
            Util.escape(faculty.name) +
            "</h2>";
          html +=
            '<p style="color:var(--text-secondary); font-size:var(--fs-base);">';
          html +=
            deptCount +
            " department" +
            (deptCount === 1 ? "" : "s") +
            " · " +
            activeDepts.length +
            " active";
          html += "</p>";
          html += "</div>";
          html += "</div>";
          html += "</div>";

          /* Departments list */
          html += '<div class="card">';
          html += '<div class="card-head">';
          html +=
            '<h3><i class="fa-solid fa-diagram-project" style="color:var(--brand-primary); margin-right:8px;"></i> Departments in this Faculty</h3>';
          html += "</div>";
          html += '<div class="faculty-dept-list">';

          activeDepts.forEach(function (d) {
            var isMyDept = d.name === student.department;
            html +=
              '<div class="faculty-dept-row' +
              (isMyDept ? " is-mine" : "") +
              '">';
            html += '<div class="cluster" style="gap:12px; min-width:0;">';
            html +=
              '<span class="faculty-dept-icon"><i class="fa-solid fa-diagram-project"></i></span>';
            html += '<div style="min-width:0;">';
            html +=
              '<div class="faculty-dept-name">' +
              Util.escape(d.name) +
              "</div>";
            if (isMyDept) {
              html +=
                '<div class="faculty-dept-note"><i class="fa-solid fa-circle-check"></i> Your department</div>';
            }
            html += "</div>";
            html += "</div>";
            if (isMyDept) {
              html += '<span class="badge badge-brand">Current</span>';
            }
            html += "</div>";
          });

          html += "</div>";
          html += "</div>";

          root.innerHTML = html;
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
