<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture Timetable — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Lecture Timetable</h1>
              <p class="page-subtitle">
                Your weekly lecture schedule — 2026/2027 first semester.
              </p>
            </div>
            <button class="btn btn-secondary" id="dl-lecture">
              <i class="fa-solid fa-download"></i> Download
            </button>
          </div>

          <div class="timetable-wrap">
            <table class="timetable">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                  <th>Friday</th>
                </tr>
              </thead>
              <tbody id="tt-body"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/leaders.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session) {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("student");

        const slots = [
          {
            time: "8 – 10 AM",
            mon: ["CSC 401", "Hall A", "Dr. Ogunlade"],
            tue: [],
            wed: ["CSC 403", "Hall B", "Prof. Adeleke"],
            thu: [],
            fri: [],
          },
          {
            time: "10 – 12",
            mon: [],
            tue: ["CYB 301", "ICT Lab 1", "Dr. Bakare"],
            wed: [],
            thu: ["CSC 405", "Hall A", "Dr. Salako"],
            fri: [],
          },
          {
            time: "12 – 2 PM",
            mon: [],
            tue: [],
            wed: ["CSC 401", "Hall A", "Dr. Ogunlade"],
            thu: [],
            fri: ["EEE 305", "Eng Hall", "Dr. Ajayi"],
          },
          {
            time: "2 – 4 PM",
            mon: ["CSC 407", "Lab 2", "Dr. Aliyu"],
            tue: [],
            wed: [],
            thu: ["CSC 403", "Hall B", "Prof. Adeleke"],
            fri: [],
          },
        ];

        const tb = document.getElementById("tt-body");
        function cell(c) {
          if (!c || !c.length) return "<td></td>";
          return `<td><div class="class-block"><strong>${Util.escape(c[0])}</strong><span>${Util.escape(c[1])} · ${Util.escape(c[2])}</span></div></td>`;
        }
        slots.forEach((s) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td style="font-weight:600; white-space:nowrap;">${Util.escape(s.time)}</td>${cell(s.mon)}${cell(s.tue)}${cell(s.wed)}${cell(s.thu)}${cell(s.fri)}`;
          tb.appendChild(tr);
        });

        document.getElementById("dl-lecture").addEventListener("click", () => {
          Toast.success(
            "Downloading lecture timetable PDF (simulated).",
            "Download started",
          );
        });
      });
    </script>
  </body>
</html>
