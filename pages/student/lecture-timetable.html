<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture Timetable — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session">
    <a href="#main" class="skip-link">Skip to main content</a>

    <div class="app-shell">
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Sidebar navigation"
      ></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Lecture Timetable</h1>
              <p class="page-subtitle">
                Your weekly lecture schedule — 2026/2027 first semester.
              </p>
            </div>
            <button class="btn btn-secondary" id="dl-lecture" type="button">
              <i class="fa-solid fa-download"></i> Download PDF
            </button>
          </div>

          <!-- Desktop grid (visible >= 861px) -->
          <div class="timetable-desktop">
            <div class="timetable">
              <div class="timetable-head">
                <div class="timetable-cell timetable-time">Time</div>
                <div class="timetable-cell">Monday</div>
                <div class="timetable-cell">Tuesday</div>
                <div class="timetable-cell">Wednesday</div>
                <div class="timetable-cell">Thursday</div>
                <div class="timetable-cell">Friday</div>
              </div>
              <div id="timetable-body"></div>
            </div>
          </div>

          <!-- Mobile stacked cards (visible <= 860px) -->
          <div class="timetable-mobile" id="timetable-mobile"></div>
        </main>
      </div>
    </div>

    <div id="mobile-nav-mount"></div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../data/courses.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/pdf-generator.js"></script>
    <script>
      /* ==========================================================================
   Lecture Timetable — displays and prints the student's own weekly schedule.
   ========================================================================== */
      (function () {
        "use strict";
        if (window._lectureTTInit) return;
        window._lectureTTInit = true;

        var DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

        function boot() {
          var session = Auth.current();
          if (!session) {
            window.location.href = "../auth/login.html";
            return;
          }
          initAppShell("student");

          var student = DEMO_STUDENTS.find(function (s) {
            return s.username === session.username;
          });
          var timetable =
            typeof getStudentLectureTimetable === "function"
              ? getStudentLectureTimetable(student)
              : null;

          /* ---- Empty state ---- */
          if (!timetable || !timetable.slots || !timetable.slots.length) {
            document.querySelector(".timetable-desktop").innerHTML =
              '<div class="card"><div class="empty-state">' +
              '<div class="empty-icon"><i class="fa-solid fa-calendar-xmark"></i></div>' +
              "<h3>No timetable available yet</h3>" +
              "<p>The lecture timetable for your department" +
              (student ? " (" + Util.escape(student.department) + ")" : "") +
              (student ? " at " + Util.escape(student.level) + " Level" : "") +
              " has not been published." +
              "</p>" +
              "</div></div>";
            document.querySelector(".timetable-mobile").innerHTML = "";
            document.getElementById("dl-lecture").disabled = true;
            return;
          }

          var slots = timetable.slots;

          /* ---- Download as PDF ---- */
          document
            .getElementById("dl-lecture")
            .addEventListener("click", function () {
              PdfGenerator.open({
                type: "lectures",
                title: "Lecture Timetable",
                subtitle:
                  student.department +
                  " — " +
                  student.level +
                  " Level · First Semester 2026/2027",
                data: {
                  days: DAYS,
                  slots: slots,
                },
              });
            });

          /* ---- Desktop grid rows ---- */
          var body = document.getElementById("timetable-body");
          slots.forEach(function (slot) {
            var row = document.createElement("div");
            row.className = "timetable-row";

            var timeCell = document.createElement("div");
            timeCell.className = "timetable-cell timetable-time";
            timeCell.textContent = slot.time;
            row.appendChild(timeCell);

            DAYS.forEach(function (day) {
              var cell = document.createElement("div");
              cell.className = "timetable-cell";
              var period = slot.periods[day];

              if (!period) {
                cell.classList.add("is-empty");
              } else {
                cell.innerHTML =
                  '<div class="class-block class-block-' +
                  period.color +
                  '">' +
                  "<strong>" +
                  Util.escape(period.code) +
                  "</strong>" +
                  '<span><i class="fa-solid fa-location-dot"></i> ' +
                  Util.escape(period.venue) +
                  "</span>" +
                  '<span><i class="fa-solid fa-user"></i> ' +
                  Util.escape(period.lecturer) +
                  "</span>" +
                  "</div>";
              }
              row.appendChild(cell);
            });

            body.appendChild(row);
          });

          /* ---- Mobile stacked view ---- */
          var mobileRoot = document.getElementById("timetable-mobile");
          var today = new Date().toLocaleDateString("en-GB", {
            weekday: "long",
          });

          DAYS.forEach(function (day) {
            var daySlots = slots.filter(function (s) {
              return s.periods[day];
            });

            var card = document.createElement("div");
            card.className = "timetable-day-card";
            if (day === today) card.classList.add("is-today");

            var header =
              '<div class="timetable-day-head">' +
              "<h3>" +
              day +
              (day === today
                ? ' <span class="badge badge-brand" style="margin-left:6px;">Today</span>'
                : "") +
              "</h3>" +
              '<span class="timetable-day-count">' +
              (daySlots.length === 0
                ? "No lectures"
                : daySlots.length +
                  " lecture" +
                  (daySlots.length === 1 ? "" : "s")) +
              "</span>" +
              "</div>";

            var bodyHtml;
            if (daySlots.length === 0) {
              bodyHtml =
                '<div class="timetable-day-empty">' +
                '<i class="fa-regular fa-circle-check"></i>' +
                "<span>No lectures scheduled</span>" +
                "</div>";
            } else {
              bodyHtml = daySlots
                .map(function (s) {
                  var p = s.periods[day];
                  return (
                    '<div class="timetable-slot">' +
                    '<div class="timetable-slot-time">' +
                    Util.escape(s.time) +
                    "</div>" +
                    '<div class="class-block class-block-' +
                    p.color +
                    '">' +
                    "<strong>" +
                    Util.escape(p.code) +
                    "</strong>" +
                    '<span><i class="fa-solid fa-location-dot"></i> ' +
                    Util.escape(p.venue) +
                    "</span>" +
                    '<span><i class="fa-solid fa-user"></i> ' +
                    Util.escape(p.lecturer) +
                    "</span>" +
                    "</div>" +
                    "</div>"
                  );
                })
                .join("");
            }

            card.innerHTML =
              header + '<div class="timetable-day-body">' + bodyHtml + "</div>";
            mobileRoot.appendChild(card);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
