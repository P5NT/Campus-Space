<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Profile Images — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body class="has-session admin-body">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar admin-sidebar" id="app-sidebar"></aside>
      <div class="app-main">
        <header class="app-header" id="app-header"></header>
        <main class="app-content" id="main">
          <div class="page-head">
            <div class="page-head-text">
              <h1 class="page-title">Admin Profile Images</h1>
              <p class="page-subtitle">
                Manage the profile images that appear on Admin posts in the
                community.
              </p>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h3>Admin profile images</h3></div>
            <div class="card-body" style="padding-top: 0">
              <div class="setting-row">
                <div class="setting-row-info">
                  <h4>Space Admin avatar</h4>
                  <p>
                    This image appears publicly on all Admin posts across the
                    platform.
                  </p>
                </div>
                <div class="cluster">
                  <span
                    class="avatar avatar-48 avatar-fallback"
                    style="background: var(--brand-secondary)"
                    >SA</span
                  >
                  <button class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-upload"></i> Change image
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-top: 20px">
            <div class="card-head"><h3>Individual Admin images</h3></div>
            <div class="card-body" style="padding-top: 0">
              <div id="admin-images"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="mobile-menu-backdrop"></div>
    <aside
      class="mobile-menu"
      id="mobile-menu-mount"
      aria-label="Mobile menu"
    ></aside>

    <script src="../../data/students.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const session = Auth.current();
        if (!session || session.role !== "super_admin") {
          window.location.href = "../auth/login.html";
          return;
        }
        initAppShell("admin");

        const wrap = document.getElementById("admin-images");
        DEMO_ADMINS.forEach((a) => {
          const el = document.createElement("div");
          el.className = "setting-row";
          el.innerHTML = `
      <div class="setting-row-info">
        <h4>${Util.escape(a.firstName + " " + a.lastName)} <span class="role-chip ${a.role === "super_admin" ? "role-super" : "role-admin"}">${a.role === "super_admin" ? "Super Admin" : "Admin"}</span></h4>
        <p>@${Util.escape(a.username)}</p>
      </div>
      <div class="cluster">
        <span class="avatar avatar-48 avatar-fallback">${Util.initials(a.firstName + " " + a.lastName)}</span>
        <button class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-upload"></i> Change
        </button>
      </div>`;
          wrap.appendChild(el);
        });
      });
    </script>
  </body>
</html>
