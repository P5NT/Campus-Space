<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="auth-layout">
      <aside class="auth-aside" aria-hidden="true">
        <div class="auth-aside-content">
          <div class="auth-aside-brand">
            <img
              src="../../assets/icons/brand-icon.svg"
              alt=""
              width="40"
              height="40"
            />
            <span>Campus Space</span>
          </div>
          <h2>One last step.</h2>
          <p>
            We've sent a 4-digit verification code to your email. Enter it to
            complete your registration.
          </p>
        </div>
      </aside>

      <main class="auth-main">
        <div class="auth-form-wrap">
          <div class="auth-brand-mobile">
            <img
              src="../../assets/icons/brand-icon.svg"
              alt=""
              width="34"
              height="34"
            />
            <span>Campus Space</span>
          </div>

          <h1 class="auth-title">Verify your email</h1>
          <p class="auth-subtitle">
            Enter the 4-digit code sent to your email to complete registration.
          </p>

          <div
            class="demo-box"
            style="
              background: var(--info-soft);
              border-color: rgba(44, 111, 168, 0.25);
            "
          >
            <h5 style="color: var(--info)">
              <i class="fa-solid fa-circle-info"></i> Demo: your code
            </h5>
            <div class="row">
              <span>Use this code:</span> <code id="otp-hint">----</code>
            </div>
          </div>

          <form id="verify-form" novalidate>
            <div
              class="otp-inputs"
              id="otp-container"
              role="group"
              aria-label="Verification code"
            >
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 1"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 2"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 3"
              />
              <input
                class="otp-input"
                type="text"
                inputmode="numeric"
                maxlength="1"
                aria-label="Digit 4"
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary btn-block btn-lg"
              id="verify-submit"
            >
              Verify and continue
            </button>
          </form>

          <p class="auth-foot">
            Didn't receive it? <a href="#" id="otp-resend">Resend code</a>
          </p>
        </div>
      </main>
    </div>

    <script src="../../js/main.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
