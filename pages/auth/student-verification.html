  <body>
    <div class="status-page">
      <div class="status-icon brand">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1>Verification in progress</h1>
      <p>
        Super Admin uploads the official student-detail records used for
        verification. Once your registration is verified, your account will be
        fully activated. This happens automatically — no action is required from
        you.
      </p>
      <div class="cluster">
        <a href="login.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Continue to sign in
        </a>
        <a href="../student/help-support.html" class="btn btn-secondary btn-lg">
          Need help?
        </a>
      </div>
    </div>
    <script src="../../js/main.js"></script>
