<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Successful — Campus Space</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/favicon/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../../assets/favicon/site.webmanifest" />
    <meta name="theme-color" content="#B33A3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="status-page">
      <!-- Brand mark -->
      <img
        src="../../assets/icons/brand-icon.svg"
        alt=""
        width="48"
        height="48"
        style="margin-bottom: 20px"
      />

      <!-- Success icon -->
      <div
        class="status-icon"
        style="background: var(--success-soft); color: var(--success)"
      >
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <h1>Password reset successful</h1>
      <p>
        Your password has been updated. You can now sign in with your new
        password.
      </p>

      <div class="cluster" style="justify-content: center">
        <a href="login.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </a>
        <a href="../student/help-support.html" class="btn btn-secondary btn-lg">
          <i class="fa-solid fa-circle-question"></i> Need help?
        </a>
      </div>

      <!-- Small security note -->
      <p
        style="
          font-size: var(--fs-xs);
          color: var(--text-tertiary);
          margin-top: 32px;
          max-width: 420px;
        "
      >
        For security, if you didn't request this change, please contact Campus
        Space support immediately.
      </p>
    </div>
    <script src="../../js/main.js"></script>
  </body>
</html>
